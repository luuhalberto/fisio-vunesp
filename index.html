issecular, não se daria (em nenhum momento daria-se) como um processo automático e sem turbulência...","...ainda que a complexidade das situações recorrentemente nos espante (sempre espante-nos)."],"a":"C","e":"Ao trocar “Sempre se soube” por “Soube-se o tempo todo”, sai o advérbio que atraía o pronome. A frase começa pelo verbo, então a ênclise fica obrigatória. Nas outras, o “que” (A, E) e o “não”/“nenhum” (D) atraem o pronome, e não se começa frase com oblíquo (B)."},{"t":"q","n":8,"stem":"A expressão destacada, do 1º parágrafo, que está empregada em sentido próprio é:","o":["... envelheceu a ideia de uma modernidade...","... a modernidade dita neoliberal...","... com o colapso do socialismo de Estado...","... pecou por déficit crescentemente intolerável...","... apesar das desigualdades, apareceu no cenário."],"a":"B","e":"Gabarito oficial: B. Em “a modernidade <b>dita</b> neoliberal”, “dita” mantém o sentido próprio de “chamada, denominada”. “Envelheceu a ideia”, “colapso do socialismo”, “pecou” e “cenário” são usos figurados."},{"t":"q","n":9,"stem":"A alternativa redigida de acordo com a norma-padrão de concordância nominal e verbal é:","o":["Estão havendo sinais de enfraquecimento das ideias dos norte-americanos sobre diretriz socioeconômicas.","Sabe-se que ainda existe sinais do neoliberalismo nas economias mundiais e em bastante países.","Alguns movimentos contemporâneos podem estarem mostrando sinais de enfraquecimento de valores sociais.","Já foi constatado pelo autor diversos fatores que vem levando países a desenvolver armas nucleares.","Mais de um país se encontra ameaçado pela aplicação de inteligência artificial a muitos conflitos armados."],"a":"E","e":"Com “mais de um”, o verbo fica no <b>singular</b>: “Mais de um país se encontra…”. Os erros das outras: “estão havendo” deveria ser “está havendo” (A), “existe sinais” deveria ser “existem” (B), “podem estarem” deveria ser “podem estar” (C) e “foi constatado diversos fatores” deveria ser “foram constatados” (D)."},{"t":"q","n":10,"stem":"Assinale a alternativa redigida de acordo com a norma-padrão de emprego do acento indicativo de crase.","o":["Chegou à envelhecer a ideia de uma modernidade que aderia à expansão contínua da mercantilização.","A interdependência entre os sistemas econômicos foi até às últimas consequências, caminhando passo à passo.","Vamos assistir à muitos desastres, como é óbvio, e serão poucos os povos que sobreviverão à todos eles.","Sempre se soube que o gênero humano tem tendência à turbulência e que direciona suas forças à guerra.","A política muitas vezes estende frutos daninhos à uns e outros, levando as populações à uma imensa crise."],"a":"D","e":"“Tendência <b>à</b> turbulência” e “direciona … <b>à</b> guerra”: há preposição “a” e artigo feminino. Não há crase antes de verbo (“à envelhecer”), de palavra repetida (“passo a passo”), de pronome indefinido (“à muitos”, “à todos”, “à uns”) nem de artigo indefinido (“à uma”)."},{"t":"h","x":"Matemática e Raciocínio Lógico"},{"t":"q","n":11,"stem":"Com o objetivo de realizar uma reforma, Rogério reservou certa quantidade x de recursos, em reais, que prevê o custo com a mão de obra do profissional executante e o custo dos materiais, a saber: 5 latas de tinta, 1 rolo de pintura, 2 pincéis, 1 saco de argamassa e 5 lixas. Rogério contratará um profissional que cobrará, pela mão de obra, R$ 2.500,00, e, quanto aos materiais, ele os comprou em uma loja onde os referidos itens são vendidos sob os seguintes preços unitários:<table class=\"xl\"><tr><th>Item</th><th>Lata de tinta</th><th>Rolo de pintura</th><th>Pincel</th><th>Saco de argamassa</th><th>Lixa</th></tr><tr><th>Preço unitário (R$)</th><td>125,00</td><td>34,20</td><td>12,80</td><td>16,80</td><td>4,50</td></tr></table>Se, depois de somados todos os custos envolvidos, sobraram ainda R$ 175,90 do valor inicialmente reservado, é correto afirmar que x é igual a","o":["3.550.","3.500.","3.450.","3.400.","3.350."],"a":"D","e":"Os materiais custam 5×125 + 34,20 + 2×12,80 + 16,80 + 5×4,50 = R$ 724,10. Com a mão de obra, o total é R$ 3.224,10. Somando a sobra, x = 3.224,10 + 175,90 = <b>3.400</b>."},{"t":"q","n":12,"stem":"O computador de Pedro tem um espaço de armazenamento total de 760 GB. Ele dividirá esse espaço de armazenamento em três partes, cada uma destinada a armazenar os dados de uma destas três categorias: processos judiciais, dados de cadastro e normas técnicas. Pedro fará essa divisão de maneira que cada parte desse espaço de armazenamento seja diretamente proporcional ao número estimado de arquivos de cada categoria, que são: 80 para processos judiciais, 120 para dados de cadastro e 180 para normas técnicas. Nessas condições, serão destinados, para normas técnicas,","o":["320 GB.","330 GB.","340 GB.","350 GB.","360 GB."],"a":"E","e":"Total de partes: 80 + 120 + 180 = 380. Para normas técnicas: 760 × 180/380 = <b>360 GB</b>."},{"t":"q","n":13,"stem":"A soma dos lucros líquidos de duas empresas, A e B, no mês de maio de 2025, é R$ 70.000,00. Sabe-se que o lucro líquido da empresa B no referido mês, quando comparado ao lucro líquido da empresa A, correspondeu a um valor 50% maior. Então, a diferença entre os lucros líquidos das empresas B e A, em maio de 2025, foi","o":["R$ 7.000,00.","R$ 14.000,00.","R$ 21.000,00.","R$ 28.000,00.","R$ 35.000,00."],"a":"B","e":"A + 1,5A = 70.000, então A = 28.000 e B = 42.000. A diferença é <b>R$ 14.000,00</b>."},{"t":"q","n":14,"stem":"Mauro está estudando a localização de 3 pontos estratégicos de sua cidade, que chamaremos de A, B e C. A figura (no caderno original) ilustra essa situação. Sabe-se que o ângulo com vértice em B é reto e que as distâncias entre os pontos A e B e entre os pontos A e C são, respectivamente, iguais a 3.000 m e 3.400 m. A partir dessas informações, Mauro pôde concluir que a distância entre os pontos B e C é igual a","o":["1.600 m.","1.700 m.","1.800 m.","1.900 m.","2.000 m."],"a":"A","e":"O triângulo é retângulo em B, e AC é a hipotenusa. BC² = 3.400² − 3.000² = 2.560.000, logo BC = <b>1.600 m</b>."},{"t":"q","n":15,"stem":"Pâmela presenteará seu esposo com um kit de perfumaria. Esse kit será formado pelos seguintes itens e suas quantidades: 1 perfume, 3 sabonetes e 2 loções pós-barba. Para a escolha dos itens que integrarão esse kit, existem 8 opções de perfume, 6 opções de sabonete e 5 opções de loção pós-barba, todos diferentes entre si, e Pâmela não vai repetir itens na formação do kit. Sabendo que, na montagem de um kit, a ordem dos itens escolhidos não importa, então o número total de kits que podem ser montados é igual a","o":["240.","1.440.","1.600.","9.600.","10.200."],"a":"C","e":"São 8 perfumes × C(6,3) sabonetes × C(5,2) loções = 8 × 20 × 10 = <b>1.600</b> kits."},{"t":"h","x":"Legislação"},{"t":"q","n":16,"stem":"Antônia é estudante universitária e, em visita à biblioteca da universidade pública a que é vinculada, pediu aos servidores públicos presentes no local acesso às informações sobre a aquisição de obras literárias integrantes do acervo especial da biblioteca, bem como à relação dos periódicos científicos internacionais dos quais a instituição possui assinatura. O acesso a essas informações foi negado de maneira simples e sem maiores explicações, mesmo após a insistência de Antônia. Com base na situação hipotética e no disposto na Constituição Federal, é correto afirmar que Antônia","o":["não pode adotar providências judiciais ou administrativas, pois é constitucionalmente assegurado o sigilo das informações pertencentes à administração.","somente teria acesso às informações caso se referissem a dados relativos a sua própria pessoa.","precisará ajuizar uma ação popular para assegurar o conhecimento de informações constantes dos registros.","tem o direito de formalizar o pedido administrativamente no exercício do direito de petição, independentemente do pagamento de taxas.","deve propor mandado de injunção para obter o acesso às informações, desde que exponha as razões que justificam o interesse nesses dados."],"a":"D","e":"O <b>direito de petição</b> aos Poderes Públicos é assegurado “independentemente do pagamento de taxas” (CF, art. 5º, XXXIV, a). O caso não é de ação popular, mandado de injunção nem sigilo."},{"t":"q","n":17,"stem":"Flávia, assistente técnica em um campus universitário, estava realizando a instalação de programas de computação com a ajuda de Fábio, jovem funcionário recém-contratado por uma empresa terceirizada para prestar serviços de suporte técnico na universidade. Fábio relatou a sua insatisfação com o emprego e as condições de trabalho, pois o seu empregador estaria descumprindo várias regras constitucionais. Com base na situação hipotética, Flávia pode confirmar que realmente viola a Constituição Federal:","o":["a redução, em qualquer hipótese, do salário fixado no contrato de trabalho.","o pagamento de salário inferior ao mínimo, salvo aos que recebem remuneração variável.","remuneração do trabalho noturno igual ao realizado por ele no período diurno.","pagamento de salário-família ao trabalhador de baixa renda, independentemente da existência de dependentes.","autorização para o trabalho noturno a menores de vinte e um anos."],"a":"C","e":"A CF garante remuneração do trabalho noturno <b>superior</b> à do diurno (art. 7º, IX). Pagar igual viola a Constituição. A redução de salário é possível por convenção ou acordo coletivo (A), e o trabalho noturno é proibido a menores de <b>18</b> anos, não de 21 (E)."},{"t":"q","n":18,"stem":"Com base na Constituição Federal, a respeito dos servidores públicos, assinale a alternativa correta.","o":["Em caso de prática de improbidade administrativa, o agente será preso, perderá a função pública, terá seus direitos públicos suspensos e deverá ressarcir o erário.","Não serão computados no limite remuneratório constitucional as parcelas de caráter indenizatório expressamente previstas em lei ordinária, aprovada pelo Congresso Nacional, de caráter nacional, aplicada a todos os Poderes e órgãos constitucionalmente autônomos.","A aposentadoria concedida com a utilização de tempo de contribuição decorrente de cargo, emprego ou função pública acarretará o rompimento do vínculo que gerou o referido tempo de contribuição, salvo para os agentes vinculados ao Regime Geral de Previdência Social.","As pessoas jurídicas de direito público e as de direito privado prestadoras de serviços públicos responderão, em qualquer hipótese, pelos danos que seus agentes, nessa qualidade, causarem a terceiros, vedado o exercício do direito de regresso contra o responsável em caso de culpa.","O servidor público da administração direta, autárquica e fundacional, no exercício de mandato eletivo, investido no mandato de prefeito ou vereador, será automaticamente afastado do cargo, emprego ou função, sendo-lhe facultado optar pela sua remuneração."],"a":"B","e":"O art. 37, §11, da CF exclui do teto as <b>parcelas indenizatórias</b> previstas em lei. Improbidade não leva à prisão automática (A). Há direito de regresso em caso de dolo ou culpa (D). O vereador pode acumular o cargo se os horários forem compatíveis (E)."},{"t":"q","n":19,"stem":"A respeito da ordem social, com base na Constituição Federal, assinale a alternativa correta.","o":["A assistência social será oferecida a quem dela demonstrar necessidade, desde que haja comprovação do pagamento de contribuição à seguridade social.","A saúde é direito de todos e dever do Estado, que a promoverá mediante a realização de políticas que restrinjam o acesso a tratamentos médicos aos que demonstrem incapacidade financeira de arcar com seus custos com recursos próprios.","A assistência à saúde é livre à iniciativa privada, e as empresas poderão atuar de maneira complementar ao Sistema Único de Saúde, desde que tenham caráter filantrópico.","As universidades gozam de autonomia didático-científica, administrativa e de gestão financeira e patrimonial e podem admitir professores, técnicos e cientistas estrangeiros, na forma da lei.","Os Estados e o Distrito Federal devem vincular cinco por cento de sua receita tributária líquida para o financiamento de programas e projetos culturais."],"a":"D","e":"O art. 207 garante às universidades <b>autonomia didático-científica, administrativa e de gestão financeira e patrimonial</b>, e o §1º permite admitir professores, técnicos e cientistas estrangeiros."},{"t":"q","n":20,"stem":"Considere que Juliano, assistente de suporte acadêmico, exerce suas atividades junto à Comissão Permanente de Avaliação (CPA) e está conversando com Mariana, que deseja entender melhor como funciona a estrutura e o funcionamento do órgão. Com base no Regimento Geral da Unesp, Juliano poderá afirmar corretamente que","o":["a CPA consiste em um órgão vinculado diretamente ao reitor, composto de onze membros, indicados dentre os docentes da Unesp, em exercício.","cabe à CPA decidir sobre a forma de aplicação dos regimes especiais de trabalho dos docentes, bem como sobre o regime de trabalho dos pesquisadores, seguidas as orientações do Conselho de Ensino, Pesquisa e Extensão Universitária.","cabe à CPA, entre outras atribuições, baixar normas sobre trancamento e cancelamento de matrícula, bem como assessorar o reitor sobre assuntos referentes a propriedade intelectual e inovação.","o quadro de pessoal técnico e administrativo vinculado à CPA está, também, integrado à estrutura administrativa do Conselho Universitário e ambos os órgãos são vinculados diretamente ao reitor.","a CPA é um órgão vinculado à Congregação e tem por atribuição opinar sobre propostas de admissão, transferência, dispensa ou renovação de contrato de pessoal docente, ouvido o departamento interessado."],"a":"A","e":"Gabarito oficial: A. Pelo Regimento Geral da Unesp, a CPA é <b>vinculada ao reitor</b> e composta de onze membros docentes."},{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":21,"stem":"A altura de bancadas para aulas práticas deve ser adequada aos dados antropométricos da população brasileira. A altura recomendada pelo Instituto Nacional de Tecnologia (INT) para essas bancadas, com o objetivo de que possam acomodar pessoas de diferentes percentis, é:","o":["110 cm","100 cm","90 cm","80 cm","70 cm"],"a":"C","e":"O INT recomenda bancadas de cerca de <b>90 cm</b> para acomodar usuários de diferentes percentis."},{"t":"q","n":22,"stem":"Os procedimentos relacionados a verificar a disponibilidade e o funcionamento do equipamento, a agendar a data e o horário de uso para os equipamentos de multiusuários, a ter disponíveis o protocolo de uso e limpeza do equipamento, bem como o manual do equipamento e o nome do responsável para solucionar dúvidas de operação ou para as situações de emergência, referem-se a que tipo de atividades laboratoriais?","o":["Práticas seguras.","Manuseio de vidraria e outros materiais.","Preparo de reagentes e soluções.","Procedimentos operacionais.","Manuseio de equipamentos e instrumentos."],"a":"E","e":"Checar a disponibilidade, agendar, ter o protocolo de uso e limpeza, o manual e o responsável por perto são atividades de <b>manuseio de equipamentos e instrumentos</b>."},{"t":"q","n":23,"stem":"Como devem ser posicionadas as vidrarias maiores em uma bancada de laboratório?","o":["Na parte central das bancadas, evitando-se que os cabos elétricos atravessem a área de trabalho.","Na parte esquerda anterior das bancadas, evitando-se que os cabos elétricos atravessem a área de trabalho.","Na parte posterior e à direita na bancada.","Na parte anterior e à esquerda na bancada.","Na parte central e anterior na bancada."],"a":"C","e":"Vidrarias maiores ficam na parte <b>posterior e à direita</b> da bancada, longe da área de trabalho, para diminuir o risco de quebra."},{"t":"q","n":24,"stem":"A manutenção de equipamentos de Fisioterapia é preconizada pelo Conselho Federal de Fisioterapia e Terapia Ocupacional (COFFITO). Se o laboratório de Fisioterapia da UNESP atende pacientes, como essa manutenção deve ser realizada de acordo com a resolução do COFFITO 589/2024?","o":["De forma corretiva, com certificado expedido por órgãos comprovadamente competentes, com período de manutenção definido em 1 ano.","De forma preventiva e corretiva, com certificado expedido por órgãos comprovadamente competentes, sem período de manutenção definido.","De forma preventiva, com certificado expedido por órgãos comprovadamente competentes, com período de manutenção definido em 1 ano.","Os equipamentos devem ser enviados ao fabricante, que certificará o correto funcionamento e enviará um certificado de validade da manutenção por 1 ano.","Os equipamentos devem ser enviados ao fabricante, que certificará o correto funcionamento e enviará um certificado de validade da manutenção por 2 anos."],"a":"B","e":"A Resolução COFFITO 589/2024 exige manutenção <b>preventiva e corretiva</b>, comprovada por certificado de órgão competente, sem fixar um período."},{"t":"q","n":25,"stem":"A limpeza do transdutor de um equipamento de ultrassom terapêutico deve ser realizada após cada aplicação. Para reduzir significativamente o nível de contaminação do transdutor, a limpeza deve ser feita com álcool","o":["30%","40%","50%","60%","70%"],"a":"E","e":"A desinfecção do cabeçote de ultrassom após cada uso é feita com <b>álcool 70%</b>, que tem a melhor ação antimicrobiana."},{"t":"q","n":26,"stem":"Um laboratório que contenha condições adequadas para higiene pessoal dos usuários deve conter","o":["lavatórios para higienização das mãos, chuveiros de emergência e lava-olhos e pias para lavagem e descontaminação de materiais.","instalações sanitárias e vestiários internos ao ambiente de laboratório, com lavatórios para higienização das mãos.","instalações sanitárias e vestiários externos ao ambiente de laboratório, com lavatórios para higieniza- 30. Se existe ção das mãos presentes nos vestiários.","apenas pias para lavagem e descontaminação de materiais, sendo que outras atividades devem ser feitas em vestiários externos ao ambiente de laboratório.","instalações sanitárias e vestiários internos ao ambiente de laboratório, com lavatórios para higienização das mãos instalados externamente ao laboratório."],"a":"A","e":"Para a higiene pessoal, o laboratório precisa de <b>lavatórios para as mãos, chuveiro de emergência e lava-olhos</b>, além de pias para descontaminar materiais."},{"t":"q","n":27,"stem":"Qual procedimento é recomendado pela Secretaria Municipal de Saúde de Presidente Prudente para higienização das mãos?","o":["Enxaguar as mãos, retirando os resíduos de sabonete, no sentido do punho para os dedos.","Enxaguar as mãos, retirando os resíduos de sabonete, no sentido dos dedos para os punhos.","Ensaboar os espaços interdigitais.","Ensaboar as polpas digitais e unhas da mão esquerda contra a palma da mão direita.","Ensaboar as mãos, especificamente a região da palma, no sentido horário e anti-horário."],"a":"B","e":"No enxágue, a água corre <b>dos dedos para os punhos</b>, para não levar sujeira de volta às mãos."},{"t":"q","n":28,"stem":"Assinale a alternativa que descreve uma medida de proteção organizacional que pode ser implementada em laboratórios em que haja manuseio direto de agentes químicos, biológicos, radioativos ou outros.","o":["Alteração no processo laboratorial empregando tecnologias que minimizem as situações de risco e o impacto ambiental.","Isolamento da fonte de risco, como o isolamento acústico de equipamentos geradores de ruído.","Redução do tempo de exposição do pessoal de laboratório aos riscos, por meio de rodízio ou redução da jornada de trabalho.","Substituição de matérias-primas e insumos por produtos menos prejudiciais à saúde.","Instalação de sistemas de ventilação, de exaustão ou insuflamento que evitem a dispersão de contaminantes no ambiente, diluam a concentração de poluentes e ofereçam conforto térmico."],"a":"C","e":"Medidas <b>organizacionais</b> mexem no modo de trabalhar, como rodízio e redução do tempo de exposição. As outras são medidas de engenharia ou de substituição."},{"t":"q","n":29,"stem":"Durante a realização de trabalhos que exijam o manuseio de produtos com líquidos ou de produtos químicos que requeiram melhor aderência no manuseio, na lavagem de material, no manuseio de ácidos e óleos, que tipo de luva deve ser utilizada?","o":["PVC.","Látex.","Neoprene.","Borracha butílica.","Nitrilo."],"a":"A","e":"Gabarito oficial: A. Luvas de <b>PVC</b> são indicadas para líquidos, ácidos e óleos e para lavar material, porque dão melhor aderência."},{"t":"q","n":30,"stem":"Se existe no laboratório de pesquisa um nível de ruído de 115 dB (decibéis), por até quantos minutos o pesquisador pode ficar exposto a esse ruído?","o":["30","25","20","15","7"],"a":"E","e":"Pela NR-15 (Anexo 1), a 115 dB(A) o limite de exposição é de <b>7 minutos</b>."},{"t":"q","n":31,"stem":"Que tipo de resíduos infectantes precisam de tratamento antes de sair do laboratório onde ocorreu a sua utilização?","o":["Sobras de amostras de laboratório contendo sangue ou líquidos corpóreos.","Recipientes e materiais contaminados provenientes da manipulação de amostras humanas.","Recipientes e materiais contaminados provenientes de filtros de ar e gases aspirados de área contaminada.","Material feito de pequenas lascas ou fragmentos de madeira, semelhante a serragem, utilizado como forragem ou cama para animais.","Bolsas transfusionais vazias ou com volume residual."],"a":"A","e":"Gabarito oficial: A. Sobras de amostras com <b>sangue ou líquidos corpóreos</b> (grupo A) precisam de tratamento antes de deixar a unidade geradora."},{"t":"q","n":32,"stem":"A bancada de um laboratório de pesquisa apresenta um mapa de risco com as cores verde e azul. Os tipos de riscos que essa bancada apresenta são","o":["ergonômico e biológico.","químico e físico.","físico e acidental.","biológico e acidental.","biológico e ergonômico."],"a":"C","e":"No mapa de risco, <b>verde = físico</b> e <b>azul = acidente</b>. Vermelho é químico, marrom é biológico e amarelo é ergonômico."},{"t":"q","n":33,"stem":"Entre as boas práticas de armazenamento de produtos químicos em laboratório de pesquisa, encontra-se a de","o":["armazená-los diretamente sobre o piso, próximo ao teto ou luminárias.","deixar espaço livre entre as embalagens, de modo que se possa manuseá-las sem risco.","utilizar apenas critérios como classe química, tamanho de frasco e ordem alfabética no armazenamento.","armazenar reativos com água próximo a pias, chuveiros, sprinklers ou outros dispositivos.","usar prateleiras de metal para produtos corrosivos, a menos que sejam pintadas com tinta especial (tinta epóxi)."],"a":"B","e":"Deixar <b>espaço entre as embalagens</b> permite manusear sem risco. Não se armazena no piso nem perto do teto, nem reativos com água perto de pias. Corrosivos não ficam em prateleira de metal."},{"t":"q","n":34,"stem":"Um equipamento de laboratório necessita de manutenção para que possa realizar corretamente suas funções, e, nesse contexto, a NBR 5462/1994 determina tipos de manutenção que podem ser realizados em equipamentos. Nessa norma, a manutenção controlada/preditiva é definida como","o":["a manutenção que é efetuada em intervalos predeterminados, ou de acordo com critérios prescritos, destinada a reduzir a probabilidade de falha ou a degradação do funcionamento de um item.","a manutenção que é efetuada após a ocorrência de uma pane, destinada a recolocar um item em condições de executar uma função requerida.","a manutenção que não é feita de acordo com um programa preestabelecido, mas depois da recepção de uma informação relacionada ao estado de um item.","a manutenção que permite garantir uma qualidade de serviço desejada, com base na aplicação sistemática de técnicas de análise, utilizando-se de meios de supervisão centralizados ou de amostragem, para reduzir ao mínimo a manutenção preventiva e diminuir a manutenção corretiva.","a manutenção preventiva efetuada de acordo com um programa preestabelecido."],"a":"D","e":"Pela NBR 5462, a manutenção <b>controlada/preditiva</b> garante a qualidade do serviço com técnicas de análise e supervisão (centralizada ou por amostragem), reduzindo a preventiva e a corretiva."},{"t":"q","n":35,"stem":"Um equipamento de laboratório foi adquirido pelo regime de aditamento na UNESP de Presidente Prudente. A Instituição prevê que esse regime de compra ocorra","o":["em casos excepcionais, mas sem emergência ou urgência.","quando a compra supere o valor de 20 mil reais.","quando a compra supere o valor de 30 mil reais.","em casos excepcionais em razão de emergência ou urgência.","em serviços que admitem que a aquisição possa ser realizada pelo processo normal de aplicação."],"a":"D","e":"O aditamento é previsto para casos <b>excepcionais, de emergência ou urgência</b>."},{"t":"q","n":36,"stem":"Observe as imagens a seguir: <i>(imagens no caderno original)</i><br>Quando um projetor de multimídia é instalado em posição abaixo do centro da tela, como, por exemplo, em uma mesa, a imagem projetada apresenta uma distorção em forma de trapézio, como na imagem superior. Para corrigir essa distorção, recuperando a correta proporção da imagem, como na imagem inferior, usa-se o ajuste","o":["Auto balance.","Auto Input.","Distort mode.","Keystone.","Shift color."],"a":"D","e":"A distorção em trapézio se corrige com o ajuste <b>Keystone</b>."},{"t":"q","n":37,"stem":"Observe a imagem a seguir: <i>(imagem no caderno original)</i><br>Na imagem apresentada, os conectores indicados pelos números 1 e 2 são, respectivamente, dos tipos","o":["DisplayPort e DVI-D.","DisplayPort e HDMI.","DVI-D e HDMI.","HDMI e DVI-D.","HDMI e DisplayPort."],"a":"B","e":"Questão com imagem no caderno. Gabarito oficial: <b>B</b> (1 = DisplayPort, 2 = HDMI).","img":true},{"t":"q","n":38,"stem":"Nas instalações de sonorização, pode surgir um fenômeno conhecido como microfonia, que se caracteriza por um som agudo e de alta intensidade e é decorrente de","o":["uso de amplificadores com baixa potência de saída.","uso de microfones do tipo eletreto, de baixa sensibilidade.","uso simultâneo de caixas acústicas ativas e passivas.","falha no casamento de impedância entre os microfones e as entradas da mesa de áudio.","realimentação acústica, quando um microfone capta o som amplificado emitido por uma caixa acústica."],"a":"E","e":"Microfonia é a <b>realimentação acústica</b> (feedback): o microfone capta o som da caixa e o realimenta."},{"t":"q","n":39,"stem":"No software Microsoft Powerpoint, acionar o Modo de Exibição do Apresentador permite que","o":["as anotações sejam apresentadas na parte inferior da tela, em tom esmaecido.","a apresentação seja feita de modo automático, ao executar o arquivo, sem necessidade de clicar no ícone de exibição.","os slides e as anotações do orador sejam apresentados na tela do computador do apresentador, enquanto o projetor mostra apenas os slides.","o controle do programa possa ser feito por meio de um apontador laser.","a apresentação seja transmitida simultaneamente por uma plataforma de streaming."],"a":"C","e":"O Modo de Exibição do Apresentador mostra <b>slides e anotações no computador</b> de quem apresenta, enquanto o projetor mostra só os slides."},{"t":"q","n":40,"stem":"Com relação à suíte Google Workspace, é correto afirmar que, em sua versão básica (Starter), ela oferece","o":["30 Gigabytes de armazenamento em pool por usuário.","acesso baseado no contexto (CAA).","assinatura eletrônica em documentos Google e PDF.","classificação por IA para o Google Drive.","e-mail comercial personalizado com criptografia S/MIME."],"a":"A","e":"O Google Workspace Business Starter oferece <b>30 GB de armazenamento em pool</b> por usuário. CAA, assinatura eletrônica, classificação por IA e S/MIME são de planos superiores."}],"total":40},{"id":"va","ano":2024,"org":"Prefeitura de Vista Alegre do Alto/SP","cargo":"Fisioterapeuta","data":"20/10/2024","pdf":"https://arquivos.qconcursos.com/prova/arquivo_prova/131543/vunesp-2024-prefeitura-de-vista-alegre-do-alto-sp-fisioterapeuta-prova.pdf","b":[{"t":"h","x":"Língua Portuguesa"},{"t":"txt","x":"<p class=\"t\">Leia a tira para responder às questões de números 01 e 02.</p><p class=\"tira\">Quadro 1: “TEM UM PROVÉRBIO CHINÊS QUE EU NÃO LEMBRO!”<br>Quadro 2: “ACHO QUE ELE DIZ ALGO SOBRE A VIDA!”<br>Quadro 3: “SÓ SEI QUE É MUITO BOM!”<br>Quadro 4: “VOCÊ DEVIA SEGUIR ESSE CONSELHO!”</p><p class=\"src\">(Fernando Gonsales. Níquel Náusea. https://cartum.folha.uol.com.br, 16.02.2024 – texto transcrito da tira)</p>"},{"t":"q","n":1,"stem":"É correto afirmar que a conversa entre os dois personagens da tira","o":["mimetiza o caráter filosófico dos provérbios, com conclusões objetivas.","ensina ao leitor a importância de se esforçar para recuperar uma lembrança.","ilustra a sabedoria milenar chinesa que ensina a rechaçar o que é bom.","tem caráter de aconselhamento, apesar da vagueza que a sustenta.","demonstra a importância de se falar sobre algo para recordar detalhes."],"a":"D","e":"A tira é vaga (o personagem não lembra o provérbio) e mesmo assim termina em <b>conselho</b>: “Você devia seguir esse conselho!”."},{"t":"q","n":2,"stem":"Há trecho da tira reescrito em conformidade com a norma-padrão de regência em:","o":["Há um provérbio chinês de que me esqueci.","Acho que ele se refere de algo sobre a vida.","Só tenho ciência em que é muito bom.","Você carecia a seguir esse conselho.","Você devia observar a esse conselho."],"a":"A","e":"“Esquecer-<b>se de</b>” algo: “provérbio <b>de que</b> me esqueci”. As formas corretas das outras: “refere-se <b>a</b>” (B), “ciência <b>de</b>” (C), “carecia <b>de</b>” (D) e “observar esse conselho” (E, transitivo direto)."},{"t":"txt","x":"<p class=\"t\">Leia o texto para responder às questões de números 03 a 08.</p><p>O avanço da inteligência artificial (IA), nos últimos anos, tem tirado o sono de profissionais de boa parte dos setores da economia e pode haver ainda mais motivos para se preocupar, segundo uma pesquisa.</p><p>A principal revelação do estudo é que oito em cada dez profissionais mulheres nos Estados Unidos (cerca de 59 milhões delas) estão em cargos altamente expostos às mudanças geradas pela IA – contra seis a cada dez homens. Isso não significa, é claro, que todas essas profissionais serão demitidas, mas parte de suas funções deve passar por automatização nos próximos anos.</p><p>“Isso acontece porque homens tendem a assumir mais trabalhos manuais, menos relacionados à tecnologia. Então, não se trata de a IA estar propositalmente desfavorecendo mulheres; se trata de elas ocuparem atualmente mais posições que no futuro serão automatizadas”, explica Mark McNeilly, professor de Marketing e coordenador da pesquisa, referindo-se a áreas como administração, vendas e ciências sociais, que podem sofrer transformações profundas.</p><p>Embora ainda não haja muitas pesquisas desse tipo, um outro estudo realizado por uma empresa britânica aponta uma diferença de gênero no próprio uso da tecnologia. Enquanto 54% dos homens britânicos estão abraçando a IA no seu cotidiano pessoal e profissional, apenas 35% das mulheres têm feito o mesmo. Na opinião de McNeilly, essa diferença tem a ver com a disparidade de objetivos de mulheres e homens no mercado de trabalho.</p><p>Mas ninguém precisa entrar em desespero. Em algumas áreas, por exemplo, recursos tecnológicos devem facilitar a vida dos trabalhadores, segundo McNeilly. Em outras, porém, a transformação pode sim ser radical. Para ele, o mais importante é começar a usar desde já tecnologias envolvendo IA, incorporando-as ao dia a dia. Por outro lado, num mundo ainda mais automatizado, McNeilly prevê que o contato humano deve se tornar cada vez mais importante: “Então dê asas às suas habilidades interpessoais, de criar contatos e de influenciar outras pessoas”.</p><p class=\"src\">(Leonardo Neiva. A Inteligência Artificial vai roubar os empregos das mulheres? https://gamarevista.uol.com.br, 03.03.2024. Adaptado)</p>"},{"t":"q","n":3,"stem":"De acordo com informações presentes no texto, é correto afirmar que","o":["a proporção de mulheres que correm risco de perder o trabalho na área tecnológica é quase o dobro da observada para o sexo masculino.","homens não assumem tantos trabalhos que dependem da tecnologia por não apresentarem capacitação adequada nessa área.","a automatização de certos trabalhos é uma realidade que gera insegurança econômica para ambos os sexos de maneira equilibrada.","as projeções com base no tipo de trabalho e grau de dependência tecnológica não implicam necessariamente perdas reais de emprego.","o baixo uso de inteligência artificial por mulheres é o que tem feito com que especialistas afirmem que a tecnologia vai substituí-las no mercado de trabalho."],"a":"D","e":"O texto diz que estar em cargo exposto à IA “não significa … que todas essas profissionais serão demitidas”."},{"t":"q","n":4,"stem":"Segundo o que se afirma no texto, o pesquisador Mark McNeilly recomenda que","o":["se use, no âmbito profissional, cotidianamente, a inteligência artificial, e se fortaleça a capacidade de interação humana.","se aprenda a fazer trabalhos manuais, de modo a ocupar cargos que hoje são executados por homens.","se expandam as relações interpessoais de modo a tornar o uso da inteligência artificial algo restrito à vida pessoal.","se popularizem os métodos de criação de sistemas de inteligência artificial para que ninguém se sinta excluído.","se incluam mais mulheres em trabalhos manuais, de modo a reverter o processo em curso de automatização."],"a":"A","e":"McNeilly recomenda usar IA desde já no dia a dia e <b>fortalecer as habilidades interpessoais</b>."},{"t":"q","n":5,"stem":"No trecho “… essa diferença tem a ver com a <b>disparidade</b> de objetivos de mulheres e homens no mercado de trabalho” (4º parágrafo), o vocábulo destacado tem como antônimo, no contexto em que foi empregado:","o":["vagarosidade.","multiplicidade.","variação.","semelhança.","vagueza."],"a":"D","e":"Disparidade (diferença) tem como antônimo <b>semelhança</b>."},{"t":"q","n":6,"stem":"Assinale a alternativa em que o vocábulo destacado foi empregado em sentido figurado.","o":["… estão em cargos altamente expostos às mudanças geradas pela IA – contra seis a cada dez homens. (2º parágrafo)","… referindo-se a áreas como administração, vendas e ciências sociais, que podem sofrer transformações profundas. (3º parágrafo)","… um outro estudo realizado por uma empresa britânica aponta uma diferença… (4º parágrafo)","Enquanto 54% dos homens britânicos estão abraçando a IA no seu cotidiano pessoal… (4º parágrafo)","… McNeilly prevê que o contato humano deve se tornar cada vez mais importante… (5º parágrafo)"],"a":"D","e":"“Estão <b>abraçando</b> a IA” é sentido figurado: adotar, aderir."},{"t":"q","n":7,"stem":"Considere os trechos do 4º parágrafo:<br>• \u0007<b>Embora</b> ainda não haja muitas pesquisas desse tipo, um outro estudo realizado por uma empresa britânica aponta uma diferença de gênero no próprio uso da tecnologia.<br>• \u0007<b>Enquanto</b> 54% dos homens britânicos estão abraçando a IA no seu cotidiano pessoal e profissional, apenas 35% das mulheres têm feito o mesmo. Os vocábulos destacados podem ser substituídos, sem prejuízo do sentido e da correção gramatical, respectivamente, por:","o":["Não obstante … Sempre que","Apesar de que … Na medida em que","Mesmo que … Ao passo que","Por mais que … À medida que","De maneira que … Toda vez que"],"a":"C","e":"“Embora” (concessão) = <b>mesmo que</b>. “Enquanto” (contraste) = <b>ao passo que</b>."},{"t":"q","n":8,"stem":"Assinale a alternativa em que o vocábulo destacado pode ser substituído pelo que está entre colchetes, sem prejuízo da norma-padrão de concordância verbal.","o":["… setores da economia e pode haver ainda mais motivos para se preocupar… [podem] (1º parágrafo)","… mas parte de suas funções deve passar por automatização nos próximos anos. [devem] (2º parágrafo)","Então, não se trata de a IA estar propositalmente desfavorecendo mulheres; se trata de elas ocuparem mais posições que no futuro serão automatizadas”… [tratam] (3º parágrafo)","Embora ainda não haja muitas pesquisas muitas pesquisas desse tipo, um outro estudo realizado por uma empresa britânica… [hajam] (4º parágrafo)","Em algumas áreas, por exemplo, recursos tecnológicos devem facilitar a vida dos trabalhadores, segundo McNeilly. (5º parágrafo) [facilitarem]"],"a":"B","e":"Com expressão partitiva (“parte de suas funções”), o verbo pode ir para o plural: “<b>devem</b> passar”. Nas outras: “haver” impessoal não vai ao plural e “trata-se de” não flexiona."},{"t":"q","n":9,"stem":"Assinale a alternativa em que a frase está em conformidade com a norma-padrão de pontuação.","o":["O pânico, que a inteligência artificial causa em alguns, é devido à possibilidade de perda de emprego.","As grandes alterações por que podem passar, certas áreas, afetam mais um grupo do que outro.","Mark McNeilly foi consultado – por ser especialista na área – e coordenar um projeto sobre o tema.","Alguns trabalhos apresentam características que podem ser facilmente (executadas por algoritmos inteligentes).","“A automatização de funções próprias dos humanos é algo” que vem se apregoando por ficcionistas há décadas."],"a":"A","e":"Em A, as vírgulas isolam a oração adjetiva explicativa. As outras separam termos que andam juntos ou usam parênteses e aspas de forma indevida."},{"t":"txt","x":"<p class=\"t\">Leia o texto para responder às questões de números 10 a 14.</p><p>Com a seriedade que lhe conferiam seus poucos anos a mais, além de sua condição de bacharel em direito e professor, João Etienne Filho não embarcava nas estripulias dos companheiros. Sempre se mantinha sóbrio, conta, para cuidar deles. Entrou em pânico na madrugada em que viu Fernando Sabino encarapitado1 no arco do viaduto, na postura de quem se atiraria de um trampolim.</p><p>Hélio Pellegrino se aprazia em brincar com Etienne. Tinha mania de carregá-lo na avenida Afonso Pena – como, aliás, Paulo Mendes Campos fez um dia com Monteiro Lobato na avenida São João, no centro de São Paulo, na euforia de estar diante de um dos heróis de sua infância. O convívio nem sempre era idílico2, e houve momentos em que Etienne se magoou de verdade com os quatro amigos – a ponto de escrever uma carta a Mário de Andrade, queixando-se. Recebia mal as brincadeiras de Otto Lara Resende, por exemplo. Quando publicou seu primeiro livro, Dia e noite, Etienne morava no primeiro andar da farmácia de uns tios, em Copacabana, que se chamava exatamente Dia e Noite – e Otto espalhou que o título da obra visava promover o estabelecimento.</p><p>Nada o magoou mais, no entanto, que as insinuações de que seria ele o inspirador de Hugo, personagem de O encontro marcado a certa altura envolvido com um aluno, “um negócio meio escandaloso”. “Foi uma safadeza do Fernando”, reagiu Etienne, lembrando que Hugo foi basicamente inspirado em Otto Lara Resende, assim como Mauro é quase todo Hélio Pellegrino e Eduardo Marciano o próprio romancista.</p><p class=\"src\">(Humberto Werneck. O desatino da rapaziada. Companhia das Letras, 1992. Adaptado)</p><p>Vocabulário:</p><p>1 encarapitar: pôr-se no alto.</p><p>2 idílico: de amor terno e delicado.</p>"},{"t":"q","n":10,"stem":"A partir da leitura do texto, é correto afirmar que","o":["o auge da amizade de Etienne, Hélio, Paulo e Otto foi terem recebido como quinto elemento Monteiro Lobato.","a relação de amizade entre os quatro companheiros apresenta momentos de convivência com altos e baixos.","a acusação de que Etienne estava tentando subliminarmente promover negócio familiar foi feita com seriedade.","Etienne, nas reuniões com os amigos, não consumia bebidas por ser o mais velho e graduado entre eles.","cada um dos amigos mostrava uma peculiaridade de caráter, o que fazia deles um grupo muito homogêneo."],"a":"B","e":"O texto mostra cuidado e brincadeiras, mas também mágoas: a convivência tinha <b>altos e baixos</b>."},{"t":"q","n":11,"stem":"De acordo com o texto, é correto afirmar que as alegações em relação à obra O encontro marcado fizeram com que Etienne","o":["exigisse reparação, pois teve sua índole maculada publicamente.","se inspirasse, pois queria também empreender um projeto parecido.","se recordasse dos amigos, pois não os via há um tempo considerável.","celebrasse, pois era uma conquista do amigo a quem admirava.","se ressentisse, pois achou que Sabino não o retratou adequadamente."],"a":"E","e":"Etienne reagiu (“Foi uma safadeza do Fernando”) e <b>ressentiu-se</b> por ser associado ao personagem Hugo."},{"t":"q","n":12,"stem":"Assinale a alternativa em que há regência e emprego do pronome, em conformidade com a norma-padrão e com o que se afirma no texto.","o":["Eram constantes as travessuras dos amigos, as quais Etienne não embarcava.","João Etienne Filho era bacharel e professor, onde se mostrava uma pessoa séria.","O amigo Otto fez uma brincadeira, da qual Etienne não gostou nem um pouco.","Etienne conhecia Mário de Andrade, de quem escreveu, expressando sua chateação.","Hélio se divertia com Etienne, a quem carregava como fizera uma vez com Lobato."],"a":"C","e":"“Brincadeira <b>da qual</b> Etienne não gostou”: quem gosta, gosta <b>de</b>. As formas corretas das outras: “nas quais … não embarcava” (A), “onde” só para lugar (B), “a quem escreveu” (D) e “Hélio carregava Etienne”, com “quem” como objeto direto (E)."},{"t":"q","n":13,"stem":"No trecho “Recebia mal as brincadeiras de Otto Lara Resende, por exemplo” (3º parágrafo), o vocábulo mal pertence à mesma classe de palavras que o destacado em:","o":["Com a seriedade que lhe conferiam seus poucos anos a mais… (1º parágrafo)","… no arco do viaduto, na postura de quem se atiraria de um trampolim. (1º parágrafo)","Tinha mania de o carregar na avenida Afonso Pena… (2º parágrafo)","… na euforia de estar diante de um dos heróis de sua infância. (2º parágrafo)","… em Copacabana, que se chamava exatamente Dia e Noite… (3º parágrafo)"],"a":"E","e":"“Mal” é advérbio de modo. “<b>Exatamente</b>” também é advérbio."},{"t":"q","n":14,"stem":"A alteração da posição do vocábulo destacado em relação ao trecho original mantém a norma-padrão de colocação pronominal em:","o":["Com a seriedade que conferiam-lhe seus poucos anos a mais (nasceu em março de 1918)… (1º parágrafo)","Sempre mantinha-se sóbrio, conta, para cuidar deles. (1º parágrafo)","… encarapitado no arco do viaduto, na postura de quem atiraria-se de um trampolim. (1º parágrafo)","Hélio Pellegrino aprazia-se em brincar com Etienne. (2º parágrafo)","Nada magoou-o mais, no entanto, que as insinuações de que seria ele o inspirador… (4º parágrafo)"],"a":"D","e":"Em “Hélio Pellegrino <b>aprazia-se</b>” não há palavra atrativa, então a ênclise é possível. Em A, B, C e E há atrativos (“que”, “sempre”, “quem”, “nada”) e o futuro do pretérito não aceita ênclise."},{"t":"q","n":15,"stem":"Quanto à ocorrência do acento indicativo de crase, está em conformidade com a norma-padrão a frase:","o":["Momentos passados com amigos verdadeiros garantem lembranças para toda à vida.","Imagine estar no centro da cidade e encontrar aquela figura que marcou à sua infância.","Os momentos que sucederam à publicação do livro foram um pouco tensos para o autor.","Os amigos tinham assuntos à tratar toda vez que alguma celeuma entre eles acontecia.","As reflexões do autor acabaram coincidindo com às de outros literatos importantes."],"a":"C","e":"“Suceder” no sentido de vir depois pede “a”: “sucederam <b>à</b> publicação”. Os erros das outras: “toda a vida” (A), “marcou a sua infância” (B), “a tratar” (D, antes de verbo) e “com as de outros” (E)."},{"t":"h","x":"Política de Saúde"},{"t":"q","n":16,"stem":"A redistribuição de atribuições, responsabilidades e recursos entre as três esferas do governo, com direção única aos municípios e com ênfase no fornecimento de condições gerenciais, técnicas, administrativas e financeiras para execução das ações e serviços de saúde, corresponde ao princípio do SUS denominado","o":["universalidade.","equidade.","descentralização.","integralidade.","participação social."],"a":"C","e":"A redistribuição de poder e de recursos entre as esferas, com ênfase no município, é a <b>descentralização</b>."},{"t":"q","n":17,"stem":"Sendo a assistência à saúde livre à iniciativa privada, conforme a Constituição Federal, assinale a alternativa correta.","o":["Para participar de forma complementar do SUS, as instituições firmam contratos de direito privado com as administrações municipais e estaduais.","Recursos públicos não podem ser destinados a auxílios ou subvenções para as instituições privadas com fins lucrativos.","Como forma de oficializar a participação das instituições privadas no SUS, os contratos devem ser aprovados nas respectivas casas legislativas.","A participação complementar da iniciativa privada somente pode ser realizada por entidades filantrópicas.","É permitida, sem restrições, a participação direta de empresas ou capitais estrangeiros na assistência à saúde."],"a":"B","e":"A CF (art. 199, §2º) <b>proíbe destinar recursos públicos</b> a auxílios ou subvenções para instituições privadas com fins lucrativos."},{"t":"q","n":18,"stem":"Na organização do SUS, o primeiro nível de contato dos indivíduos, da família e da comunidade com o sistema de saúde, que corresponde ao local mais próximo de onde vivem e trabalham, é denominado Atenção","o":["Primordial.","Primária.","Secundária.","Terciária.","Quaternária."],"a":"B","e":"O primeiro nível de contato, mais próximo de onde as pessoas vivem e trabalham, é a <b>Atenção Primária</b>."},{"t":"txt","x":"<p class=\"t\">Leia o enunciado a seguir para responder às questões de números 19 e 20.</p><p>Determinado estudo epidemiológico foi realizado para estimar a incidência de infecções comunitárias de vias aéreas inferiores e os fatores de risco associados à sua ocorrência em lactentes no primeiro ano de vida. Foram realizadas entrevistas com suas mães e foi realizado acompanhamento clínico das crianças bimestralmente para investigar a ocorrência da densidade de incidência de infecções comunitárias do trato respiratório inferior.</p>"},{"t":"q","n":19,"stem":"Trata-se de um estudo epidemiológico do tipo","o":["Transversal.","Caso-controle.","Ecológico.","Caso clínico.","Coorte."],"a":"E","e":"As crianças foram acompanhadas ao longo do tempo para medir casos novos: é um estudo de <b>coorte</b> (prospectivo)."},{"t":"q","n":20,"stem":"Durante o período de estudo, do total de 2 000 bebês que participaram: 11 apresentaram um episódio de pneumonia e 1 teve pneumonia em duas ocasiões; 60 apresentaram um episódio de bronquiolite, 4 tiveram dois episódios e 1 apresentou quatro episódios de bronquiolite no primeiro ano de vida. Assinale a alternativa que corresponde ao coeficiente de incidência de bronquiolite.","o":["3,25%","3,20%","0,55%","3,60%","0,70%"],"a":"D","e":"Contando os episódios: 60×1 + 4×2 + 1×4 = 72. Então 72/2.000 = <b>3,6%</b>. O gabarito considerou os episódios, e não só as crianças."},{"t":"q","n":21,"stem":"De acordo com a classificação de Leavel &amp; Clark, as ações dirigidas à manutenção da saúde com o objetivo de evitar a ocorrência de doença são medidas que","o":["são adotadas no período pré-patogênico, englobando ações de promoção da saúde e proteção específica.","visam à prevenção da incapacidade e ao ajustamento do indivíduo às limitações decorrentes do processo patológico.","identificam o processo patológico no seu início, antes do aparecimento de sinais e sintomas, visando instituir precocemente as intervenções terapêuticas.","ocorrem no período patogênico, envolvendo o diagnóstico precoce e tratamento.","buscam identificar a doença e a limitação da extensão das lesões, visando evitar ou retardar o aparecimento de complicações e sequelas."],"a":"A","e":"Evitar que a doença ocorra é ação do período <b>pré-patogênico</b>: promoção da saúde e proteção específica (prevenção primária)."},{"t":"q","n":22,"stem":"É correto afirmar sobre a Política de Vigilância em Saúde:","o":["a integralidade é um princípio que corresponde ao acesso universal e contínuo às ações e aos serviços de vigilância em saúde, promovendo a corresponsabilização pela atenção às necessidades de saúde dos usuários e da coletividade.","o financiamento das ações da vigilância em saúde é de responsabilidade do Ministério da Saúde.","compreende a articulação dos saberes, processos e práticas relacionados à vigilância epidemiológica, vigilância em saúde ambiental, vigilância em saúde do trabalhador e vigilância sanitária.","o Ministério da Saúde tem como competência exclusiva executar as ações laboratoriais necessárias para a vigilância em saúde, de forma articulada com a Rede Nacional de Laboratórios de Saúde Pública.","a regionalização das ações e serviços de vigilância em saúde segue regramento próprio, independente da organização da rede de atenção à saúde."],"a":"C","e":"A PNVS (Res. CNS 588/2018) integra a vigilância <b>epidemiológica, ambiental, em saúde do trabalhador e sanitária</b>."},{"t":"q","n":23,"stem":"A Rede de Atenção à Saúde (RAS) é definida como o conjunto de ações e serviços de saúde articulados em níveis de complexidade crescente, com a finalidade de garantir a integralidade da assistência à saúde. De acordo com esta definição, na RAS","o":["a assistência à saúde deve se iniciar e se completar no distrito sanitário de residência do usuário.","o rol de ações e serviços ofertados nas Regiões de Saúde são padronizados pelo Ministério da Saúde para todo o país.","o espaço geográfico constituído pelo conjunto de municípios agrupados segundo problemas sanitários comuns é denominado Região de Saúde.","o usuário tem assegurada a continuidade do cuidado em saúde em todas as suas modalidades, em qualquer unidade integrante da rede de atenção da sua região.","quando suas necessidades não são atendidas, só resta ao munícipe recorrer ao Poder Judiciário."],"a":"D","e":"Gabarito oficial: D. Pelo Decreto 7.508/2011, a RAS deve garantir a <b>continuidade do cuidado</b> em qualquer ponto da rede da região. Região de Saúde não se define por “problemas sanitários comuns” (C)."},{"t":"q","n":24,"stem":"Sobre o Núcleo Ampliado de Saúde da Família e Atenção Básica (Nasf-AB) na Atenção Básica, é correto afirmar:","o":["não se constituem como serviços com unidades físicas independentes ou especiais e não são de livre acesso para atendimento individual ou coletivo.","possui equipes compostas minimamente por médicos, enfermeiro, auxiliar de enfermagem e técnicos de enfermagem.","há a obrigatoriedade de cumprimento de carga horária de 40 (quarenta) horas semanais para todos os profissionais de saúde membros do Nasf-AB.","é considerada estratégia prioritária de atenção à saúde, visando à melhor relação custo-benefício da Atenção Básica.","constitui unidade de referência para as equipes de agentes comunitários de saúde e agentes de controle de endemias."],"a":"A","e":"O NASF-AB não tem unidade física independente e <b>não é porta de entrada</b> (não tem livre acesso). Ele apoia as equipes de Saúde da Família."},{"t":"q","n":25,"stem":"Índice de envelhecimento, taxa de fecundidade e taxa de crescimento da população são exemplos de indicadores de saúde que medem a distribuição de fatores determinantes da situação de saúde relacionados à dinâmica populacional na área geográfica referida. Estes indicadores são denominados fatores","o":["socioeconômicos.","de mortalidade.","morbidade.","de risco.","demográficos."],"a":"E","e":"Índice de envelhecimento, fecundidade e crescimento populacional são indicadores <b>demográficos</b>."},{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":26,"stem":"Um exercício que envolve uma ativação muscular dinâmica e produção de tensão, que é inferior ao nível de resistência externa, de modo a ocorrer alongamento físico do músculo ao controlar a carga, como, por exemplo, ao abaixar um peso, é classificado como:","o":["isotônico.","concêntrico.","excêntrico.","isocinético.","de estabilização."],"a":"C","e":"Na contração <b>excêntrica</b>, o músculo produz menos tensão que a carga e se alonga controlando o movimento, como ao abaixar um peso."},{"t":"q","n":27,"stem":"De acordo com a Organização Mundial de Saúde, a reabilitação consiste em:","o":["um procedimento destinado a pacientes com demanda cognitiva e neurocomportamental decorrente de lesão encefálica adquirida e/ou doenças neurodegenerativas.","tratar ou minimizar as incapacidades e disfunções causadas por doenças crônicas, sequelas neurológicas ou lesões derivadas da gestação e do parto, acidentes de trânsito e de trabalho.","um conjunto de medidas que auxiliam os indivíduos, que vivem ou têm alguma probabilidade de viver com deficiência, a alcançar e manter um nível ótimo de funcionalidade na interação com seu ambiente.","um procedimento clínico psicoterápico voltado àqueles que apresentam reações emocionais disfuncionais e/ou catastróficas frente à ocorrência de uma lesão e consequente instalação de uma deficiência.","um tratamento complementar, não invasivo, baseado em um grupo de exercícios personalizados que, em conjunto com o uso, quando indicados, de medicamentos, auxiliam nas modificações dos hábitos de vida e orientação alimentar, visando reduzir os sintomas de tontura e promover a recuperação do equilíbrio corporal."],"a":"C","e":"Para a OMS, reabilitação é o <b>conjunto de medidas</b> que ajuda pessoas com deficiência, ou com probabilidade de tê-la, a alcançar e manter <b>funcionalidade ótima</b> na interação com o ambiente."},{"t":"q","n":28,"stem":"Se um adulto, que frequenta uma UBS, possui necessidades de saúde mental, incluindo desafios relacionados às necessidades decorrentes do uso prejudicial de álcool e outras drogas, e a UBS em que ele se trata avalia que precisa do apoio de outro serviço de saúde para este paciente, ele deve ser encaminhado para o(a)","o":["Centro Especializado de Reabilitação (CER).","Centro de Atenção Psicossocial (CAPS).","Ambulatório Médico de Especialidade (AME).","Reabilitação Profissional.","Unidade de Pronto Atendimento (UPA)."],"a":"B","e":"Sofrimento mental e uso prejudicial de álcool e outras drogas são atendidos no <b>CAPS</b> (incluindo o CAPS AD)."},{"t":"q","n":29,"stem":"O uso de salto alto, do tipo Anabela, pode acarretar alterações posturais em adolescentes, comparado com aquelas que não fazem uso deste tipo de calçado. Assinale a alternativa que apresenta, corretamente, o tipo de alteração que pode ser encontrada nas usuárias de Anabela.","o":["Diminuição da lordose lombar e retroversão pélvica.","Aumento da lordose lombar e anteversão pélvica.","Aumento da lordose lombar e retroversão pélvica.","Diminuição da lordose lombar e anteversão pélvica.","Retificação da lordose lombar e retroversão pélvica."],"a":"B","e":"O salto Anabela leva a <b>anteversão pélvica e aumento da lordose lombar</b>."},{"t":"q","n":30,"stem":"O fisioterapeuta deve fazer perguntas ao paciente com lombalgia, durante uma anamnese, para identificar que tipo de alterações ele pode apresentar, para identificar riscos às terapêuticas que ele quer adotar e para verificar a necessidade de encaminhar o paciente para outros profissionais, que atuarão em conjunto para tratar sua disfunção. Considerando a hipótese de um paciente apresentar depressão clínica associada a lombalgia, assinale a alternativa que indica que tipo de bandeira ele apresenta e qual conduta o fisioterapeuta deve tomar.","o":["Bandeira vermelha e encaminhar o paciente para atendimento especializado em saúde mental.","Bandeira amarela e assumir o cuidado do paciente em conjunto com médicos aptos a tratar este tipo de paciente.","Bandeira laranja e encaminhar o paciente para atendimento especializado em saúde mental.","Bandeira vermelha e encaminhar o paciente para um ortopedista ou oncologista.","Bandeira preta e encaminhar o paciente para o ergonomista do local em que ele trabalha."],"a":"C","e":"Fatores psiquiátricos, como a depressão clínica, são <b>bandeira laranja</b>, que indica encaminhamento para a saúde mental. Bandeira amarela são crenças e fatores psicossociais, e vermelha são sinais de doença grave."},{"t":"q","n":31,"stem":"Ao avaliar a mão de um paciente com lesão nervosa periférica, o fisioterapeuta encontra hiperextensão das articulações metacarpofalângicas e flexão das articulações interfalângicas proximais e distais. Este tipo de alteração acontece por lesão no nervo:","o":["radial.","mediano.","ulnar.","axilar.","cutâneo medial."],"a":"C","e":"Hiperextensão das metacarpofalângicas com flexão das interfalângicas é a <b>mão em garra</b> da lesão do nervo <b>ulnar</b> (paralisia dos lumbricais e interósseos)."},{"t":"q","n":32,"stem":"Na avaliação fisioterapêutica da postura do joelho, especificamente sobre o ângulo Q, é correto afirmar que:","o":["as mulheres apresentam este ângulo em 13º.","os homens apresentam este ângulo em 18º.","se o ângulo é menor que 18º, ele pode estar associado a subluxação patelar.","se o ângulo Q é menor do que 13º, ele pode estar associado a condromalácia.","ele apresenta valores semelhantes entre homens e mulheres."],"a":"D","e":"Os valores normais do ângulo Q são cerca de 13° em homens e 18° em mulheres (por isso A, B e E erram). Abaixo de 13° ele pode estar ligado a <b>condromalácia</b> e patela alta. Acima de 18°, a condromalácia e a subluxação patelar."},{"t":"q","n":33,"stem":"Ao receber um paciente que trabalha com movimentos repetitivos, o fisioterapeuta deve avaliar se ele pode desenvolver LER/DORT. Uma atividade é considerada repetitiva se","o":["a duração do trabalho envolver movimentos repetitivos durante 60% do tempo de trabalho, em tarefas diferentes.","o ciclo variar entre 30 e 45 segundos e sua duração envolver tarefas idênticas.","ele realizar atividades manuais com emprego de força por menos de [fração no caderno] do período de trabalho e com um objeto que pese 2,5 kg.","o ciclo for menor que 30 segundos ou quando mais de 50% de sua duração envolver tarefas idênticas.","ele realizar atividades manuais com emprego de força em mais de [fração no caderno] do período de trabalho e com um objeto que pese 1,5 kg."],"a":"D","e":"A atividade é repetitiva quando o <b>ciclo dura menos de 30 s</b> ou quando <b>mais de 50%</b> do ciclo envolve os mesmos gestos."},{"t":"q","n":34,"stem":"A Diabetes Mellitus Gestacional (DMG) é um fator de risco tanto para a gestante quanto para o bebê. O Ministério da Saúde do Brasil considera DMG quando","o":["a glicemia de jejum for maior que 100 mg/dL, ou teste de tolerância à glicose, com 60 g de glicose, for maior que 140 mg/dL na segunda hora.","a glicemia de jejum for maior que 110 mg/dL, ou teste de tolerância à glicose, com 75 g de glicose, for maior que 140 mg/dL na segunda hora.","a glicemia apresentar valores superiores a 100 mg/dL, independente do teste de tolerância à glicose.","a hemoglobina glicada apresenta valores entre 5,4% e 5,6%, mesmo tendo valores de glicemia de jejum abaixo de 110 mg/dL.","a hemoglobina glicada apresenta valores entre 5,5% e 5,7%, mesmo tendo valores de glicemia de jejum abaixo de 110 mg/dL."],"a":"B","e":"Gabarito oficial: B. Pelo critério antigo do MS, é DMG a glicemia de jejum acima de 110 mg/dL ou TTOG com <b>75 g</b> acima de 140 mg/dL na 2ª hora. Os critérios atuais são diferentes: jejum ≥ 92 mg/dL."},{"t":"q","n":35,"stem":"O fisioterapeuta pode atuar durante todo o trabalho de parto e, para isso, deve conhecer as características de cada uma das fases. A fase passiva da segunda fase do trabalho de parto caracteriza-se por","o":["ruptura da bolsa amniótica, sem o início das contrações uterinas.","contrações uterinas dolorosas tanto na intensidade quanto na duração.","dilatação total do colo com a cabeça do feto visível ou com sensação de puxo.","dilatação total do colo sem sensação de puxo involuntário.","desprendimento fetal e pela eliminação da placenta."],"a":"D","e":"Na fase <b>passiva</b> do período expulsivo, a dilatação já é total, mas ainda <b>não há puxo involuntário</b>."},{"t":"q","n":36,"stem":"Durante a avaliação fisioterapêutica de uma criança com asma, o fisioterapeuta encontra na ausculta sons graves, geralmente inspiratórios, que inferem secreção em vias aéreas de condução, pode-se deduzir que estes sons caracterizam:","o":["sibilos.","roncos.","crepitações.","som traqueal.","estridor."],"a":"B","e":"Sons graves e contínuos, ligados a secreção em vias aéreas de condução, são <b>roncos</b>."},{"t":"q","n":37,"stem":"Uma infecção viral e contagiosa, que ataca o sistema neurológico, afetando o corpo inteiro e podendo causar a paralisia dos movimentos musculares, resultante do dano causado ao neurônio motor periférico, caracteriza:","o":["Meningite.","Sarampo.","Rubéola.","Poliomielite.","Miastenia Grave."],"a":"D","e":"Infecção viral que lesa o <b>neurônio motor inferior</b> (corno anterior) e causa paralisia flácida é a <b>poliomielite</b>."},{"t":"q","n":38,"stem":"De acordo com as Diretrizes Brasileiras de Hipertensão Arterial (HA), modalidades não medicamentosas podem contribuir para o controle da hipertensão. Assinale a alternativa correta sobre os efeitos destas modalidades na HA.","o":["Uma metanálise de dez ensaios clínicos randomizados não identificou a redução nas pressões sistólica e diastólica com o consumo aumentado de produtos com cacau.","A cafeína é capaz de elevar agudamente a Pressão Arterial por mais de três horas, mas o consumo regular leva à tolerância.","A deficiência de vitamina D no controle da pressão está, comprovadamente, assoviada a um aumento da pressão arterial.","As evidências existentes demonstram que, a longo prazo, exercícios voluntários de respiração lenta podem reduzir a Pressão Arterial Sistólica e a Pressão Arterial Diastólica de pacientes com HA portadores de doença cardiovascular.","A perda ponderal de peso reduz a Pressão Arterial apenas quando se alcança o peso corporal desejável."],"a":"B","e":"Pelas Diretrizes de HA, a cafeína eleva a PA de forma aguda por <b>mais de 3 horas</b>, mas o consumo regular gera tolerância."},{"t":"q","n":39,"stem":"Um paciente apresenta fratura de diáfise do fêmur e necessita aguardar alguns dias internado para realizar a cirurgia com uma imobilização provisória. Neste período, a fisioterapeuta pode orientar o paciente a realizar:","o":["exercícios isométricos no segmento fraturado e ativos nos segmentos livres do membro contralateral e superiores.","repouso até o momento da cirurgia, sem mobilização dos segmentos fraturados e não fraturados.","apenas exercícios respiratórios, pois a realização de exercícios de outra natureza é contraindicada neste período.","exercícios ativos livres para todos os segmentos corporais, exceto para o quadril, que deverá realizar apenas isometria.","exercícios ativos resistidos para todos os segmentos corporais, exceto para o quadril, que deverá realizar apenas isometria."],"a":"A","e":"Antes da cirurgia: <b>isometria</b> no segmento imobilizado e exercícios <b>ativos</b> nos segmentos livres, para prevenir perda de força e TVP."},{"t":"q","n":40,"stem":"Assinale a alternativa que apresenta, com correção, as condutas fisioterapêuticas indicadas para um paciente que realizou artroplastia de quadril com prótese cimentada na fase inicial (30 primeiros dias) e na fase intermediária (2-4 meses) respectivamente.","o":["A descarga de peso deve ser limitada nas primeiras semanas; treino de marcha com atenção para boa distribuição de carga e para evitar compensações.","Promover descarga de peso quase imediata à cirurgia; treino de marcha com suporte de carga inicialmente.","Colocar o paciente em sedestação, sem realizar transferência para cadeira; o paciente deve realizar treino funcional para readquirir sua independência.","Colocar o paciente em sedestação, sem realizar transferência para cadeira; treino de marcha com suporte de carga inicialmente.","Promover descarga de peso quase imediata à cirurgia; marcha independente com descarga total de peso."],"a":"E","e":"Na prótese <b>cimentada</b>, a descarga de peso é quase imediata. Na fase intermediária, o paciente evolui para <b>marcha independente com carga total</b>."},{"t":"q","n":41,"stem":"Um dos sintomas comuns em pacientes com Parkinson é a fadiga. A Estimulação Transcraniana por Corrente Contínua (ETCC) surgiu como opção terapêutica promissora para tratar a fadiga destes pacientes. A maioria dos estudos de estimulação, concebidos para neutralizar o desenvolvimento da fadiga, aplicam a ETCC sobre o(s)","o":["córtex pré-motor.","córtex motor primário.","lobos parietais.","o lobo occipital e cerebelo.","o córtex pré-frontal dorsolateral."],"a":"E","e":"Para fadiga, a maioria dos protocolos de ETCC no Parkinson estimula o <b>córtex pré-frontal dorsolateral</b>."},{"t":"q","n":42,"stem":"Sobre a realização de exercícios de fortalecimento muscular em pacientes com espásticos, podemos afirmar que:","o":["para que um programa de treinamento muscular tenha benefícios acumulados, ele deve ser realizado, no mínimo, por um tempo de 3 meses.","o aumento progressivo na resistência de um músculo espástico não é capaz de contribuir para seu aumento de força.","exercícios de fortalecimento muscular não exacerbam a espasticidade durante ou após o curso de um tratamento.","o treino de fortalecimento muscular pode ser realizado em pacientes não neurologicamente estáveis.","é contraindicado realizar exercícios em músculos espásticos, pois estes apresentam força em excesso."],"a":"C","e":"O fortalecimento progressivo <b>não aumenta a espasticidade</b> e melhora a força e a função. A ideia de que piora o tônus é um mito."},{"t":"q","n":43,"stem":"Em pacientes com alterações respiratórias, a realização de soluços inspiratórios visa:","o":["ocasionar um aumento da ventilação pulmonar em zonas mediais e laterais e, concomitantemente, aumentar a capacidade residual funcional e o volume de reserva inspiratório.","possibilitar a melhora da ventilação na região de bases pulmonares, aumentar a capacidade residual funcional e o volume de reserva inspiratório.","aumentar o volume pulmonar e o tempo inspiratório.","proporcionar a melhora da complacência torácica e pulmonar, bem como a otimização da capacidade inspiratória.","proporcionar o aumento da ventilação nas zonas basais, com elevação da capacidade e do tempo inspiratório."],"a":"E","e":"Os soluços inspiratórios (inspirações fracionadas) <b>aumentam a ventilação basal</b>, a capacidade inspiratória e o tempo inspiratório."},{"t":"q","n":44,"stem":"Quando o fisioterapeuta vai programar os tipos de exercícios mais benéficos para seus pacientes, ele deve considerar a patologia que estes apresentam para indicar os mais adequados para cada caso. Considerando pacientes com fibromialgia, que apresentam quadros de dor, depressão e piora na qualidade de vida relacionada à saúde física e mental, assinale a alternativa que apresenta, corretamente, o tipo de exercício, apontado em revisões sistemáticas, que produz efeitos sobre todas estas alterações.","o":["Pilates.","Alongamentos.","Aeróbicos.","De resistência.","Facilitação neuromuscular proprioceptiva."],"a":"C","e":"Revisões sistemáticas mostram que o exercício <b>aeróbico</b> melhora dor, depressão e qualidade de vida na fibromialgia."},{"t":"q","n":45,"stem":"Um programa de cinesioterapia vascular, para pacientes com Doença Venosa Crônica, é constituído de fases. A fase em que o paciente realiza exercícios com o objetivo aumentar o fluxo sanguíneo muscular, o consumo de oxigênio basal e proporcionar efeitos psicológicos, é a fase de","o":["treinamento.","aquecimento.","relaxamento.","condicionamento aeróbico.","recovery."],"a":"B","e":"O <b>aquecimento</b> aumenta o fluxo sanguíneo muscular e o consumo basal de O2, preparando o paciente física e psicologicamente."},{"t":"q","n":46,"stem":"A dismenorréia é uma desordem ginecológica que acomete uma quantidade grande de mulheres. Diversos tratamentos não-farmacológicos podem ser utilizados para tratar esta disfunção. O uso de acupuntura para tratar a dismenorréia primária reduz a dor porque","o":["diminui a transmissão de estímulos nociceptivos no corno dorsal da medula espinhal, transmitidos pelas fibras C.","induz a liberação de endorfinas e diminui a intensidade de pulsação das fibras uterinas.","diminui a dor provocada pelo disparo de trigger points no músculo reto abdominal.","modula a dor, aumentando a quantidade de Substância P na medula espinhal.","modula a dor, aumentando a quantidade de Glutamato no Sistema Nervoso Central."],"a":"A","e":"A acupuntura <b>reduz a transmissão nociceptiva no corno dorsal</b> (fibras C), por inibição segmentar e por vias descendentes."},{"t":"q","n":47,"stem":"Que tipo de alterações na marcha podemos encontrar em pacientes idosos?","o":["Permanecer maior tempo na fase de apoio e duplo apoio em relação a indivíduos mais jovens.","Homens e mulheres, na faixa entre 60-69 anos, possuírem o mesmo comprimento do passo.","A tendência à diminuição da amplitude do movimento pélvico no plano sagital, como estratégia para ganhar flexão e extensão do quadril, para aumentar o comprimento do passo.","A perda de força muscular nos flexores plantares, que leva ao aumento da potência destes na fase de push-off, fase importante para liberar o pé do chão e empurrar o corpo à frente.","A potência dos flexores plantares é a variável cinética mais importante para predizer diminuição do comprimento do passo em indivíduos idosos, e a compensação neuromuscular desta perda é a diminuição da potência de extensores do quadril e joelho."],"a":"A","e":"Idosos ficam mais tempo em <b>apoio e duplo apoio</b>, como estratégia de estabilidade."},{"t":"q","n":48,"stem":"Dentre as atividades desenvolvidas por fisioterapeutas, que atuam no campo esportivo, destaca-se a recuperação pós-exercícios depois das provas, competições ou treinos, conhecida como recovery. Quando um fisioterapeuta quer realizar um recovery ativo, ele deve orientar o atleta a realizar:","o":["aplicação de dispositivos de massagem percussivos portáteis, que emitem vibrações em amplitudes variadas.","alongamento ativo e dinâmico, bem como métodos de Facilitação Neuromuscular Proprioceptiva (FNP).","banho de sauna usando uma sala aquecida a 70-100 ºC e 15-30% de umidade relativa, geralmente, por um período de 5-20 minutos.","imersão em água, geralmente por meio de imersão em água fria ou terapia de contraste em água, alternando entre imersão em água quente e fria.","exercícios leves a moderados, consideravelmente, abaixo do limiar de lactato."],"a":"E","e":"A recuperação <b>ativa</b> é feita com exercício leve a moderado, <b>abaixo do limiar de lactato</b>. Massagem, sauna e imersão são recursos passivos."},{"t":"q","n":49,"stem":"Assinale a alternativa correta sobre o uso da estimulação elétrica neuromuscular.","o":["A forma mais adequada de eletroestimular o quadríceps, de acordo com o princípio de comprimento-tensão, é posicionar o paciente em decúbito com o joelho em extensão.","Uma das causas de fadiga na musculatura, durante a eletroestimulação, é o recrutamento assíncrono das unidades motoras do músculo estimulado.","A frequência de pulso ideal para aumentar a força muscular varia de 20 a 40 Hz.","A contração isotônica nos extremos funcionais da amplitude de movimento é indicada para melhorar a funcionalidade do paciente.","Para se produzir maior força muscular durante a eletroestimulação, são recomendadas contrações isométricas ao invés de concêntricas."],"a":"E","e":"Contrações <b>isométricas</b> com EENM geram mais força que as concêntricas."},{"t":"q","n":50,"stem":"Dentre as técnicas alternativas de atenção à saúde, voltadas para auxiliar o tratamento de diferentes patologias, emerge a meditação Mindfulness, que é uma técnica que consiste em:","o":["prestar atenção à experiência do momento presente com uma orientação de curiosidade, abertura, aceitação, não reatividade e não julgamento.","inspirar pelas narinas, enchendo o pulmão de ar lentamente e expirando o ar, lentamente, pela boca, como se quisesse expulsá-lo do seu pulmão.","colocar uma bolinha de tênis sobre seus pés ou entre as mãos e realizar movimentos circulares, massageando toda a região.","solicitar que o paciente pense em todas as coisas positivas que lhe acontecem e agradeça por todas elas.","solicitar ao paciente que se movimente por meio de posturas que exijam equilíbrio, pois esta atividade aumentará a sua concentração no momento presente e menos no dia cansativo que teve."],"a":"A","e":"Mindfulness é <b>prestar atenção ao momento presente</b> com abertura, curiosidade, aceitação e sem julgamento."}],"total":50},{"id":"pe","ano":2024,"org":"Prefeitura de Peruíbe/SP","cargo":"Fisioterapeuta","data":"09/06/2024","pdf":"https://arquivos.qconcursos.com/prova/arquivo_prova/155293/vunesp-2024-prefeitura-de-peruibe-sp-fisioterapeuta-prova.pdf","b":[{"t":"h","x":"Língua Portuguesa"},{"t":"txt","x":"<p class=\"t\">Leia a charge para responder às questões de números 01 e 02.</p><p class=\"img\">🖼️ A charge (Bob Thaves, “Frank &amp; Ernest”, 02.04.2024) é uma imagem que está no caderno original. Abra o PDF da prova para vê-la.</p>"},{"t":"q","n":1,"stem":"Em conformidade com a norma-padrão, as lacunas da charge devem ser preenchidas, respectivamente, com:","o":["surgiu … à … que","tinha … a … que","existia … a … de que","havia … à … de que","era … a … de que"],"a":"D","e":"Questão com charge (imagem no caderno). Gabarito oficial: <b>D</b> (havia … à … de que). “Haver” no sentido de existir é impessoal, e “ter certeza <b>de que</b>” pede a preposição.","img":true},{"t":"q","n":2,"stem":"Considerando o emprego e/ou a colocação de pronomes, assinale a alternativa que apresenta, de acordo com a norma-padrão, a sequência correta para a frase: Não tenho pedras na vesícula ou no rim.","o":["Tenho-nas na cabeça.","Tenho elas na cabeça.","Tenho-as na cabeça.","Tenho-lhes na cabeça.","As tenho na cabeça."],"a":"C","e":"O verbo “ter” é transitivo direto, então o pronome é <b>“as”</b> (não “lhes”). No início da frase vem a ênclise: <b>Tenho-as</b>. “-nas” só aparece depois de som nasal."},{"t":"txt","x":"<p class=\"t\">Leia o texto para responder às questões de números 03 a 11.</p><p class=\"ti\">Com mais idosos, será preciso fortalecer o SUS</p><p>Dados recém-divulgados pelo IBGE mostram que os brasileiros têm destinado parcelas crescentes de sua renda a serviços de saúde e medicamentos nos últimos anos, uma tendência previsível com a transformação demográfica e o envelhecimento da população.</p><p>A despesa pública e privada do país com tal finalidade somou 9,7% do Produto Interno Bruto em 2021, ante 8% em 2010. A expansão deve continuar nos próximos anos, visto que em países mais desenvolvidos e com maior proporção de idosos entre os habitantes, como Alemanha, França e Reino Unido, o índice chega a 12% ou mais. Por aqui, o aumento dos gastos no período se concentrou nas famílias – de 4,4% para 5,7% do PIB. Já os desembolsos dos governos federal, estaduais e municipais passaram de 3,6% para 4% do produto.</p><p>Os números refletem o sistema híbrido de financiamento da saúde que, na prática, desenvolveu-se no Brasil. Embora disponhamos de um sistema público universal de atendi mento, o que sem dúvida é uma conquista civilizatória, estamos longe de poder abrir mão dos recursos privados. Será necessário fortalecer o SUS para fazer frente à alta esperada da participação de idosos na população. Hoje, homens e mulheres com idade acima dos 65 anos representam perto de 11% dos brasileiros; projeta-se que o patamar de 20% será ultrapassado em 2050, e o de 30% estará próximo em 2070.</p><p>No atual cenário de penúria orçamentária, não há como pensar em um aumento rápido e vigoroso dos recursos do SUS. A longo prazo, será preciso rever prioridades e conter outras despesas para viabilizar maior atenção ao setor.</p><p class=\"src\">(Editorial. Folha de S.Paulo, 07.04.2024. Adaptado)</p>"},{"t":"q","n":3,"stem":"As informações apresentadas no texto permitem afirmar corretamente que","o":["a expansão da despesa pública e privada do Brasil vem aumentando ao longo dos anos, atingindo patamares de países europeus, o que sinaliza que o aumento de idosos deixou de ser preocupação.","o envelhecimento da população brasileira requer um olhar atento das autoridades, considerando-se os gastos nas famílias e o impacto da participação dos idosos na população a longo prazo.","a projeção para o envelhecimento da população brasileira coloca o país em uma situação economicamente difícil, uma vez que a injeção de recursos no SUS tenderá a diminuir nas próximas décadas.","os gastos nas famílias brasileiras e os desembolsos dos governos federal, estaduais e municipais sugerem a inviabilidade do SUS para prover atendimento à população idosa já a partir de 2050.","o sistema híbrido de financiamento da saúde cobra menos dos cidadãos e mais dos governos, o que permite prever que, com o envelhecimento da população, os governos ficarão sem recursos."],"a":"B","e":"O texto mostra o aumento dos gastos das famílias e a projeção de mais idosos. Por isso o envelhecimento exige um <b>olhar atento</b> e o fortalecimento do SUS."},{"t":"q","n":4,"stem":"A informação é apresentada ao leitor sob forma de hipótese em:","o":["Dados recém-divulgados pelo IBGE mostram que os brasileiros têm destinado parcelas crescentes de sua renda a serviços de saúde e medicamentos nos últimos anos… (1º parágrafo)","A despesa pública e privada do país com tal finalidade somou 9,7% do Produto Interno Bruto em 2021, ante 8% em 2010. (2º parágrafo)","… em países mais desenvolvidos e com maior proporção de idosos entre os habitantes, como Alemanha, França e Reino Unido, o índice chega a 12% ou mais. (2º parágrafo)","No atual cenário de penúria orçamentária, não há como pensar em um aumento rápido e vigoroso dos recursos do SUS. (6º parágrafo)","A longo prazo, será preciso rever prioridades e conter outras despesas para viabilizar maior atenção ao setor. (6º parágrafo)"],"a":"E","e":"“<b>Será preciso</b> rever prioridades” é uma projeção sobre o futuro. As outras alternativas trazem dados ou constatações."},{"t":"q","n":5,"stem":"Considere as passagens:<br>• \u0007… uma tendência <b>previsível</b> com a transformação demográfica e o envelhecimento da população. (1º parágrafo)<br>• \u0007Já os <b>desembolsos</b> dos governos federal, estaduais e municipais passaram de 3,6% para 4% do produto. (3º parágrafo)<br>• \u0007Os números <b>refletem</b> o sistema híbrido de financiamento da saúde… (4º parágrafo)<br>• \u0007No atual cenário de <b>penúria</b> orçamentária, não há como pensar em um aumento… (6º parágrafo) Os termos destacados significam, correta e respectivamente:","o":["esperada; dispêndios; revelam; miséria.","provável; recursos; confirmam; limitação.","iminente; previsões; sugerem; mudança.","desejada; cálculos; ultrapassam; abastança.","prenunciada; gastos; contestam; restrição."],"a":"A","e":"Previsível = <b>esperada</b>; desembolsos = <b>dispêndios</b>; refletem = <b>revelam</b>; penúria = <b>miséria</b> (escassez)."},{"t":"q","n":6,"stem":"Há termo(s) empregado(s) em sentido figurado na expressão:","o":["transformação demográfica (1º parágrafo)","próximos anos (2º parágrafo)","aumento dos gastos (3º parágrafo)","recursos privados (4º parágrafo)","fazer frente (5º parágrafo)"],"a":"E","e":"“<b>Fazer frente</b>” é expressão figurada que significa enfrentar."},{"t":"q","n":7,"stem":"No título do texto – <b>Com</b> mais idosos, será preciso fortalecer o SUS –, a preposição destacada expressa sentido de","o":["causa.","companhia.","intensidade.","consequência.","conformidade."],"a":"A","e":"“<b>Com</b> mais idosos” = “como haverá mais idosos”, uma relação de <b>causa</b>."},{"t":"q","n":8,"stem":"A reescrita da passagem do 4º parágrafo – Embora disponhamos de um sistema público universal de atendimento, o que sem dúvida é uma conquista civilizatória, estamos longe de poder abrir mão dos recurs
