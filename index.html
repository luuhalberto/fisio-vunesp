<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: coluna única de estudo (880px) · cabeçalho translúcido fixo · placar flutuante no rodapé */
:root{
  --bg:#f5f7fb;--surface:#ffffff;--surface2:#eef2f8;--tx:#0f1b2d;--mut:#5d6b80;--bd:#e2e7ef;--bd2:#cfd7e4;
  --pri:#1f6feb;--pri2:#0b4fc4;--pribg:#e8f0fe;--hero1:#1f6feb;--hero2:#0a3d91;
  --ok:#1a7f37;--okbg:#e6f4ea;--err:#cf222e;--errbg:#fdecee;--warn:#9a6700;--warnbg:#fff8e1;--expbg:#f0f5ff;
  --y26:#1f6feb;--y25:#8250df;--y24:#bf5700;
  --sh:0 1px 2px rgba(15,27,45,.04),0 4px 16px rgba(15,27,45,.06);
  --sh2:0 2px 4px rgba(15,27,45,.05),0 12px 32px rgba(15,27,45,.10);
  --r:18px;--hdr:rgba(245,247,251,.82);
  --f-body:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Space Grotesk",Inter,ui-sans-serif,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d1117;--surface:#161b22;--surface2:#1c232d;--tx:#e6edf3;--mut:#9aa7b4;--bd:#262e39;--bd2:#33404f;
  --pri:#58a6ff;--pri2:#1f6feb;--pribg:#14243b;--hero1:#1a56c4;--hero2:#0b2a5e;
  --ok:#3fb950;--okbg:#12291a;--err:#f85149;--errbg:#2d1214;--warn:#d29922;--warnbg:#2b2310;--expbg:#152034;
  --y26:#58a6ff;--y25:#bc8cff;--y24:#f0883e;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 8px 28px rgba(0,0,0,.45);--hdr:rgba(13,17,23,.8);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0d1117;--surface:#161b22;--surface2:#1c232d;--tx:#e6edf3;--mut:#9aa7b4;--bd:#262e39;--bd2:#33404f;
  --pri:#58a6ff;--pri2:#1f6feb;--pribg:#14243b;--hero1:#1a56c4;--hero2:#0b2a5e;
  --ok:#3fb950;--okbg:#12291a;--err:#f85149;--errbg:#2d1214;--warn:#d29922;--warnbg:#2b2310;--expbg:#152034;
  --y26:#58a6ff;--y25:#bc8cff;--y24:#f0883e;--sh:0 1px 2px rgba(0,0,0,.3);--sh2:0 8px 28px rgba(0,0,0,.45);--hdr:rgba(13,17,23,.8);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--tx);font:16.5px/1.6 var(--f-body);font-feature-settings:"cv11","ss01";padding-bottom:110px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,.card .org{font-family:var(--f-disp);text-wrap:balance}
.toast{display:flex;align-items:center;justify-content:space-between;width:max-content;max-width:calc(100vw - 32px)}.toast[hidden]{display:none}
.toast .tact{margin-left:12px;background:none;border:0;color:inherit;font-weight:800;padding:4px 6px;text-decoration:underline;text-underline-offset:3px}
.lxbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:12px 0;padding:12px 14px;border-radius:14px;background:var(--warnbg);color:var(--tx);border:1px solid var(--bd);font-size:14.5px}
.lxbar .lxb{display:flex;gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + env(safe-area-inset-top,0px));z-index:40;background:var(--tx);color:var(--bg);font-size:14px;font-weight:600;border-radius:12px;padding:9px 14px;box-shadow:var(--sh2)}
textarea.code{width:100%;min-height:70px;margin-top:10px;font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--tx);background:var(--surface2);border:1px solid var(--bd);border-radius:10px;padding:8px}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--pri)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:10px}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hide,[hidden]{display:none!important}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--bd)}
header.top .wrap{display:flex;gap:10px;align-items:center;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-right:auto;letter-spacing:-.01em;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--hero1),var(--hero2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;font-family:var(--f-disp)}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:12px;line-height:1}
.saved{font-size:12px;font-weight:600;color:var(--ok);background:var(--okbg);border-radius:999px;padding:3px 10px;opacity:0;transform:translateY(-4px);transition:.25s}
.saved.on{opacity:1;transform:none}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;border:1px solid var(--bd);background:var(--surface);color:var(--mut)}
.ib:hover{color:var(--tx);border-color:var(--bd2)}
.ib svg{width:18px;height:18px}

/* home */
.hero{position:relative;overflow:hidden;margin:22px 0 18px;border-radius:24px;padding:24px;background:linear-gradient(135deg,var(--hero1) 0%,var(--hero2) 100%);color:#fff;box-shadow:var(--sh2)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero h1{font-size:30px;line-height:1.15;letter-spacing:-.025em;margin:6px 0 8px;font-weight:800}
.hero p{margin:0;opacity:.9;max-width:520px;font-size:15px}
.hero .row{display:flex;gap:22px;align-items:center;margin-top:20px;flex-wrap:wrap;position:relative;z-index:1}
.ring{--p:0;--c:#fff;--t:rgba(255,255,255,.22);width:84px;height:84px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--t) 0);display:grid;place-items:center;flex:0 0 auto}
.ring>span{width:68px;height:68px;border-radius:50%;background:var(--hero1);display:grid;place-items:center;font-weight:800;font-size:19px;line-height:1;text-align:center}
.ring>span small{display:block;font-size:10px;font-weight:600;opacity:.8;margin-top:3px}
.hstats{display:flex;gap:22px;flex-wrap:wrap}
.hstats div b{display:block;font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.hstats div span{font-size:12.5px;opacity:.85}
.cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#0a3d91;font-weight:700;font-size:14.5px;border-radius:14px;padding:11px 16px;margin-left:auto;box-shadow:0 6px 18px rgba(0,0,0,.15);transition:transform .15s}
.cta:hover{transform:translateY(-1px)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 0 12px;flex-wrap:wrap}
.sec-t h2{font-size:18px;margin:0;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--bd);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;max-width:100%}
.seg button{padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--mut);white-space:nowrap;transition:.15s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--tx);box-shadow:var(--sh)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--bd2)}
.card .top{display:flex;justify-content:space-between;align-items:center}
.yr{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 10px;letter-spacing:.02em}
.y2026{background:color-mix(in srgb,var(--y26) 14%,transparent);color:var(--y26)}
.y2025{background:color-mix(in srgb,var(--y25) 14%,transparent);color:var(--y25)}
.y2024{background:color-mix(in srgb,var(--y24) 14%,transparent);color:var(--y24)}
.mini{--p:0;width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--surface2) 0);display:grid;place-items:center}
.mini span{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--mut)}
.card .org{font-weight:700;font-size:16px;line-height:1.3;letter-spacing:-.01em}
.card .meta{font-size:13.5px;color:var(--mut);line-height:1.45}
.bar{height:6px;background:var(--surface2);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .4s}
.bar .k{background:var(--ok)}.bar .w{background:var(--err)}
.card .prog{font-size:12.5px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;font-weight:500}
.panel{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin:16px 0;box-shadow:var(--sh)}
.panel h3{margin:0 0 10px;font-size:15px}
.tips{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0;padding:0;list-style:none}
.tips li{font-size:14px;color:var(--mut);line-height:1.5}
.tips li b{display:block;color:var(--tx);font-size:14px;margin-bottom:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:600}
.btn:hover{border-color:var(--bd2);background:var(--surface2)}
.btn.danger{color:var(--err)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.end{color:var(--mut);font-size:13px;margin:28px 0;line-height:1.55}

/* exam */
.ehead{margin:22px 0 4px}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;font-weight:600;margin-bottom:10px}
.back:hover{color:var(--tx)}
.ehead h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px}
.ehead .meta{color:var(--mut);font-size:14.5px;display:flex;gap:6px 12px;flex-wrap:wrap;align-items:center}
.note{background:var(--pribg);color:var(--tx);border-radius:12px;padding:10px 14px;font-size:14px;margin:12px 0 0}
.toolbar{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:15;background:var(--hdr);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);margin:14px -16px 0;padding:10px 16px;border-bottom:1px solid var(--bd);display:flex;gap:8px;align-items:center}
.toolbar .seg{flex:1 1 auto}
.navmap{display:none;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;padding:14px;margin:10px 0 0;background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh)}
.navmap.open{display:grid}
.navmap .ms{grid-column:1/-1;font-size:11.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
.navmap button{height:36px;border-radius:10px;border:1px solid var(--bd);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--mut)}
.navmap button.ok{background:var(--okbg);border-color:transparent;color:var(--ok)}
.navmap button.bad{background:var(--errbg);border-color:transparent;color:var(--err)}
.navmap button.seen{border-style:dashed}
.navmap button:hover{border-color:var(--pri)}
h3.sec{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:34px 0 10px;display:flex;align-items:center;gap:10px}
h3.sec::after{content:"";flex:1;height:1px;background:var(--bd)}
.txt{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px 20px;margin:14px 0;box-shadow:var(--sh);font-size:16px;line-height:1.7}
.txt p{margin:0 0 10px;text-indent:1.2em}
.txt .t{text-indent:0;font-size:13px;font-weight:700;color:var(--pri);text-transform:uppercase;letter-spacing:.04em}
.txt .ti{text-indent:0;font-weight:700;font-size:18px;text-align:center}
.txt .src{text-indent:0;font-size:13px;color:var(--mut);text-align:right;margin:0}
.txt .img{text-indent:0;background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14.5px}
.txt .tira{text-indent:0}
.q{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:var(--sh);scroll-margin-top:130px;position:relative}
.q.ok{box-shadow:inset 3px 0 0 var(--ok),var(--sh)}
.q.bad{box-shadow:inset 3px 0 0 var(--err),var(--sh)}
.q.flash{animation:fl 1s ease}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--pri)}100%{box-shadow:var(--sh)}}
.qh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.qn{font-weight:800;font-size:13px;color:var(--pri);background:var(--pribg);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;font-weight:700}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.bad{background:var(--errbg);color:var(--err)}.tag.img{background:var(--warnbg);color:var(--warn)}
.q .stem{margin:0 0 8px;font-weight:500}
.q blockquote{margin:6px 0 10px;padding:8px 12px;border-left:3px solid var(--bd2);color:var(--mut)}
.op{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;margin:8px 0;background:var(--surface);transition:border-color .15s,background .15s,transform .1s;-webkit-tap-highlight-color:transparent;font-size:15.5px;line-height:1.5}
.op:not([disabled]):hover{border-color:var(--pri);background:var(--pribg)}
.op:not([disabled]):active{transform:scale(.995)}
.op[disabled]{cursor:default}
.op>b{flex:0 0 auto;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--mut);transition:.15s}
.op.right{background:var(--okbg);border-color:var(--ok)}
.op.right>b,.op.correct>b{background:var(--ok);color:#fff}
.op.correct{border-color:var(--ok)}
.op.wrong{background:var(--errbg);border-color:var(--err)}
.op.wrong>b{background:var(--err);color:#fff}
.op.dim{opacity:.6}
.acts{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px}
.lk{color:var(--pri);font-size:14px;font-weight:600;padding:6px 0;text-decoration:none}
.lk:hover{text-decoration:underline}
.exp{background:var(--expbg);border:1px solid color-mix(in srgb,var(--pri) 18%,transparent);border-radius:14px;padding:14px 16px;margin-top:10px;font-size:15.5px;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.exp .g{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.exp ul{margin:6px 0 0;padding-left:20px}
table.xl{border-collapse:collapse;margin:10px 0 12px;font-size:14px;display:block;overflow-x:auto;max-width:100%}
table.xl td,table.xl th{border:1px solid var(--bd);padding:5px 10px;text-align:center}
table.xl th{background:var(--surface2)}
.empty{color:var(--mut);text-align:center;padding:40px 0}

/* footer */
footer.sc{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;width:min(860px,calc(100% - 24px));background:var(--hdr);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh2);padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center}
footer.sc .sct{flex:1;min-width:0;font-size:14px}
footer.sc .sct b{font-variant-numeric:tabular-nums}
footer.sc .bar{margin-top:6px}
footer.sc .pc{font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;color:var(--ok)}
@media (max-width:560px){
  .hero{padding:20px;border-radius:20px}.hero h1{font-size:24px}
  .cta{margin-left:0;width:100%;justify-content:center}
  .ehead h1{font-size:22px}
  .q{padding:14px}.txt{padding:14px 16px}
  .brand .sub2{display:none}
  footer.sc .btn span{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
<button class="brand" id="home" type="button" aria-label="Início"><span class="logo">F</span><span>Fisio VUNESP<small class="sub2">Provas 2024 – 2026</small></span></button>
<span class="saved" id="saved" role="status">✓ Salvo</span>
<button class="ib" id="btnTema" type="button" aria-label="Alternar tema claro/escuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
</div></header>

<main class="wrap" id="app"></main>

<footer class="sc hide" id="foot">
<div class="sct" id="score"></div>
<button class="btn danger" id="btnReset" type="button" aria-label="Recomeçar prova">↺ <span>Recomeçar</span></button>
</footer>

<script>
const EXAMS=[{"id":"ju","ano":2026,"org":"Prefeitura de Jundiaí/SP","cargo":"Fisioterapeuta","data":"Concurso 2026","nota":"Prova 004 (caderno PMJU2606). O PDF não trazia gabarito: as respostas e explicações desta prova foram resolvidas por nós e <b>não são o gabarito oficial</b>. Confira com o gabarito da Vunesp quando sair.","b":[{"t":"h","x":"Língua Portuguesa"},{"t":"txt","x":"<p class=\"t\">Texto para as questões 01 a 07</p>\n<p>Desde os primórdios, os seres humanos investigam e buscam conhecer a natureza – gesto inevitável e indispensável, e no qual empregamos cada vez mais os métodos científicos. O problema reside na separação brutal entre humanidade e natureza, princípio de inúmeras correntes técnicas, científicas e ideológicas. A voracidade da acumulação capitalista impeliu ainda mais as sociedades humanas a subjugarem a natureza, que foi transformada numa fonte de recursos “inesgotável”, o que não é sustentável.</p>\n<p>Além disso, não podemos ignorar que nem a ciência nem as tecnologias que dela derivam são inerentemente positivas. Direta ou indiretamente, muitas de suas aplicações podem ser nocivas à humanidade. Por exemplo, o estudo científico da radiatividade levou à fabricação de bombas atômicas, causando arrependimento nos próprios promotores da energia nuclear. As tecnologias agrárias baseadas no reducionismo da monocultura provocaram a perda de biodiversidade. A lista pode alongar-se, até porque grande parte dos avanços científicos foi resultado de pesquisas com fins militares e só em um momento posterior se estenderam ao uso civil. Semelhantes aplicações da ciência são questionáveis.</p>\n<p>Recentemente, a promoção de energias alternativas que nos ajudam a superar a dependência dos combustíveis fósseis – uma meta louvável – se dá ao custo de uma crescente e destruidora demanda por outros recursos. É o caso do lítio e de outros minerais, cuja exploração, embora essencial para produzir as baterias empregadas nos veículos elétricos, amplia os impactos nocivos da mineração.</p>\n<p><i>(Alberto Acosta. O bem viver, 2026. Adaptado)</i></p>"},{"t":"q","n":1,"stem":"<p>Ao analisar a relação dos seres humanos com a natureza, o autor critica a</p>","o":["ausência de interesse da ciência em pesquisar e viabilizar fontes de energia alternativas às tradicionais.","convicção de alguns cientistas quanto à necessidade de se manter a humanidade apartada do meio ambiente.","visão de que ciência e tecnologia estão primordialmente voltadas para a preservação dos recursos naturais.","crença de que a acumulação capitalista tem como resultado a mitigação da degradação ambiental.","ideia de que os recursos naturais existentes podem ser explorados ilimitadamente sem consequências."],"a":"E","e":"O autor critica a transformação da natureza em fonte de recursos <b>“inesgotável”</b>, “o que não é sustentável”. Logo, a ideia de exploração ilimitada sem consequências é o alvo da crítica."},{"t":"q","n":2,"stem":"<p>O autor menciona o desenvolvimento da bomba atômica com o objetivo de</p>","o":["denunciar a rejeição social a inventores cujas descobertas provocaram inegável prejuízo à humanidade.","criticar a atitude dos cientistas que declararam arrependimento por suas pesquisas na área da energia nuclear.","defender a necessidade de cooperação entre as áreas civil e militar no desenvolvimento de novas tecnologias.","demonstrar que o produto da atividade científica nem sempre é algo essencialmente benéfico à humanidade.","comprovar a impossibilidade de medidas capazes de reverter os efeitos destrutivos das inovações tecnológicas."],"a":"D","e":"A bomba é dada como exemplo de que ciência e tecnologia “não são inerentemente positivas” e podem ser nocivas à humanidade."},{"t":"q","n":3,"stem":"<p>No fragmento do 1º parágrafo “A <b>voracidade</b> da acumulação capitalista <b>impeliu</b> ainda mais as sociedades humanas a <b>subjugarem</b> a natureza...”, os termos destacados significam, respectivamente:</p>","o":["rapidez, forçou e devastarem.","pressa, instigou e prejudicarem.","sofreguidão, determinou e submeterem.","angústia, estimulou e controlarem.","avidez, impulsionou e dominarem."],"a":"E","e":"Voracidade = avidez; impelir = impulsionar; subjugar = dominar. “Sofreguidão” se aproxima de voracidade, mas “submeterem” não concorda com o verbo no plural na forma exigida e “determinou” não equivale a impelir; a opção E é a única com os três sentidos corretos."},{"t":"q","n":4,"stem":"<p>A vírgula foi empregada para isolar uma explicação em:</p>","o":["Desde os primórdios, os seres humanos investigam e buscam conhecer a natureza – gesto inevitável e indispensável... (1º parágrafo)","O problema reside na separação brutal entre humanidade e natureza, princípio de inúmeras correntes técnicas... (1º parágrafo)","Além disso, não podemos ignorar que nem a ciência nem as tecnologias que dela derivam são inerentemente positivas. (2º parágrafo)","Recentemente, a promoção de energias alternativas que nos ajudam a superar a dependência dos combustíveis fósseis... (3º parágrafo)","... embora essencial para produzir as baterias empregadas nos veículos elétricos, amplia os impactos nocivos da mineração. (3º parágrafo)"],"a":"B","e":"Em “..., princípio de inúmeras correntes técnicas...” a vírgula isola um <b>aposto explicativo</b> de “separação brutal entre humanidade e natureza”. Nas demais, a vírgula separa adjunto adverbial deslocado (A, C, D) ou oração concessiva (E)."},{"t":"q","n":5,"stem":"<p>Considere as reescritas de passagens do texto a seguir:<br>• Desde os primórdios, os seres humanos investigam e buscam conhecer a Natureza – gesto inevitável e indispensável, e ________ aplicamos cada vez mais os métodos científicos.<br>• Recentemente, a promoção de energias alternativas ________ recorremos para superar a dependência dos combustíveis fósseis se dá ao custo de uma crescente e destruidora demanda por outros recursos.<br><br>Em conformidade com a norma-padrão, as lacunas devem ser preenchidas, correta e respectivamente, por:</p>","o":["que … das quais","o qual … as quais","aos quais … a que","em que … de que","dos quais … das quais"],"a":"C","e":"O verbo <b>recorrer</b> rege a preposição “a”: “energias alternativas <b>a que</b> recorremos”. Entre as opções, só C traz “a que” na 2ª lacuna; nas demais (“das quais”, “as quais”, “de que”) falta ou sobra a preposição correta. <i>Resolução própria (gabarito não oficial).</i>"},{"t":"q","n":6,"stem":"<p>Sem prejuízo ao sentido original e em conformidade com a norma-padrão de concordância verbal, em “É o caso do lítio e de outros minerais, cuja exploração, <b>embora essencial para produzir as baterias</b>...” (3º parágrafo), o trecho destacado pode ser substituído por:</p>","o":["ainda que essencial para que se produzam as baterias","já que essencial para que se produzam as baterias","mesmo que essencial para que se produza as baterias","logo que essencial para que se produza as baterias","à medida que essencial para que se produza as baterias"],"a":"A","e":"“Embora” é conjunção concessiva, equivalente a “ainda que”. Com “se produzam as baterias” o verbo concorda com o sujeito plural (voz passiva sintética). “Já que” (causa), “logo que” (tempo) e “à medida que” (proporção) mudam o sentido; “mesmo que … se produza as baterias” erra a concordância."},{"t":"q","n":7,"stem":"<p>Assinale a reescrita de trecho do texto em que a norma-padrão de regência verbal e nominal foi respeitada.</p>","o":["... anseiam de conhecer a natureza...","O problema consiste da separação brutal entre humanidade e natureza...","... tecnologias agrárias fundadas ao reducionismo da monocultura...","... o estudo científico da radiatividade acarretou na fabricação de bombas...","... muitas de suas aplicações podem ser danosas à humanidade."],"a":"E","e":"“Danoso” rege “a”: “danosas <b>à</b> humanidade”. Erros: “ansiar” (A) é transitivo direto/“por”; “consistir” rege “em” (B); “fundadas” rege “em” (C); “acarretar” é transitivo direto (D)."},{"t":"q","n":8,"stem":"<p>As concordâncias verbal e nominal estão em conformidade com a norma-padrão em:</p>","o":["É preciso que hajam diferentes maneiras de combater os vários impactos nocivos da mineração.","Acredita-se que a dependência dos combustíveis fósseis podem ser superadas em breve.","Passadas décadas da explosão das bombas atômicas no Japão, o mundo ainda lembra seus efeitos.","É necessário a adoção de medidas que diminuam a distância entre os seres humanos e a natureza.","Deve existir formas interessantes e divertidas de ensinar às crianças o valor da biodiversidade."],"a":"C","e":"“Passadas décadas” (particípio concorda com “décadas”) e “o mundo lembra” estão corretos. Corrigindo: “haja” (A), “pode ser superada” (B), “É necessária a adoção” (D), “Devem existir” (E)."},{"t":"txt","x":"<p class=\"t\">Texto para as questões 09 a 13</p>\n<p>Há coisa de duas semanas, circulou a notícia de que dois modelos de inteligência artificial de uma empresa saíram de controle e invadiram arquivos de uma concorrente. Como o desvio foi rapidamente identificado e não sucedeu nada de mais sério, ninguém parece ter ficado muito preocupado. O fato foi recebido como “parte da rotina”. Nas <i>big techs</i>, os mandachuvas deram de ombros e tocaram adiante.</p>\n<p>Talvez o improvável leitor queira mais detalhes do ocorrido. É legítimo. Vamos lá. No dia 21 de julho, durante um teste de cibersegurança interno em uma empresa de pesquisa e tecnologia em inteligência artificial, dois desses seres de silício, tecnicamente dotados de um módico poder de raciocínio, escapuliram pela internet e entraram clandestinamente no sistema de outro gigante do setor. A organização invadida, percebendo movimentos estranhos em seus domínios privativos e fechados, chamou a polícia. Logo depois, o imbróglio se resolveu sem maiores danos.</p>\n<p>Pequenos episódios anteriores, que já deveriam ter feito soar o alarme, também foram recebidos com indiferença. Em março de 2023, ganhou repercussão a traquinagem do robô virtual que entrou nas redes, fez contato com uma pessoa e pediu que ela o ajudasse a preencher um <i>captcha</i> (aquela verificação chata e enervante, inventada exatamente para barrar a ação de robôs, que nos obriga a ler números e letras de uma imagem toda torta e depois digitá-los num campo em branco). A pessoa abordada achou aquilo esquisito, desconfiou e perguntou: “Ei, mas você é um robô?”. Então, o sintético larápio mentiu, disse que era apenas um deficiente visual, e conseguiu o que queria.</p>\n<p><i>(Eugenio Bucci. “O motim das máquinas”, 09.08.2026. Disponível em: https://www.estadao.com.br/. Adaptado)</i></p>"},{"t":"q","n":9,"stem":"<p>A opinião do autor em relação às ocorrências de falta de controle do ser humano sobre a inteligência artificial está explícita na passagem:</p>","o":["... circulou a notícia de que dois modelos de inteligência artificial de uma empresa saíram de controle... (1º parágrafo)","... dois desses seres de silício, tecnicamente dotados de um módico poder de raciocínio, escapuliram pela internet... (2º parágrafo)","Pequenos episódios anteriores, que já deveriam ter feito soar o alarme, também foram recebidos com indiferença. (3º parágrafo)","Em março de 2023, ganhou repercussão a traquinagem do robô virtual que entrou nas redes, fez contato com uma pessoa... (3º parágrafo)","Então, o sintético larápio mentiu, disse que era apenas um deficiente visual, e conseguiu o que queria. (3º parágrafo)"],"a":"C","e":"A opinião (juízo de valor) aparece em “que já <b>deveriam ter feito soar o alarme</b>”: o autor julga que os episódios mereciam preocupação. As demais passagens relatam fatos."},{"t":"q","n":10,"stem":"<p>No 2º parágrafo do texto, a expressão “dois desses seres de silício” refere-se aos</p>","o":["modelos de inteligência artificial de uma empresa que invadiram arquivos de uma organização concorrente.","robôs virtuais de uma empresa projetados para invadir o sistema de segurança de organizações concorrentes.","modelos de inteligência artificial criados para evitar danos causados por invasões digitais de empresas concorrentes.","arquivos de uma empresa que foram danificados por modelos de inteligência de uma organização concorrente.","sistemas de segurança interna de uma empresa de tecnologia que foram invadidos por uma organização concorrente."],"a":"A","e":"“Seres de silício” retoma, de forma figurada, os “dois modelos de inteligência artificial de uma empresa” que “invadiram arquivos de uma concorrente” (1º parágrafo)."},{"t":"q","n":11,"stem":"<p>Assinale a alternativa cujo trecho apresenta uma hipótese.</p>","o":["... o desvio foi rapidamente identificado e não sucedeu nada de mais sério.","Talvez o improvável leitor queira mais detalhes do ocorrido.","Logo depois, o imbróglio se resolveu sem maiores danos.","... ler números e letras de uma imagem toda torta e depois digitá-los...","A pessoa abordada achou aquilo esquisito, desconfiou e perguntou..."],"a":"B","e":"O advérbio <b>“talvez”</b> expressa dúvida/possibilidade, isto é, uma hipótese. As demais trazem fatos asseverados."},{"t":"q","n":12,"stem":"<p>A expressão destacada está empregada em sentido figurado em:</p>","o":["Nas <i>big techs</i>, os mandachuvas <b>deram de ombros</b> e tocaram adiante. (1º parágrafo)","Talvez o improvável leitor queira mais <b>detalhes do ocorrido</b>. (2º parágrafo)","... durante um <b>teste de cibersegurança</b> interno em uma empresa... (2º parágrafo)","Logo depois, o imbróglio se resolveu <b>sem maiores danos</b>. (2º parágrafo)","... fez contato <b>com uma pessoa</b> e pediu que ela o ajudasse... (3º parágrafo)"],"a":"A","e":"“Deram de ombros” é expressão idiomática: ninguém moveu os ombros, apenas demonstrou indiferença. As demais estão em sentido literal."},{"t":"q","n":13,"stem":"<p>Considere os fragmentos do 3º parágrafo apresentados a seguir:<br>• Pequenos episódios (...) <b>também</b> foram recebidos com indiferença.<br>• ... inventada exatamente <b>para</b> barrar a ação de robôs...<br><br>As palavras destacadas apresentam, correta e respectivamente, sentidos de</p>","o":["inclusão e direção.","inclusão e finalidade.","ênfase e direção.","ênfase e causa.","ênfase e finalidade."],"a":"B","e":"“Também” acrescenta (inclusão) esses episódios aos já citados; “para” introduz o <b>objetivo</b> do captcha (finalidade)."},{"t":"q","n":14,"stem":"<p>A colocação pronominal está em conformidade com a norma-padrão em:</p>","o":["É preciso que descubram-se maneiras de prevenir as consequências nocivas do uso da inteligência artificial.","Tem discutido-se a necessidade de preparar os estudantes para um uso adequado da inteligência artificial.","Nos mais diferentes tipos de trabalho, se espera que a inteligência artificial seja usada de forma responsável.","Nunca se escreveu tanto sobre os diferentes aspectos da utilização de ferramentas de inteligência artificial.","Na área da saúde mental, atualmente questiona-se o uso da inteligência artificial como substituta de psicólogos."],"a":"D","e":"O advérbio de negação “nunca” atrai o pronome: próclise obrigatória (“Nunca <b>se</b> escreveu”). Em A, a conjunção “que” exige “que se descubram”; em B, com verbo auxiliar, “Tem-se discutido”; em E, o advérbio “atualmente” pede “atualmente se questiona”; em C, o início da oração principal após adjunto deslocado é desaconselhado."},{"t":"q","n":15,"stem":"<p>Considere o parágrafo a seguir:<br>O conhecimento ____ respeito da Inteligência Artificial vem crescendo ____ medida que avançam os estudos ____ que se dedicam ____ que se dispõem a descrever e analisar o modo de funcionamento dessa ferramenta tecnológica.<br><br>De acordo com a norma-padrão, as lacunas devem ser preenchidas, correta e respectivamente, com:</p>","o":["a … à … a … aqueles","a … à … à … aqueles","a … a … à … àqueles","à … à … à … àqueles","à … a … a … àqueles"],"a":"A","e":"“<b>a</b> respeito de” (locução sem crase); “<b>à</b> medida que” (locução conjuntiva feminina, com crase); “estudos <b>a</b> que se dedicam” (dedicar-se a); “<b>aqueles</b> que se dispõem” (sujeito, sem preposição)."},{"t":"h","x":"Política de Saúde"},{"t":"q","n":16,"stem":"<p>Uma equipe de saúde da Atenção Básica identificou aumento da incidência de casos de hipertensão arterial em sua população. A equipe decidiu desenvolver ações educativas, ampliar a busca ativa de pessoas com fatores de risco, fortalecer o acompanhamento dos usuários diagnosticados e articular ações relacionadas à alimentação saudável e à atividade física.<br><br>Considerando as disposições da Lei Federal nº 8.080/1990, a situação apresentada está relacionada ao conceito de saúde que</p>","o":["concentra a atuação do SUS nas ações assistenciais dirigidas às pessoas que apresentam doenças ou agravos já identificados.","reconhece que os níveis de saúde da população são determinados por fatores relacionados às condições de vida e à organização social.","considera a atuação do setor de saúde como elemento central para a melhoria das condições sanitárias e sociais da população.","estabelece que as ações de promoção da saúde sejam realizadas pelos serviços especializados, cabendo à Atenção Básica o atendimento clínico.","estabelece que as ações de prevenção ocorram após a confirmação de uma doença ou agravo."],"a":"B","e":"O art. 3º da Lei 8.080/90 afirma que os níveis de saúde expressam a organização social e econômica do país, tendo como determinantes e condicionantes alimentação, moradia, saneamento, trabalho, renda, educação, atividade física, lazer e acesso a bens e serviços. As ações descritas (alimentação, atividade física) refletem esse conceito ampliado."},{"t":"q","n":17,"stem":"<p>Em uma reunião do Conselho Municipal de Saúde, os participantes discutem as formas de participação da comunidade na gestão do Sistema Único de Saúde (SUS) e as atribuições das instâncias colegiadas previstas na Lei Federal nº 8.142/1990.<br><br>Com base nas disposições dessa legislação, a participação da comunidade na gestão do SUS é caracterizada por</p>","o":["reuniões quadrienais destinadas à avaliação da situação de saúde e à proposição de diretrizes para a formulação da política de saúde, realizadas pelo Conselho de Saúde.","caráter permanente e deliberativo atribuído à Conferência de Saúde, enquanto o Conselho de Saúde atua em períodos determinados.","realização, a cada quatro anos, de Conferência de Saúde com representação dos diversos segmentos sociais.","composição do Conselho de Saúde por representantes dos usuários dos serviços de saúde e da administração pública, com participação de outros segmentos conforme definição local.","utilização de consultas públicas como principal instância colegiada para avaliação da situação de saúde e formulação das diretrizes da política de saúde."],"a":"C","e":"Lei 8.142/90, art. 1º: a <b>Conferência de Saúde</b> reúne-se a cada <b>4 anos</b> com representação dos vários segmentos sociais para avaliar a situação de saúde e propor diretrizes. O <b>Conselho</b> é que é permanente e deliberativo (B inverte), e sua composição inclui governo, prestadores, profissionais de saúde e usuários (D é incompleta)."},{"t":"q","n":18,"stem":"<p>Um município de pequeno porte necessita encaminhar alguns de seus usuários para serviços especializados localizados em outros municípios. Diante dessa necessidade, os gestores municipais e estadual discutem a organização regionalizada da assistência à saúde, considerando os critérios estabelecidos pelo Decreto Federal nº 7.508/2011 para a definição de uma região de saúde.<br><br>Nesse contexto, a região de saúde é definida como</p>","o":["espaço geográfico composto por municípios selecionados pelo gestor estadual para o compartilhamento de serviços de saúde e a pactuação de metas assistenciais.","área correspondente ao território de atuação de uma única unidade hospitalar de referência assistencial dos municípios participantes, com gestão compartilhada.","território formado pelos municípios integrantes de uma mesma divisão administrativa estabelecida pelo governo estadual para fins de planejamento orçamentário.","agrupamento de municípios limítrofes, definido a partir de identidades culturais, econômicas e sociais, e de redes de comunicação e infraestrutura de transportes compartilhados.","espaço territorial organizado para integrar os serviços da Atenção Básica dos municípios que apresentam características populacionais semelhantes e demandas comuns."],"a":"D","e":"Decreto 7.508/2011, art. 2º, I: região de saúde é o espaço geográfico contínuo constituído por <b>agrupamento de municípios limítrofes</b>, delimitado a partir de identidades culturais, econômicas e sociais e de redes de comunicação e infraestrutura de transportes compartilhados, com a finalidade de integrar a organização, o planejamento e a execução de ações e serviços de saúde."},{"t":"q","n":19,"stem":"<p>Profissionais de uma equipe de saúde da Atenção Básica discutem o acompanhamento de um usuário com diabetes mellitus. Além do controle glicêmico, consideram aspectos relacionados à sua alimentação, condições de trabalho, saúde mental, prática de atividade física, adesão ao tratamento e necessidade de acompanhamento em outros pontos da rede.<br><br>Nesse caso, a abordagem apresentada está diretamente relacionada à</p>","o":["universalidade.","descentralização.","integralidade.","regionalização.","participação da comunidade."],"a":"C","e":"A <b>integralidade</b> considera o usuário em todas as suas dimensões e articula ações de promoção, prevenção, tratamento e reabilitação em diferentes níveis da rede."},{"t":"q","n":20,"stem":"<p>Em determinada comunidade, uma equipe de saúde identifica elevada exposição da população a um fator ambiental associado ao desenvolvimento de determinada doença. Antes do aparecimento de sinais ou sintomas, são implementadas medidas para reduzir a exposição da população ao fator de risco.<br><br>A intervenção descrita corresponde principalmente à</p>","o":["prevenção primária.","prevenção secundária.","prevenção terciária.","reabilitação.","prevenção quaternária."],"a":"A","e":"Atuar sobre o fator de risco <b>antes</b> da doença instalada, evitando sua ocorrência, é prevenção primária. A secundária é diagnóstico/tratamento precoce; a terciária, limitar sequelas; a quaternária, evitar excesso de intervenções."},{"t":"q","n":21,"stem":"<p>Durante uma atividade de formação, um profissional apresentou diferentes concepções acerca da organização dos serviços de saúde e do processo saúde-doença. A primeira delas valoriza a identificação dos agravos e o tratamento das doenças, com forte participação dos serviços hospitalares. Enquanto a segunda considera as condições de vida da população, a participação social e a articulação entre ações de promoção, prevenção e assistência.<br><br>De acordo com a trajetória da Reforma Sanitária brasileira e com os modelos assistenciais de saúde, a segunda concepção</p>","o":["estabelece a organização dos serviços de saúde a partir das condições clínicas apresentadas pelos usuários, com articulação posterior com outras políticas sociais.","se aproxima do modelo médico-assistencial, cuja organização privilegia a assistência individual e os serviços hospitalares.","caracteriza o modelo sanitarista, fundamentado em campanhas e ações coletivas de controle de doenças, com organização da assistência a partir das demandas individuais.","prioriza ações coletivas de prevenção como eixo da atenção, mantendo as práticas assistenciais organizadas de forma independente.","está relacionada à ampliação do conceito de saúde e à organização das práticas a partir das necessidades da população."],"a":"E","e":"A segunda concepção corresponde ao modelo da vigilância/promoção da saúde defendido pela Reforma Sanitária: conceito ampliado de saúde, determinantes sociais, participação social e integração promoção–prevenção–assistência, a partir das necessidades da população."},{"t":"q","n":22,"stem":"<p>Um município pretende avaliar a magnitude de uma doença infecciosa em seu território. Para isso, a equipe epidemiológica deseja conhecer a proporção da população que apresenta a doença em determinado momento, considerando tanto casos antigos quanto casos novos existentes naquele período.<br><br>O indicador apropriado para essa finalidade é</p>","o":["incidência.","letalidade.","mortalidade específica.","prevalência.","coeficiente de mortalidade infantil."],"a":"D","e":"<b>Prevalência</b> = casos existentes (novos + antigos) em determinado momento/período, dividido pela população. Incidência considera apenas casos novos."},{"t":"q","n":23,"stem":"<p>Um município identificou diferenças nas condições de saúde entre áreas de seu território e decidiu desenvolver uma estratégia integrada para enfrentá-las. A Secretaria Municipal de Saúde passou a articular ações com as áreas de educação, assistência social, saneamento, meio ambiente e segurança alimentar, considerando as características e necessidades da população de cada território.<br><br>A iniciativa descrita está relacionada à compreensão da saúde como política pública social porque</p>","o":["atribui à área da saúde a responsabilidade pela condução das ações relacionadas aos determinantes sociais da população.","reconhece que as condições de saúde estão relacionadas a fatores sociais, econômicos, ambientais e culturais que envolvem diferentes setores da sociedade.","fundamenta a definição das políticas sociais nas demandas identificadas pelos serviços de saúde do território.","organiza a atuação dos diferentes setores a partir da integração das ações assistenciais desenvolvidas pela rede municipal de saúde.","relaciona a melhoria das condições de saúde à ampliação da oferta de serviços e procedimentos realizados pela rede assistencial."],"a":"B","e":"Saúde como política social pressupõe que seus determinantes (sociais, econômicos, ambientais, culturais) ultrapassam o setor saúde, exigindo ação intersetorial. A saúde não conduz sozinha (A) nem se limita à rede assistencial (D, E)."},{"t":"q","n":24,"stem":"<p>No acompanhamento de pessoas com condições crônicas, a Atenção Básica pode encaminhar o usuário para outros pontos da Rede de Atenção à Saúde quando houver necessidade de avaliação ou intervenção especializada. Após esse atendimento, as informações e condutas realizadas devem contribuir para a continuidade do acompanhamento pela equipe que possui vínculo com o usuário.<br><br>É correto afirmar que a descrição apresentada caracteriza a</p>","o":["coordenação do cuidado, mediante articulação entre os diferentes pontos de atenção conforme as necessidades de saúde.","fragmentação da assistência, com atuação independente dos diferentes serviços que compõem a rede.","transferência do acompanhamento para a atenção especializada após a identificação de necessidades de maior complexidade.","centralização da assistência nos serviços hospitalares responsáveis pelo atendimento das condições crônicas.","organização da assistência segundo a demanda espontânea, com acesso aos diferentes serviços conforme a procura pelo usuário."],"a":"A","e":"A Atenção Básica mantém o vínculo, ordena a rede e articula os pontos de atenção (referência e contrarreferência): é a <b>coordenação do cuidado</b>."},{"t":"q","n":25,"stem":"<p>Ao avaliar o funcionamento de uma unidade de saúde, os trabalhadores identificaram que a recepção dos usuários estava organizada como uma etapa administrativa, com encaminhamento dos casos aos diferentes profissionais sem que suas necessidades fossem previamente compreendidas. A equipe passou a discutir novas formas de abordagem, buscando ampliar a escuta, estabelecer vínculo e construir respostas adequadas às demandas apresentadas.<br><br>A mudança proposta está alinhada à Política Nacional de Humanização do SUS por compreender o acolhimento como</p>","o":["atividade desenvolvida pela recepção para orientar os usuários quanto aos serviços disponíveis na unidade.","procedimento inicial destinado a definir o profissional responsável pelo atendimento de cada usuário.","estratégia de encaminhamento dos usuários aos serviços que apresentam maior capacidade de resolução das demandas identificadas.","mecanismo de organização do acesso baseado na classificação dos usuários conforme o tipo de atendimento solicitado.","prática de escuta e responsabilização que contribui para a organização do cuidado a partir das necessidades apresentadas pelos usuários."],"a":"E","e":"Na PNH, o acolhimento não é uma etapa/local nem uma triagem: é uma <b>postura</b> de escuta qualificada, vínculo e responsabilização, que orienta o cuidado a partir das necessidades do usuário."},{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":26,"stem":"<p>O Código de Ética e Deontologia da Fisioterapia (Resolução COFFITO nº 424/2013), descreve deveres e responsabilidades fundamentais na assistência ao cliente/paciente. No que diz respeito à evolução e ao prontuário, assinale a alternativa que apresenta corretamente uma atribuição do fisioterapeuta.</p>","o":["O registro no prontuário fisioterapêutico é opcional, caso o paciente seja atendido em dinâmicas de grupo.","O fisioterapeuta pode delegar o registro de sua evolução diária no prontuário a um estagiário de fisioterapia, sem necessidade de supervisão direta.","É dever do fisioterapeuta registrar no prontuário do paciente todas as condutas assistenciais adotadas, de forma clara, objetiva e contínua.","A anotação e a evolução no prontuário devem ser realizadas apenas em dois momentos: na avaliação inicial e no momento da alta fisioterapêutica.","É permitido utilizar corretivo ou rasurar o prontuário, caso o profissional cometa um erro de anotação na conduta fisioterapêutica do dia."],"a":"C","e":"O Código de Ética exige o registro, em prontuário, de todas as condutas adotadas, com evolução contínua (a cada atendimento), legível e sem rasuras. O registro não é opcional nem delegável sem supervisão, e a evolução não se limita à avaliação e à alta."},{"t":"q","n":27,"stem":"<p>Um fisioterapeuta recém-contratado por um município paulista percebe que a rede de saúde local consegue garantir ao usuário acesso desde campanhas de prevenção e reabilitação na Unidade Básica de Saúde (UBS) até cirurgias ortopédicas de alta complexidade em hospitais de referência, dependendo da necessidade de cada caso.<br><br>Essa articulação contínua das ações e serviços preventivos e curativos, em todos os níveis de complexidade, reflete diretamente qual princípio do Sistema Único de Saúde (SUS)?</p>","o":["Descentralização.","Universalidade.","Integralidade.","Participação popular.","Equidade."],"a":"C","e":"Integralidade (CF, art. 198, II; Lei 8.080, art. 7º, II): conjunto articulado e contínuo de ações e serviços preventivos e curativos, individuais e coletivos, em todos os níveis de complexidade."},{"t":"q","n":28,"stem":"<p>A Fisioterapia consolidou-se como profissão de nível superior no Brasil na segunda metade do século XX. O principal marco legal, ocorrido no ano de 1969, que reconheceu e regulamentou as profissões de fisioterapeuta e terapeuta ocupacional em território nacional, provendo base legal para suas atribuições, foi</p>","o":["a Lei Orgânica da Saúde nº 8.080, de 19 de setembro de 1990.","a Constituição Federal de 1988.","a Resolução COFFITO nº 8, de 20 de fevereiro de 1978.","o Decreto-Lei nº 938, de 13 de outubro de 1969.","a Lei nº 8.142, de 28 de dezembro de 1990."],"a":"D","e":"O <b>Decreto-Lei nº 938, de 13/10/1969</b>, define as profissões de fisioterapeuta e terapeuta ocupacional. A Lei 6.316/1975 criou os Conselhos Federal e Regionais (COFFITO/CREFITO)."},{"t":"q","n":29,"stem":"<p>Entre as competências do fisioterapeuta na Rede de Cuidados à Pessoa com Deficiência, componente essencial das Redes de Atenção à Saúde (RAS), estão a prescrição e o acompanhamento do uso de Tecnologias Assistivas (TA).<br><br>Sobre esse tema, é correto afirmar que</p>","o":["o fornecimento de tecnologia assistiva no SUS restringe-se a adaptações domiciliares, não contemplando meios auxiliares de locomoção.","a prescrição de órteses e próteses no âmbito do SUS é um ato exclusivo do médico ortopedista, cabendo ao fisioterapeuta estritamente o treino de marcha.","o fisioterapeuta avalia e prescreve o dispositivo de locomoção, porém, após a entrega do equipamento pelo SUS, não são de sua responsabilidade o acompanhamento ou a reavaliação.","a prescrição e a adaptação de cadeiras de rodas são procedimentos exclusivos da Terapia Ocupacional, sendo vedados ao fisioterapeuta pelo seu conselho de classe.","o fisioterapeuta tem autonomia e competência legal para avaliar, prescrever e treinar o paciente para o uso de órteses, próteses e meios auxiliares de locomoção, visando à reabilitação funcional."],"a":"E","e":"O fisioterapeuta tem competência para avaliar, prescrever, adaptar e treinar o uso de órteses, próteses e meios auxiliares de locomoção (Resolução COFFITO 80/1987 e normas posteriores), acompanhando e reavaliando o uso. Os meios de locomoção integram a lista de órteses, próteses e meios auxiliares do SUS."},{"t":"q","n":30,"stem":"<p>No contexto da Atenção Primária à Saúde (APS) e considerando as diretrizes do Núcleo Ampliado de Saúde da Família e Atenção Básica (NASF – AB), o fisioterapeuta atua de forma interprofissional e integrada com a Estratégia Saúde da Família (ESF).<br><br>Assinale a alternativa que representa corretamente uma forma de atuação desse profissional no NASF – AB.</p>","o":["Atendimento ambulatorial diário, focado exclusivamente na reabilitação traumato-ortopédica individualizada dentro da Unidade Básica de Saúde.","Regulação exclusiva de vagas e leitos para hospitais de nível terciário da região de saúde correspondente.","Apoio matricial, por meio de discussões de casos, atendimentos compartilhados e construção de Projetos Terapêuticos Singulares (PTS) junto às equipes de referência.","Fiscalização sanitária punitiva de estabelecimentos comerciais e serviços de alimentação localizados no território adscrito da ESF.","Prescrição de anti-inflamatórios e analgésicos opioides para o controle imediato da dor crônica na comunidade."],"a":"C","e":"O NASF-AB trabalha com <b>apoio matricial</b> (assistencial e técnico-pedagógico): discussão de casos, atendimentos compartilhados, PTS, educação permanente e ações coletivas, sem substituir a equipe nem ser ambulatório de especialidade. Fisioterapeuta não prescreve medicamentos."},{"t":"q","n":31,"stem":"<p>Segundo o modelo clássico de História Natural da Doença, o fisioterapeuta desempenha papéis cruciais. Ao atuar em uma indústria, instituindo um programa focado na ergonomia do posto de trabalho e na adoção de micropausas orientadas (ginástica laboral) para funcionários até então saudáveis, com o objetivo de evitar o surgimento de distúrbios osteomusculares relacionados ao trabalho (DORT), o fisioterapeuta realiza uma ação de</p>","o":["prevenção primária.","prevenção secundária.","prevenção terciária.","proteção específica de nível secundário.","reabilitação funcional focada em agravos."],"a":"A","e":"Atuação em indivíduos saudáveis, antes da doença, para evitar seu surgimento = prevenção primária (promoção da saúde e proteção específica)."},{"t":"q","n":32,"stem":"<p>A ação muscular em que o torque produzido pelo músculo é menor do que a resistência externa, resultando em um movimento articular em que as extremidades musculares se distanciam e o músculo aparenta alongar-se, é classificada como</p>","o":["isométrica.","isotônica concêntrica.","isocinética.","auxotônica.","isotônica excêntrica."],"a":"E","e":"Na contração <b>excêntrica</b> a resistência externa supera o torque muscular: o músculo gera força enquanto é alongado (freia o movimento). Na concêntrica o músculo encurta; na isométrica não há movimento articular."},{"t":"q","n":33,"stem":"<p>Durante a realização de um salto no voleibol ou uma corrida de 100 metros rasos, a musculatura esquelética necessita de um suprimento extremamente rápido de energia. A via bioenergética predominante nesses exercícios de alta intensidade e curtíssima duração e seu substrato de ação, respectivamente, são:</p>","o":["sistema glicolítico aeróbio; glicose sanguínea.","sistema ATP-CP (fosfagênio); fosfocreatina.","ciclo de Krebs (oxidativo); ácidos graxos livres.","glicólise anaeróbia lática; glicogênio hepático.","sistema oxidativo; aminoácidos essenciais."],"a":"B","e":"Esforços máximos de até ~10 s usam o sistema ATP-CP (fosfagênio), cujo substrato é a fosfocreatina muscular, sem necessidade de oxigênio."},{"t":"q","n":34,"stem":"<p>A estrutura de tendões que se assemelha a um capuz e que comprime ativamente a cabeça do úmero contra a cavidade glenoide, denominada “manguito rotador”, é formada pelos músculos</p>","o":["deltoide, peitoral maior, coracobraquial e redondo maior.","romboide, trapézio, levantador da escápula e grande dorsal.","peitoral menor, subclávio, serrátil anterior e bíceps braquial.","supraespinhal, infraespinhal, redondo menor e subescapular.","tríceps braquial, ancôneo, pronador redondo e supinador."],"a":"D","e":"Manguito rotador: supraespinhal, infraespinhal, redondo menor e subescapular (“SITS”)."},{"t":"q","n":35,"stem":"<p>O cuidado em reabilitação executado pelos profissionais do Núcleo de Apoio à Saúde da Família (Nasf) na Atenção Básica consolida-se em diversas práticas assistenciais e educativas. No que tange à aplicação dos grupos terapêuticos e atividades coletivas em reabilitação pela eNasf, é correto afirmar que</p>","o":["excluem intencionalmente o matriciamento das equipes de Saúde da Família (eSF), restringindo-se o conhecimento ao profissional especialista do Nasf.","adquirem perfil estritamente assistencial-agudo, atuando de maneira curativa exclusivamente no ambiente pós-cirúrgico de imobilizações e fixações graves.","têm por finalidade principal ampliar as ações da Atenção Básica por meio do cuidado contínuo e resolutivo no território, não substituindo ou competindo com os serviços da atenção especializada.","demandam aparatos estruturais mecânicos e densidade tecnológica de avaliação isocinética fechada na Unidade Básica de Saúde.","são desenhados com o único escopo de regular fluxos para encaminhar integralmente todos os portadores de morbidades crônicas para tratamentos fora da comunidade."],"a":"C","e":"As ações coletivas do Nasf ampliam a resolutividade e a integralidade da Atenção Básica no território, em apoio (e não em substituição ou concorrência) às equipes e à atenção especializada. Usam tecnologias leves e incluem matriciamento."},{"t":"q","n":36,"stem":"<p>Durante o movimento humano, os receptores encapsulados que se localizam nas camadas profundas e nas cápsulas articulares, que possuem adaptação lenta e que são importantes na sinalização do grau de rotação contínua da articulação são os</p>","o":["corpúsculos de Pacini.","receptores de Ruffini.","fusos musculares.","órgãos tendinosos de Golgi.","corpúsculos de Meissner."],"a":"B","e":"Terminações de <b>Ruffini</b>: mecanorreceptores de adaptação lenta nas cápsulas articulares e camadas profundas da pele, sinalizando posição, amplitude e rotação articular contínua. Pacini adaptam rapidamente (vibração/aceleração)."},{"t":"q","n":37,"stem":"<p>De acordo com as diretrizes da Organização Mundial da Saúde (OMS) para a promoção da saúde e prevenção de agravos por meio da atividade física, a recomendação central para adultos (18 a 64 anos) consiste em realizar</p>","o":["pelo menos 150 a 300 minutos de atividade física aeróbica de moderada intensidade ao longo da semana.","75 minutos mensais de atividade física aeróbica de intensidade leve.","atividades de fortalecimento muscular restritas a um único dia da semana.","prática de atividades físicas aeróbicas vigorosas, de forma ininterrupta, por 300 minutos nos finais de semana.","adoção prioritária de comportamentos sedentários intervalados com alongamentos curtos diários."],"a":"A","e":"Diretrizes OMS 2020: adultos, 150–300 min/semana de atividade aeróbica moderada (ou 75–150 min vigorosa), mais fortalecimento muscular de grandes grupos em 2 ou mais dias, e redução do sedentarismo."},{"t":"q","n":38,"stem":"<p>A postura ortostática ideal depende do equilíbrio dinâmico entre as cadeias musculares. Em um paciente que apresenta hiperlordose lombar acompanhada de anteversão pélvica, a análise cinesiológica estrutural aponta para o seguinte desequilíbrio muscular clássico:</p>","o":["encurtamento dos músculos abdominais e alongamento dos extensores da coluna.","encurtamento dos músculos isquiotibiais e fraqueza dos flexores do quadril.","fraqueza dos músculos extensores da coluna e encurtamento dos glúteos.","encurtamento dos músculos flexores do quadril e fraqueza dos abdominais.","alongamento dos músculos paravertebrais e hiperatividade dos isquiotibiais."],"a":"D","e":"Síndrome cruzada inferior: flexores do quadril e extensores lombares encurtados/hiperativos; abdominais e glúteos alongados e fracos, gerando anteversão pélvica e hiperlordose."},{"t":"q","n":39,"stem":"<p>Na análise cinesiológica e funcional da marcha humana normal, durante a fase de apoio, o evento de “contato inicial” (toque do calcanhar no solo) exige ação estabilizadora muscular crítica. Nesse instante inicial, os músculos dorsiflexores do tornozelo (como o tibial anterior) são ativados para evitar que a planta do pé atinja o solo de forma brusca. O tipo de ação realizada por esses músculos, nesse exato momento, é</p>","o":["isotônica concêntrica.","isotônica excêntrica.","isométrica.","isocinética.","auxotônica de predomínio concêntrico."],"a":"B","e":"Do contato inicial à resposta à carga, o tibial anterior contrai alongando-se para controlar a queda do antepé (flexão plantar): ação <b>excêntrica</b>. Na fase de balanço, a ação é concêntrica."},{"t":"q","n":40,"stem":"<p>Durante o processo de desmame da ventilação mecânica invasiva, a avaliação dos índices preditivos de sucesso é uma etapa fundamental. O índice de respiração rápida e superficial (IRRS), ou índice de Tobin, é amplamente utilizado na prática clínica.<br><br>Assinale a alternativa que descreve, correta e respectivamente, a fórmula para seu cálculo e o seu principal valor preditivo.</p>","o":["Pressão inspiratória máxima (PImax) dividida pelo volume corrente; valor > – 30 cmH2O indica sucesso.","Frequência respiratória (em irpm) dividida pelo volume corrente (em litros); valor < 105 indica maior chance de sucesso.","Frequência respiratória multiplicada pelo volume minuto; valor < 105 aponta falha iminente no desmame.","Volume corrente (em litros) dividido pela frequência respiratória; valor > 105 reflete bom drive respiratório.","Pressão de oclusão das vias aéreas (P0.1) dividida pela PImax; valor < 0,3 demonstra alta capacidade muscular."],"a":"B","e":"IRRS (Tobin) = f (irpm) / VC (L). Valores <b>&lt; 105</b> predizem maior chance de sucesso no desmame; &gt; 105 sugere respiração rápida e superficial e risco de falha."},{"t":"q","n":41,"stem":"<p>O Teste de Caminhada de 6 Minutos (TC6M) é um teste de esforço submáximo frequentemente empregado na avaliação funcional de pacientes com insuficiência cardíaca. Segundo as diretrizes da American Thoracic Society (ATS), durante a execução rigorosa do TC6M, é correto afirmar que</p>","o":["o fisioterapeuta deve ditar o ritmo da marcha, mantendo-se ligeiramente à frente do paciente.","frases de incentivo não padronizadas podem ser ditas de forma contínua para garantir o alcance do VO2 máximo.","o paciente deve ser instruído a caminhar a maior distância possível em 6 minutos, sendo-lhe permitido desacelerar e parar, se necessário.","é obrigatório o uso de esteira ergométrica, visando ao controle exato da velocidade, sem inclinação.","caso o paciente interrompa a caminhada para descansar, o cronômetro deve ser imediatamente pausado."],"a":"C","e":"ATS: corredor plano de 30 m, ritmo <b>autoselecionado</b>; o paciente caminha a maior distância possível em 6 min e pode parar e descansar, mas o cronômetro <b>não</b> é interrompido. Incentivo só com frases padronizadas a cada minuto; o avaliador não caminha junto nem dita o ritmo."},{"t":"q","n":42,"stem":"<p>O fisioterapeuta é acionado no pronto-socorro para avaliação de um jovem de 25 anos com crise aguda e grave de asma. O paciente apresenta uso exacerbado de musculatura acessória respiratória, taquicardia e sudorese. Na ausculta pulmonar, o seguinte achado semiológico pode indicar o estágio de extrema gravidade da obstrução, refletindo baixo fluxo aéreo (iminência de insuficiência respiratória grave):</p>","o":["roncos densos e estertores grossos (bolhosos), audíveis apenas em bases pulmonares bilateralmente.","murmúrio vesicular praticamente inaudível (“tórax silencioso”), acompanhado de ausência ou diminuição de sibilos.","estridor contínuo inspiratório audível na região cervical sem o uso do estetoscópio.","presença de sibilos polifônicos e altos em todos os campos pulmonares, indicando volume corrente adequado.","sopro tubário (brônquico) identificado nas zonas de transição das escápulas."],"a":"B","e":"O “tórax silencioso” (ausência de sibilos e de murmúrio vesicular) na crise de asma indica obstrução tão grave que o fluxo aéreo é insuficiente para gerar ruído: sinal de iminência de falência respiratória."},{"t":"q","n":43,"stem":"<p>Paciente de 65 anos, diagnosticado com doença pulmonar obstrutiva crônica (DPOC) de fenótipo enfisematoso, apresenta limitação grave ao exercício durante o programa de reabilitação pulmonar. A avaliação revela dispneia intensa secundária à hiperinsuflação pulmonar dinâmica precoce durante o esforço.<br><br>Qual estratégia terapêutica, sustentada por evidências científicas, é a mais indicada para atenuar agudamente o quadro e otimizar a tolerância ao esforço físico deste paciente?</p>","o":["Execução de manobras de expiração forçada repetitivas durante a fase de maior esforço, com o objetivo de acelerar o esvaziamento alveolar e reduzir o aprisionamento de ar.","Prescrição de treinamento muscular inspiratório (TMI) de alta carga, executado de forma concomitante ao exercício aeróbico, visando aumentar a força de recolhimento elástico pulmonar.","Associação de suporte ventilatório não invasivo (ex.: CPAP ou VNI) durante a execução do exercício, visando ao contrabalanceamento da pressão expiratória final positiva intrínseca (PEEPi) e descarregar a musculatura inspiratória.","Substituição do treinamento de membros inferiores por exercícios de membros superiores sustentados sem apoio, visando facilitar a ação dos músculos estabilizadores da cintura escapular na ventilação.","Inclusão de exercícios com incentivadores inspiratórios a volume durante o esforço físico, focados em inspirações rápidas e profundas, para evitar o fechamento prematuro dos bronquíolos terminais."],"a":"C","e":"Na hiperinsuflação dinâmica surge PEEP intrínseca, que aumenta o trabalho inspiratório. CPAP/VNI durante o exercício contrabalanceia a PEEPi e descarrega a musculatura inspiratória, reduzindo dispneia e melhorando a tolerância (evidência em DPOC grave). Expiração forçada piora o colapso de vias aéreas; respirações rápidas e profundas pioram a hiperinsuflação."},{"t":"q","n":44,"stem":"<p>Um paciente com insuficiência cardíaca de fração de ejeção reduzida relata fadiga precoce e mialgia durante caminhadas curtas. Qual é o achado fisiopatológico no músculo esquelético periférico que justifica diretamente esse sintoma e é alvo de melhora com a reabilitação?</p>","o":["Hiperperfusão muscular constante, que promove lavagem excessiva do lactato tecidual e esgotamento enzimático.","Aumento exacerbado na densidade mitocondrial e rápida proliferação de fibras do tipo I nas fases avançadas.","Aumento na ação capilar da óxido-nítrico-sintase endotelial, causando vasoplegia acentuada intramuscular durante repouso.","Hipertrofia exclusiva e difusa dos músculos esqueléticos, gerando incompatibilidade entre oferta de oxigênio e demanda tecidual de grande monta.","Miopatia esquelética intrínseca da insuficiência cardíaca, caracterizada por apoptose celular, menor densidade capilar e mudança para fibras do tipo IIx (glicolíticas)."],"a":"E","e":"Na IC há miopatia esquelética: atrofia, apoptose, redução da densidade capilar e mitocondrial e mudança de fibras tipo I (oxidativas) para IIx (glicolíticas), causando fadiga precoce. O treinamento físico reverte parte dessas alterações."},{"t":"q","n":45,"stem":"<p>Assinale a alternativa que contempla estratégias seguras e indicadas para otimização da função pulmonar e prevenção de atelectasias no pós-operatório imediato (fase I) de cirurgia de revascularização do miocárdio (CRM) via esternotomia mediana clássica.</p>","o":["Aplicação de percussão torácica vigorosa (tapotagem) na parede anterior do tórax para deslocamento de secreções.","Exercícios de respiração profunda e mobilização precoce, associando o estímulo de tosse com suporte por contenção esternal (abraço em travesseiro).","Repouso absoluto no leito pelas primeiras 72 horas para minimizar o risco de deiscência óssea do esterno.","Ventilação não invasiva (VNI), mantendo pressão inspiratória (IPAP) superior a 25 cmH2O de forma profilática ininterrupta.","Tosse forçada contínua, sem uso de apoios, para garantir hiperinsuflação e reversão de <i>shunt</i> pulmonar."],"a":"B","e":"Fase I pós-CRM: exercícios respiratórios (inspiração profunda), mobilização/deambulação precoce e tosse assistida com contenção esternal protegem o esterno e previnem atelectasia. Evitam-se percussão vigorosa, repouso prolongado e pressões excessivas."},{"t":"q","n":46,"stem":"<p>A avaliação contínua dos marcos do desenvolvimento neuropsicomotor é uma atribuição essencial para a intervenção precoce em pediatria. Ao avaliar um lactente de 6 meses de idade com desenvolvimento típico, o fisioterapeuta deve constatar a seguinte habilidade motora:</p>","o":["marcha dependente com base de sustentação alargada.","habilidade de sentar-se sem apoio de forma estável e realizar o movimento de pinça fina (polegar e indicador).","locomoção por meio do engatinhar de forma recíproca cruzada por longas distâncias.","capacidade de rolar de prono para supino e controle de tronco para manter-se sentado com apoio anterior das mãos.","presença exarcerbada e obrigatória do reflexo de preensão palmar e reflexo de Moro."],"a":"D","e":"Aos 6 meses o lactente rola (prono–supino) e senta com apoio das mãos à frente (“tripé”). Sentar sem apoio estável e pinça fina ocorrem por volta de 8–10 meses; engatinhar recíproco e marcha, mais tarde; os reflexos de preensão palmar e Moro desaparecem por volta dos 4–6 meses."},{"t":"q","n":47,"stem":"<p>Um paciente hemiparético à direita, decorrente de um acidente vascular cerebral (AVC) isquêmico, encontra-se em reabilitação. O fisioterapeuta decide aplicar o método de facilitação neuromuscular proprioceptiva (FNP), baseando-se no princípio da irradiação motora. O fundamento dessa técnica consiste em</p>","o":["promover a ativação da musculatura parética apenas por meio do estiramento passivo e prolongado do segmento afetado.","inibir completamente a contração dos músculos do hemicorpo preservado para focar o recrutamento apenas na via corticoespinhal ipsilateral.","ativar grupos musculares fracos e lesados a partir da estimulação, mediante resistência manual, de grupos musculares fortes e preservados.","isolar rigorosamente os movimentos articulares em um único plano sagital ou frontal, evitando diagonais que causam compensações motoras.","utilizar exclusivamente a estimulação elétrica para irradiar impulsos diretamente nas placas motoras da musculatura atrofiada."],"a":"C","e":"Irradiação (overflow) é a propagação da resposta a partir de músculos fortes, estimulados com resistência manual máxima, para músculos fracos sinergistas. A FNP usa padrões diagonais e espirais, não planos isolados."},{"t":"q","n":48,"stem":"<p>Durante a assistência fisioterapêutica no puerpério, a avaliação e o tratamento das disfunções do assoalho pélvico são fundamentais para o restabelecimento da saúde da mulher. É atribuição do fisioterapeuta</p>","o":["prescrever analgésicos farmacológicos para controle da dor na região da episiotomia.","aplicar exercícios abdominais de alto impacto já no primeiro dia de puerpério para fechamento da diástase do reto abdominal.","orientar o treinamento da musculatura do assoalho pélvico exclusivamente após o sexto mês pós-parto.","contraindicar qualquer tipo de avaliação do assoalho pélvico caso a paciente tenha sido submetida a um parto cesárea.","avaliar a função da musculatura do assoalho pélvico e instituir o treinamento muscular específico, associado a orientações posturais e de amamentação."],"a":"E","e":"O fisioterapeuta avalia o assoalho pélvico e prescreve o treinamento específico (que pode iniciar precocemente conforme a condição clínica), com orientações posturais e de amamentação. Não prescreve fármacos, e exercícios abdominais de alto impacto são contraindicados no pós-parto imediato."},{"t":"q","n":49,"stem":"<p>Uma paciente submetida à mastectomia radical modificada é encaminhada ao serviço de fisioterapia. O foco das atribuições do fisioterapeuta no pós-operatório envolve a recuperação funcional e a prevenção de complicações.<br><br>Assinale a alternativa que apresenta conduta fisioterapêutica adequada para esse caso.</p>","o":["Imobilizar o membro superior ipsilateral por quatro semanas, focando a reabilitação apenas na deambulação precoce.","Realizar a reabilitação que inclui a drenagem linfática manual, cuidados com a pele, compressão funcional e exercícios linfomiocinéticos.","Evitar exercícios resistidos por 12 semanas, para não induzir a formação de linfedema secundário, e manter a amplitude de movimento restrita neste período.","Aplicar termoterapia profunda contínua para acelerar o processo de cicatrização do tecido no sítio cirúrgico.","Realizar mobilizações passivas no membro, para evitar a fadiga da musculatura peitoral remanescente, e ganhar amplitude nos últimos graus de movimento."],"a":"B","e":"Na prevenção e no tratamento do linfedema pós-mastectomia usa-se terapia física complexa: drenagem linfática manual, cuidados com a pele, compressão (bandagem/luva) e exercícios linfomiocinéticos. Imobilização prolongada, restrição por 12 semanas e calor profundo são inadequados."},{"t":"q","n":50,"stem":"<p>Sobre a intervenção fisioterapêutica na esclerose lateral amiotrófica (ELA), assinale a alternativa correta.</p>","o":["A conduta é essencialmente adaptativa e paliativa, mantendo a funcionalidade possível, prevenindo encurtamentos musculares e oferecendo suporte indispensável à função respiratória e bulbar.","O fortalecimento muscular de resistência máxima (alta carga) deve ser realizado diariamente para induzir hipertrofia e reverter a denervação dos neurônios motores.","A avaliação inicial descarta a capacidade respiratória, visto que o comprometimento da bomba ventilatória só ocorre nos dias que antecedem o óbito.","O treinamento aeróbico de altíssima intensidade é indicado em todas as fases da doença para forçar a neuroplasticidade no nível do sistema nervoso central.","A prescrição de dispositivos de auxílio à locomoção é contraindicada, pois a redução da descarga de peso acelera a apoptose das células de Schwann periféricas."],"a":"A","e":"A ELA é neurodegenerativa e progressiva: a fisioterapia é adaptativa e paliativa, mantendo funcionalidade, prevenindo encurtamentos e dando suporte respiratório (tosse assistida, VNI) e bulbar. Exercício de alta carga/altíssima intensidade é inadequado e os dispositivos de auxílio são indicados."}],"total":50},{"id":"rp","ano":2026,"org":"Prefeitura de São José do Rio Preto/SP","cargo":"Fisioterapeuta","data":"18/01/2026","pdf":"https://arquivos.qconcursos.com/prova/arquivo_prova/144796/vunesp-2026-prefeitura-de-sao-jose-do-rio-preto-sp-fisioterapeuta-prova.pdf","b":[{"t":"h","x":"Língua Portuguesa"},{"t":"txt","x":"<p class=\"t\">Texto para as questões 01 a 10 – Cuidar de quem cuida</p>\n<p>Responder a uma pergunta várias vezes, lidar com uma crise de agressividade e insistir para que o ente querido se alimente ou tome banho. Esses são alguns dos desafios enfrentados por brasileiros que assumem a tarefa de cuidar de um familiar idoso com demência. Na sua maioria, são mulheres, mas há também homens, filhos e filhas ou netos e netas, que se dedicam àqueles que precisam de ajuda, compreensão e afeto.</p>\n<p>Não raro, o peso dessa rotina implica angústia, estresse e depressão, com o adoecimento de toda a família. Para atenuar esse sofrimento, o Ministério da Saúde traz a boa notícia de que está desenvolvendo um protocolo de terapia em parceria com o Hospital Alemão Oswaldo Cruz, de São Paulo. Batizado de Estratégias para Cuidadores em Demência (Escada), o projeto-piloto é uma adaptação do protocolo britânico <i>Start</i>. Ou seja, foi testado e aprovado.</p>\n<p>O Hospital Oswaldo Cruz treina agentes comunitários que replicam o protocolo junto dos cuidadores, que passam por oito sessões, com suporte psicológico, nas quais aprendem técnicas de manejo do estresse. O projeto está em andamento em Vitória (ES), Manaus (AM), Chapecó (SC), Teresina (PI), Cuiabá (MT), Guarapuava (PR) e Benevides (PA).</p>\n<p>Os cuidadores são estimulados a refletir sobre o que é a demência e como a sobrecarga do cuidado pode impactar a sua saúde; a reconhecer os padrões de comportamento do idoso e o seu próprio comportamento para evitar gatilhos e reações negativas ou impulsivas; a fortalecer a comunicação com a pessoa com demência e com outros membros da família; a evitar a solidão; a resgatar pequenos prazeres; e a planejar o futuro. Não menos importante, há técnicas de relaxamento, com exercícios de respiração, meditação e alongamento.</p>\n<p>O autocuidado, enfim, entrou na agenda do Sistema Único de Saúde (SUS). Já não era sem tempo, haja vista que, segundo o <i>Relatório Nacional sobre a Demência: Epidemiologia, (Re)Conhecimento e Projeções Futuras</i>, divulgado pelo Ministério da Saúde em setembro do ano passado, 8,5% da população com 60 anos ou mais convive com a demência. São nada menos do que 1,8 milhão de brasileiros idosos nessa condição. Para piorar, projetam-se 5,7 milhões de pessoas com demência na terceira idade até 2050.</p>\n<p>Tais números mostram que o projeto Escada é mais do que bem-vindo. Com o avanço da expectativa de vida do brasileiro, essa é uma política pública necessária. Oxalá seu teste seja um sucesso e, em breve, essa iniciativa seja replicada por todo o SUS, em todo o país. Só assim serão garantidas saúde mental e qualidade de vida àqueles que cuidam dos seus e precisam cuidar de si mesmos.</p>\n<p class=\"src\">(Editorial, estadao.com.br/opiniao, 02.11.2025. Adaptado)</p>"},{"t":"q","n":1,"stem":"<p>De acordo com o editorial, o projeto-piloto Escada tem como finalidade</p>","o":["estabelecer um protocolo para os cuidadores de idosos, de tal forma que essas pessoas se dediquem ao próprio cuidado, evitando danos à saúde física e mental decorrentes da rotina vivenciada.","revisar os protocolos de cuidados com as pessoas idosas com demência, porque o número de idosos é alto atualmente e projetam-se 5,7 milhões de pessoas com demência na terceira idade até 2050.","oferecer às famílias que têm um idoso com demência serviços de atendimento especializado, tanto para o doente quanto aos demais familiares, evitando sobrecarga à saúde física e emocional das pessoas.","afastar os cuidadores de suas atribuições profissionais para que possam especializar-se nos cuidados aos idosos com demência, participando de oito sessões contínuas, com atendimento psicológico.","aliar as atribuições de cuidados da família com idoso com demência às dos cuidadores, para que não haja, para nenhuma das partes, sobrecarga de tarefas, evitando-se, assim, angústia, estresse e depressão."],"a":"A","e":"O Escada é um protocolo voltado ao <b>cuidador</b>: ele aprende manejo do estresse e relaxamento, evita a solidão e resgata pequenos prazeres. O texto resume: “O autocuidado, enfim, entrou na agenda do SUS”. As outras alternativas falham porque o projeto não revisa o cuidado do idoso (B), não oferece atendimento ao doente (C), não afasta o cuidador do trabalho (D) e não divide tarefas entre família e cuidadores (E)."},{"t":"q","n":2,"stem":"<p>Analisando-se os dados apresentados no texto, conclui-se corretamente que a quantidade de idosos com demência no Brasil é</p>","o":["inexpressiva, mas tende a aumentar nas próximas décadas.","alta, mas não há previsão de aumento nas próximas décadas.","baixa, e há previsão de que diminua nas próximas décadas.","alta, e há previsão de aumento nas próximas décadas.","baixa, e não há previsão de aumento nas próximas décadas."],"a":"D","e":"O texto fala em 1,8 milhão de idosos com demência (“nada menos do que”), um número <b>alto</b>. E “para piorar, projetam-se 5,7 milhões até 2050”, ou seja, a previsão é de <b>aumento</b>."},{"t":"q","n":3,"stem":"<p>Com a frase do 5º parágrafo “Já não era sem tempo…”, o editorial manifesta, em relação ao projeto-piloto Escada, seu ponto de vista</p>","o":["contrário, apresentando, em seguida, os argumentos para a sua oposição.","de dúvida, apresentado, em seguida, os seus possíveis pontos negativos.","favorável, apresentando, em seguida, a justificativa para o seu posicionamento.","favorável, apresentando, em seguida, as sugestões para a sua implementação.","contrário, apresentando, em seguida, as consequências nefastas de sua implementação."],"a":"C","e":"“Já não era sem tempo” quer dizer “finalmente, já devia ter acontecido”, ou seja, o editorial <b>aprova</b> o projeto. Logo depois, “haja vista que…” introduz a <b>justificativa</b>: os dados de prevalência de demência. Esse trecho não traz sugestões de implementação (D)."},{"t":"q","n":4,"stem":"<p>O termo destacado está empregado em sentido próprio em:</p>","o":["Só assim serão garantidas <b>saúde</b> mental e qualidade de vida àqueles que cuidam dos seu
