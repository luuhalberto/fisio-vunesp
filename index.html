s e precisam cuidar de si mesmos. (6º parágrafo)","Não raro, o <b>peso</b> dessa rotina implica angústia, estresse e depressão, com o adoecimento de toda a família. (2º parágrafo)","Esses são alguns dos <b>desafios</b> enfrentados por brasileiros que assumem a tarefa de cuidar de um familiar idoso com demência. (1º parágrafo)","<b>Batizado</b> de Estratégias para Cuidadores em Demência (Escada), o projeto-piloto é uma adaptação do protocolo britânico Start. (2º parágrafo)","Os cuidadores são estimulados a refletir sobre o que é a demência e como a sobrecarga do cuidado pode <b>impactar</b> a sua saúde… (4º parágrafo)"],"a":"A","e":"Em A, “saúde” tem o sentido literal, de estado de bem-estar. Nas demais, o sentido é figurado: “peso” é carga emocional, não física; “desafios” são as dificuldades tratadas como provas a vencer; “batizado” significa nomeado, não o sacramento; “impactar” é afetar, não colidir."},{"t":"q","n":5,"stem":"<p>Sem prejuízo ao sentido do texto, na passagem do 2º parágrafo “<b>Não raro</b>, o peso dessa rotina <b>implica</b> angústia, estresse e depressão, com o adoecimento de toda a família. Para <b>atenuar</b> esse sofrimento, o Ministério da Saúde traz a boa notícia de que está desenvolvendo um protocolo de terapia…”, as expressões podem ser substituídas, correta e respectivamente, por:</p>","o":["Intermitentemente; acaba; abrandar.","Frequentemente; acarreta; amenizar.","Eventualmente; envolve; analisar.","Ocasionalmente; reforça; dissipar.","Habitualmente; promove; eliminar."],"a":"B","e":"“Não raro” equivale a frequentemente, “implica” a acarreta (causa) e “atenuar” a amenizar (diminuir). Nas outras: “eventualmente” e “ocasionalmente” invertem a ideia de frequência, e “eliminar”/“dissipar” exageram, porque atenuar não é acabar com o sofrimento."},{"t":"q","n":6,"stem":"<p>O motivo por que se empregam as vírgulas na passagem do 3º parágrafo “O projeto está em andamento em Vitória (ES), Manaus (AM), Chapecó (SC), Teresina (PI), Cuiabá (MT), Guarapuava (PR) e Benevides (PA).” também se aplica às passagens:</p>","o":["Para atenuar esse sofrimento, o Ministério da Saúde traz a boa notícia… (2º parágrafo) / Oxalá seu teste seja um sucesso e, em breve, essa iniciativa seja replicada… (6º parágrafo)","… o peso dessa rotina implica angústia, estresse e depressão… (2º parágrafo) / Ou seja, foi testado e aprovado. (2º parágrafo)","… que replicam o protocolo junto dos cuidadores, que passam por oito sessões, com suporte psicológico… (3º parágrafo) / Para piorar, projetam-se 5,7 milhões de pessoas com demência… (5º parágrafo)","… mas há também homens, filhos e filhas ou netos e netas… (1º parágrafo) / … com exercícios de respiração, meditação e alongamento. (4º parágrafo)","O autocuidado, enfim, entrou na agenda do Sistema Único de Saúde (SUS). (5º parágrafo) / Com o avanço da expectativa de vida do brasileiro, essa é uma política pública necessária. (6º parágrafo)"],"a":"D","e":"No trecho original, as vírgulas separam os <b>elementos de uma enumeração</b> (as cidades). Em D, as duas passagens também enumeram: “homens, filhos e filhas…” e “respiração, meditação e alongamento”. Nas demais, as vírgulas isolam outra coisa: adjunto adverbial deslocado (A, C, E), expressão explicativa como “ou seja” (B) ou oração adjetiva explicativa (C). Em B, a primeira passagem é enumeração, mas a segunda não, e as duas precisam ter o mesmo motivo."},{"t":"q","n":7,"stem":"<p>Considere a frase a seguir:</p>\n<blockquote>Na sua maioria, são mulheres, mas ________ também homens, filhos e filhas ou netos e netas, que se entregam ao zelo ________ que ________ de ajuda, compreensão e afeto.</blockquote>\n<p>Em conformidade com a norma-padrão, as lacunas da frase devem ser preenchidas, respectivamente, com:</p>","o":["se flagram … para aqueles … clamam","é comum … por aqueles … anseiam","existe … àqueles … necessitam","existem … daqueles … carecem","são comuns … naqueles … reclamam"],"a":"D","e":"Três pontos resolvem a questão:\n<ul>\n<li><b>Existem homens</b>: “existir” é verbo pessoal e concorda com o sujeito plural. Por isso “existe”, no singular (C), está errado. “Haver” é que fica sempre no singular.</li>\n<li><b>Zelo daqueles</b>: quem tem zelo tem zelo <i>de</i> alguém.</li>\n<li><b>Carecem de</b> ajuda: “carecer” pede a preposição “de”, que aparece logo depois da lacuna.</li>\n</ul>\nNas outras, as regências não combinam com o “de” que vem depois: ninguém “clama de” ou “anseia de” ajuda."},{"t":"q","n":8,"stem":"<p>Considerando-se o emprego do acento indicativo da crase e a concordância nominal, em conformidade com a norma-padrão, na frase do 6º parágrafo “Só assim serão garantidas saúde mental e qualidade de vida <b>àqueles</b> que cuidam dos seus e precisam cuidar de si <b>mesmos</b>.”, as expressões destacadas podem ser substituídas, respectivamente, por:</p>","o":["à quem … próprio","à qualquer pessoa … próprios","à pessoas … próprios","à quem … próprios","às pessoas … próprias"],"a":"E","e":"“Garantidas <b>a</b>” + “as pessoas” resulta em <b>às pessoas</b>, com crase no plural. O termo que retoma o sujeito concorda com ele, então “pessoas” pede <b>próprias</b>, no feminino plural. Não há crase antes de “quem” nem de “qualquer” (A, B, D), e em “à pessoas” (C) o “a” está no singular e “pessoas” no plural."},{"t":"q","n":9,"stem":"<p>Na passagem do 1º parágrafo “… e insistir para que <b>o ente</b> querido se alimente ou tome banho.”, a expressão destacada faz uma alusão a uma pessoa da família. Outro termo que remete à ideia de família está corretamente destacado em:</p>","o":["Na <b>sua</b> maioria, são mulheres, mas há também homens… (1º parágrafo)","… e como a sobrecarga do cuidado pode impactar a <b>sua</b> saúde... (4º parágrafo)","… àqueles que cuidam dos <b>seus</b> e precisam cuidar de si mesmos. (6º parágrafo)","… <b>que</b> replicam o protocolo junto dos cuidadores… (3º parágrafo)","… <b>essa</b> é uma política pública necessária. (6º parágrafo)"],"a":"C","e":"“Cuidam <b>dos seus</b>” significa cuidam dos seus familiares, dos seus entes queridos: o possessivo virou substantivo. Em A e B, “sua” é só possessivo. Em D, “que” é pronome relativo que retoma “agentes”. Em E, “essa” retoma a política pública."},{"t":"q","n":10,"stem":"<p>De acordo com a norma-padrão, a passagem do 6º parágrafo “Tais números mostram que o projeto Escada é mais do que bem-vindo. Com o avanço da expectativa de vida do brasileiro, essa é uma política pública necessária.” admite a seguinte reescrita:</p>","o":["Tais números mostram que iniciativas como o projeto Escada são mais do que bem-vindas. Devido ao avanço da expectativa de vida do brasileiro, essa é uma política pública necessária.","Tais números mostram que iniciativas como o projeto Escada são mais do que bem-vindo. Por causa do avanço da expectativa de vida do brasileiro, essa é uma política pública necessária.","Tais números mostram que iniciativas como o projeto Escada é mais do que bem-vinda. Em virtude do avanço da expectativa de vida do brasileiro, essa é uma política pública necessária.","Tais números mostram que iniciativas como o projeto Escada é mais do que bem-vindo. Devido o avanço da expectativa de vida do brasileiro, essa é uma política pública necessária.","Tais números mostram que iniciativas como o projeto Escada são mais do que bem-vindas. Em virtude ao avanço da expectativa de vida do brasileiro, essa é uma política pública necessária."],"a":"A","e":"O sujeito passa a ser “iniciativas”, feminino plural, então o certo é “<b>são</b> … bem-<b>vindas</b>”. A locução é “devido <b>a</b>”, e com o artigo fica “devido <b>ao</b> avanço”. Por isso erram B (bem-vindo), C e D (“é” no singular), D de novo (“devido o”, sem preposição) e E (“em virtude <i>ao</i>”; o correto é “em virtude <b>do</b>”)."},{"t":"txt","x":"<p class=\"t\">Texto para as questões 11 a 15 – A Velha</p>\n<p>A velha era felicíssima. Pois não é verdade que tinha uma boa vida e nada lhe faltava? Só nessa manhã tinha encontrado um lugar vago num banco de jardim, nem demasiado à sombra nem demasiado ao sol, o elétrico¹ não vinha excessivamente cheio e também conseguiu lugar, o padeiro disse-lhe bom dia com um ar tão simpático, quando ela deixou em cima do balcão o dinheiro de três carcaças², e o empregado da mercearia ficou a conversar depois de lhe dar o troco e perguntou-lhe se gostava daquela nova marca de café.</p>\n<p>Nos meses mais quentes tirava um passe de terceira idade e passeava. No inverno não valia a pena, estava frio e vinha logo a chuva e preferia não sair, por causa do reumatismo.</p>\n<p>Mas, saindo só nos meses mais bonitos, o passe ficava ainda mais barato. Se fizesse a conta do preço a dividir por doze (ah, sabia bem fazer contas, sempre tinha sido esperta na escola) pois se fizesse a conta a dividir por doze ainda era menos que pagava pelo passe.</p>\n<p>Gostava sobretudo do elétrico da circulação, dava a volta à cidade sem ter de sair, e ainda por cima bem instalada, conseguia ficar quase sempre ao pé da janela. Ou, se não conseguisse na primeira volta, era certo que conseguia na segunda, porque, entretanto, sairia quem fosse à janela e era só empurrar-se um pouco e ocupar o lugar do outro, e então sim, via tudo como se estivesse no cinema.</p>\n<p>Ao cinema propriamente ia pouco, há vários anos até que já não ia. Não era só por ser caro, é que às vezes as cadeiras estavam gastas e faziam-lhe doer as costas, e também nunca sabia se ia gostar dos filmes. E se não gostasse não podia fazer como na televisão e mudar de canal ou desligar, tinha de aguentar até ao fim, ou sair. E era um grande desconsolo sair a meio, já lhe tinha acontecido mais do que uma vez.</p>\n<p>Por isso não ia cinema. Televisão via bastante, claro, mas dava-lhe mais gozo andar de elétrico. Em vez de ficar fechada em casa, andava no meio das pessoas e das ruas, mas sem se cansar, bem sentada. Gozando o espetáculo dos outros — olha ali aquela montra³ iluminada, aquele homem a correr, aquela mulher ajoujada⁴ com o cesto das couves. E ela ali, recostada na cadeira, sem carregar pesos, nem sequer o peso do seu próprio corpo — dava-lhe vontade de rir, tamanha facilidade.</p>\n<p class=\"src\">(Teolinda Gersão. <i>Histórias de Ver e Andar</i>, 2002. Adaptado) · ¹bonde ²pãezinhos ³vitrine ⁴sobrecarregada</p>"},{"t":"q","n":11,"stem":"<p>O texto tem a intenção de</p>","o":["enfatizar a vida de luxo e de ostentação da Velha, que é pouco afeita à vida social e tem uma relação interpessoal marcada pela frieza e pelo distanciamento.","retratar fatos exóticos da rotina da Velha, os quais contradizem, de forma inequívoca, a ideia de que ela fosse uma pessoa dotada de extrema felicidade da vida.","apresentar algumas facetas da vida da Velha, deixando evidente que a sua felicidade não está associada, necessariamente, a questões de ordem financeira.","mostrar as lembranças que supostamente trazem a sensação de felicidade à Velha, pelo fato de ter vivido outrora dias de grande prestígio social e econômico.","desvelar o cotidiano enfadonho vivido pela Velha que, cansada dos passeios no bonde, decide transformar sua vida e buscar a verdadeira felicidade."],"a":"C","e":"A velha tem uma vida simples: faz contas para economizar no passe da terceira idade e deixou de ir ao cinema por ser caro. Mesmo assim, é “felicíssima” com pequenos prazeres, como um banco ao sol, o bom-dia do padeiro e a janela do bonde. A felicidade dela não depende de dinheiro."},{"t":"q","n":12,"stem":"<p>O texto deixa claro que a Velha</p>","o":["era fã de televisão e só trocava essa diversão pelo cinema, que frequentava mesmo que as cadeiras gastas fizessem suas costas doerem.","gostava de andar de bonde, preferindo sentar-se à janela, onde se via livre de pesos e assistia a tudo o que se passava na rua.","tinha vontade de rir quando estava no bonde, pois via a correria das pessoas pelas ruas e julgava que elas desprezavam esse transporte.","tinha grande satisfação de andar de bonde pela cidade, mas só entrava em um quando havia um lugar livre à janela para se acomodar.","ia raramente ao cinema, porque tinha medo de assistir a um filme de que não gostasse, o que até então nunca lhe havia ocorrido."],"a":"B","e":"A resposta está no texto: “conseguia ficar quase sempre ao pé da janela… via tudo como se estivesse no cinema” e “sem carregar pesos, nem sequer o peso do seu próprio corpo”. As outras falham porque ela não ia mais ao cinema (A), ria da própria facilidade e não das pessoas (C), esperava a segunda volta para conseguir a janela (D) e já tinha saído no meio de filmes (E)."},{"t":"q","n":13,"stem":"<p>Considere as passagens:</p>\n<blockquote>• Só nessa manhã <b>tinha encontrado</b> um lugar vago num banco de jardim… (1º parágrafo)<br>• Mas, saindo só nos meses mais bonitos, o passe ficava <b>ainda</b> mais barato. (3º parágrafo)<br>• Gostava <b>sobretudo</b> do elétrico da circulação, dava a volta <b>à</b> cidade sem ter de sair… (4º parágrafo)<br>• Não era só <b>por ser</b> caro, é que às vezes as cadeiras estavam gastas… (5º parágrafo)</blockquote>\n<p>Sem prejuízo de sentido ao texto, as expressões destacadas podem ser substituídas, correta e respectivamente, por:</p>","o":["encontraria; então; eventualmente; na; como fosse.","encontrou; também; principalmente; sobre; mas que fosse.","encontrou; inclusive; certamente; na; para que era.","encontrara; certamente; absolutamente; pela; apesar de ser.","encontrara; até; especialmente; pela; porque era."],"a":"E","e":"As cinco trocas:\n<ul>\n<li>“tinha encontrado” = <b>encontrara</b> (pretérito mais-que-perfeito, composto e simples).</li>\n<li>“ainda” mais barato = <b>até</b> mais barato (intensificação).</li>\n<li>“sobretudo” = <b>especialmente</b>.</li>\n<li>“dar a volta à cidade” = dar a volta <b>pela</b> cidade.</li>\n<li>“por ser caro” = <b>porque era</b> caro (causa).</li>\n</ul>"},{"t":"q","n":14,"stem":"<p>Na passagem do 4º parágrafo “<b>Ou</b>, <b>se</b> não conseguisse na primeira volta, era certo que conseguia na segunda, <b>porque</b>, entretanto, sairia quem fosse à janela <b>e</b> era só empurrar-se um pouco…”, as expressões destacadas estabelecem, correta e respectivamente, relações de sentido de</p>","o":["adição, conformidade, explicação e adição.","condição, condição, explicação e oposição.","condição, oposição, consequência e oposição.","alternância, condição, causa e adição.","alternância, finalidade, causa e adição."],"a":"D","e":"<b>Ou</b> indica alternância (uma possibilidade ou outra); <b>se</b> indica condição (“caso não conseguisse”); <b>porque</b> indica causa (por que conseguiria na segunda volta); <b>e</b> indica adição."},{"t":"q","n":15,"stem":"<p>A colocação pronominal está de acordo com a norma-padrão em:</p>","o":["Quando um lugar no bonde ficava vago, a Velha pegava-o e, bem sentada, recostava-se na cadeira e ia gozando o espetáculo dos outros.","Se sentia bem a Velha com a volta à cidade sem ter de sair, e ainda por cima, sentava-se quase sempre ao pé da janela.","A Velha ficou contente com o padeiro que disse-lhe bom dia com um ar tão simpático, quando ela pagou-lhe os pãezinhos.","O cinema não era como a televisão, que dava prazer à Velha, mas o bonde dava-lhe ainda mais e ela jamais abandonava-o.","Quando assistia um filme que não agradava-lhe, a Velha ficava incomodada, era um desconsolo pensar que deixaria-o no meio."],"a":"A","e":"Em “pegava-o” e “recostava-se”, nenhuma palavra atrai o pronome, então a ênclise está correta. Os erros das outras:\n<ul>\n<li>B: não se começa frase com pronome oblíquo (“Sentia-se bem…”).</li>\n<li>C: “que” e “quando” atraem o pronome: “que <b>lhe</b> disse”, “quando ela <b>lhe</b> pagou”.</li>\n<li>D: “jamais” atrai: “jamais <b>o</b> abandonava”.</li>\n<li>E: “que não <b>lhe</b> agradava”; o futuro do pretérito não aceita ênclise (“o deixaria” ou “deixá-lo-ia”).</li>\n</ul>"},{"t":"h","x":"Política de Saúde"},{"t":"q","n":16,"stem":"<p>De acordo com o Decreto nº 7.508/2011, é correto afirmar que os serviços especiais de acesso aberto são serviços</p>","o":["de saúde específicos para o atendimento da pessoa que, em razão de agravo ou de situação laboral, necessita de atendimento especial.","de retaguarda na rede de atenção psicossocial para os casos especialmente mais graves.","de assistência social de acesso aberto à população mais carente.","previstos para o atendimento de crianças com doenças neurológicas que necessitam de atendimento especializado.","de referência para todas as condições congênitas especiais de pessoas até os 18 anos de idade."],"a":"A","e":"É a definição literal do art. 2º, VI, do Decreto 7.508/2011. Vale decorar junto: as Portas de Entrada da Rede são atenção primária, urgência e emergência, atenção psicossocial e serviços especiais de acesso aberto (art. 9º)."},{"t":"q","n":17,"stem":"<p>Durante o planejamento de um grande evento, a Prefeitura incluiu no contrato com a empresa que fará a montagem do palco e da arquibancada cláusulas de proteção à saúde dos trabalhadores, entre elas a apresentação de uma análise ergonômica do trabalho (AET), conforme a NR-17, e um plano de trabalho com cronograma adequado e organização da jornada de trabalho. A AET recomendou jornada diária de 9 horas, intervalo de 60 minutos para almoço e duas pausas de 10 minutos, além de outras orientações. O contrato também previa a comunicação imediata dos acidentes ao serviço municipal de vigilância em saúde, para acompanhamento e notificação compulsória pelo SUS, quando aplicável. Ao longo dos dez dias de montagem, participaram cinquenta trabalhadores e ocorreram cinco acidentes: Luiz, Antônio e Jaime sofreram cortes superficiais durante a execução das atividades; Leo sofreu fratura ao retornar para casa, após o expediente, em uma colisão de ônibus; e Lino apresentou entorse no polegar ao carregar peça pesada, necessitando de afastamento por cinco dias.</p>\n<p>Considerando o exposto, assinale a alternativa correta.</p>","o":["Trata-se de um plano útil para a previsão de custos, e todos os casos, com exceção de Leo, devem ser notificados no SINAN.","Trata-se de um plano de trabalho com vistas à prevenção de acidentes do trabalho, e todos os casos devem ser notificados como acidentes de trabalho no SINAN.","Trata-se de um plano de trabalho com regras organizacionais demasiadamente intervencionistas, e somente o caso de Leo deve ser notificado no SINAN por ser grave.","A única questão referente à vigilância em saúde é a notificação de acidentes do trabalho no SINAN, de forma que todos devem ser notificados.","Por serem esporádicas, as situações de preparação de eventos não exigiriam um plano de vigilância em saúde, mas todos os acidentes devem ser notificados no SINAN."],"a":"B","e":"A AET da NR-17, as pausas e a organização da jornada são medidas de <b>prevenção</b> de acidentes e adoecimento, ou seja, ações de vigilância em saúde do trabalhador. Os cortes e a entorse aconteceram durante o trabalho. A fratura de Leo é <b>acidente de trajeto</b> (no caminho casa–trabalho), que a legislação equipara a acidente de trabalho. Por isso todos os casos entram como acidente de trabalho."},{"t":"q","n":18,"stem":"<p>Assinale a alternativa que correta com relação à forma de participação da comunidade na gestão do SUS, em âmbito estadual, segundo a Lei nº 8.142/90.</p>","o":["A representação dos trabalhadores da saúde no Conselho e Conferência Estadual de Saúde equipara-se à da comunidade na gestão do SUS.","A representação da comunidade se dá por meio da participação dos usuários no Conselho e Conferência Estadual de Saúde, sendo garantida e obrigatória a presença do segmento indígena.","A representação dos usuários no Conselho e Conferência Estadual de Saúde se dá de forma paritária em relação ao conjunto dos demais segmentos.","O único segmento social com participação garantida por meio de representação no Conselho e Conferência Estadual de Saúde é o dos sindicatos.","A representação dos usuários e prestadores de serviços no Conselho e Conferência Estadual de Saúde é considerada uma forma de participação da comunidade na gestão."],"a":"C","e":"Lei 8.142/90, art. 1º, §4º: “A representação dos usuários nos Conselhos de Saúde e Conferências será <b>paritária</b> em relação ao conjunto dos demais segmentos”. Na prática, os usuários têm 50% das vagas e trabalhadores, gestores e prestadores dividem os outros 50%."},{"t":"q","n":19,"stem":"<p>Uma mulher de 62 anos de idade, usuária do SUS, sofre um acidente vascular cerebral (AVC) e é internada em um hospital, do qual recebe alta com uma leve sequela motora, necessitando de um programa de fisioterapia e reabilitação. Nesse caso, é correto afirmar que</p>","o":["a APS só poderá acompanhá-la no que tange ao estado geral, sendo que a fisioterapia e a reabilitação são de responsabilidade das especialistas.","ela necessitará de um encaminhamento a uma unidade especializada de reabilitação.","a Atenção Primária da Saúde (APS) só poderá prestar cuidados de fisioterapia e reabilitação se houver uma equipe especializada.","o hospital no qual a usuária ficou internada é responsável pela execução do programa de fisioterapia e reabilitação.","é previsto que ações de tratamento e reabilitação sejam desenvolvidas na APS."],"a":"E","e":"Pela PNAB, a Atenção Primária faz promoção, prevenção, diagnóstico, <b>tratamento e reabilitação</b>. Com sequela leve, ela pode ser acompanhada na APS, inclusive pelo fisioterapeuta da equipe multiprofissional (eMulti). As alternativas restritivas (“só poderá”, “necessitará de encaminhamento”) estão erradas."},{"t":"q","n":20,"stem":"<p>Nos últimos anos, observa-se um crescimento expressivo da população em situação de rua nas grandes cidades brasileiras, o que tem ampliado a demanda por ações de atenção integral e estratégias específicas de cuidado no âmbito da Atenção Primária à Saúde. Entre essas estratégias, destaca-se a atuação das equipes dos Consultórios na Rua, responsáveis por desenvolver ações itinerantes e articular o cuidado intersetorialmente. Nesse sentido, é correto afirmar:</p>","o":["as equipes dos Consultórios de Rua deverão realizar suas atividades de forma itinerante, desenvolvendo ações na rua, em instalações específicas ou na unidade móvel, mas não nas instalações das Unidades Básicas de Saúde do território onde estão atuando.","os Consultórios de Rua são equipes da atenção básica compostas por profissionais de saúde com responsabilidade exclusiva de articular e prestar atenção integral à saúde das pessoas em situação de rua.","para cálculo do teto das equipes dos Consultórios na Rua de cada município, serão tomados como base os dados dos censos populacionais relacionados à população em situação de rua, coletados por empresas contratadas pelo gestor municipal.","as equipes dos Consultórios na Rua devem se locomover a pé ou de transporte coletivo para os sítios de atenção da população sem domicílio, de modo a proporcionar o cuidado in loco.","as equipes dos Consultórios na Rua devem cumprir a carga horária mínima semanal de 20 horas e seu horário de funcionamento é das 7h às 19h, devendo a população de rua se adequar a esse período."],"a":"B","e":"É a definição da Portaria 122/2011, retomada pela PNAB: as eCR são equipes da atenção básica com responsabilidade <b>exclusiva</b> pela população em situação de rua. Os erros das outras:\n<ul>\n<li>A: as equipes podem usar as instalações das UBS.</li>\n<li>C: o teto é calculado com dados oficiais (censos e levantamentos públicos), não de empresas contratadas.</li>\n<li>D: as equipes podem ter veículo próprio.</li>\n<li>E: o horário se adapta às necessidades da população, inclusive à noite e nos fins de semana.</li>\n</ul>"},{"t":"q","n":21,"stem":"<p>Um estudo analisou as estimativas da Carga Global de Doenças ou <i>Global Burden of Disease</i> (GBD), para prevalência, incidência, mortalidade, anos de vida ajustados por incapacidade (DALY), uma medida resumida de anos de vida perdidos (YLL) e anos vividos com deficiência (YLD), e fatores de risco atribuíveis a doenças respiratórias crônicas, no Brasil, de 1990 a 2017. As estimativas gerais diminuíram para todas as idades e ambos os sexos, assim como para as taxas padronizadas por idade. Houve uma redução de 42% na mortalidade para ambos os sexos, embora a taxa de mortes para homens tenha sido 30% maior do que a taxa para mulheres. O aumento no número de DALY deveu-se ao crescimento e envelhecimento da população. Observamos um aumento de 34% no número absoluto de DALY, no Brasil, durante o período do estudo. A maioria das taxas de DALY foi devido à Doença Pulmonar Obstrutiva Crônica (DPOC). Para todas as idades e ambos os sexos, o tabagismo foi o principal fator de risco atribuível.</p>\n<p>Com base nos dados apresentados, é correto afirmar que o estudo</p>","o":["comprova que o uso do tabaco vem se disseminando mais nos últimos anos no Brasil.","entende que a prevalência de DPOC em todas as idades sofreu um aumento no período do estudo.","aponta para a necessidade de manter e aprimorar políticas e programas direcionados à cessação do tabagismo.","sugere que devem ser traçadas estratégias de combate ao tabagismo diferentes para homens e mulheres.","entende que a incidência de DPOC sofreu um aumento no período do estudo."],"a":"C","e":"As taxas caíram, mas o número absoluto de DALY subiu com o envelhecimento da população, e o <b>tabagismo</b> continua sendo o principal fator de risco. A conclusão possível é manter e aprimorar as políticas antitabagismo. O estudo não mostra mais consumo de tabaco (A). Prevalência e incidência diminuíram, então B e E estão erradas. E não há proposta de estratégias diferentes por sexo (D)."},{"t":"q","n":22,"stem":"<p>Assinale a alternativa que aponta algumas características da Reforma Sanitária Brasileira (RSB).</p>","o":["A maioria dos estudiosos da RSB considera o projeto implantado em sua plenitude a partir da criação do SUS.","Dos segmentos sociais envolvidos, o movimento sindical era destacadamente o mais ativo no processo da RBS.","A RSB culminou na inclusão do SUS na Constituição Federal em um período de grande ascensão das políticas sociais pelo mundo todo.","A oitava Conferência Nacional de Saúde foi convocada pelo Senado, pois, naquela época, não havia instância de participação social deliberativa.","Alguns dos artífices mais importantes da RSB ocuparam posições centrais nas instituições acadêmicas de saúde coletiva e cargos-chave na área das políticas de saúde."],"a":"E","e":"Sanitaristas como Sergio Arouca atuaram na academia (Fiocruz, Cebes, Abrasco) e em cargos de gestão: Arouca presidiu a 8ª CNS. Os erros das outras:\n<ul>\n<li>A: os estudiosos consideram a reforma <b>inconclusa</b>.</li>\n<li>B: o protagonista foi o movimento sanitário (intelectuais, profissionais e movimentos populares), não o sindical.</li>\n<li>C: no fim dos anos 1980, o mundo vivia a onda neoliberal, de retração das políticas sociais.</li>\n<li>D: a 8ª CNS (1986) foi convocada pelo Ministério da Saúde, isto é, pelo Executivo.</li>\n</ul>"},{"t":"q","n":23,"stem":"<p>Assinale a alternativa que contém uma das características do sistema de saúde com base em Redes de Atenção à Saúde (RAS).</p>","o":["A ênfase de atuação é nas intervenções curativas e reabilitacionais.","Prescrições médicas rigorosamente seguidas são parte importante do processo de formação popular.","Existe uma hierarquia forte que deve ser respeitada rigorosamente.","A coordenação do cuidado é da Atenção Primária da Saúde.","O cuidado é centrado nos profissionais de saúde, em especial nos médicos."],"a":"D","e":"Nas RAS (Eugênio Vilaça Mendes; Portaria 4.279/2010), a APS é o centro de comunicação e a <b>coordenadora do cuidado</b>. As redes são <b>poliárquicas</b>, sem hierarquia rígida, cuidam de todo o ciclo (da promoção aos cuidados paliativos) e são centradas na pessoa, não no médico. As alternativas A, B, C e E descrevem o sistema fragmentado, que as RAS querem superar."},{"t":"q","n":24,"stem":"<p>A Política Nacional de Humanização (HumanizaSUS) propõe mudanças nas práticas de cuidado e gestão no SUS, com foco no acolhimento, no vínculo, na autonomia dos sujeitos e na qualificação das relações entre usuários, trabalhadores e gestores. Considerando seus princípios e diretrizes, assinale a alternativa que expressa uma característica dessa política.</p>","o":["Ampliação da corresponsabilização entre usuários, trabalhadores e gestores na produção de saúde e no cuidado.","Estímulo ao voluntariado como estratégia prioritária de apoio às práticas de saúde.","Ênfase na identificação de doenças prevalentes como eixo estruturante das ações de cuidado.","Manutenção de modelos assistenciais centrados no perfil epidemiológico de morbidade da população.","Organização do cuidado priorizando o protagonismo dos profissionais de saúde, especialmente médicos."],"a":"A","e":"Os princípios da PNH são transversalidade, indissociabilidade entre atenção e gestão, e <b>protagonismo, corresponsabilidade e autonomia</b> dos sujeitos. As diretrizes incluem acolhimento, gestão participativa (cogestão), clínica ampliada, ambiência, valorização do trabalhador e defesa dos direitos do usuário."},{"t":"q","n":25,"stem":"<p>Os agentes comunitários de saúde e os agentes de combate às endemias são profissionais fundamentais no SUS. Com relação a esses profissionais, é correto afirmar:</p>","o":["o vencimento dos agentes comunitários de saúde e dos agentes de combate às endemias fica sob responsabilidade dos municípios.","a União deve arcar com vantagens aos agentes comunitários de saúde e aos agentes de combate às endemias, entre elas, incentivos, auxílios, gratificações e indenizações, a fim de valorizar o trabalho desses profissionais.","em razão dos riscos inerentes às funções desempenhadas, agentes comunitários de saúde e agentes de combate às endemias terão aposentadoria especial e, somado aos seus vencimentos, adicional de insalubridade.","o vencimento dos agentes comunitários de saúde e dos agentes de combate às endemias não será inferior a 4 (quatro) salários mínimos, pago pelos municípios.","os agentes comunitários de saúde e os agentes de combate às endemias poderão ser contratados pelos municípios sem processo seletivo público."],"a":"C","e":"A resposta está na Constituição, art. 198, §10, incluído pela EC 120/2022: aposentadoria especial e adicional de insalubridade. Pelo §9º, o vencimento não pode ser inferior a <b>2</b> salários mínimos e é pago com recursos da <b>União</b>, o que derruba A e D. Os outros entes podem conceder vantagens, mas a União não é obrigada a arcar com elas (B). A contratação exige <b>processo seletivo público</b> (§4º), o que derruba E."},{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":26,"stem":"<p>A eficácia das compressas frias baseia-se na sua habilidade de diminuir a temperatura do tecido com segurança até os níveis terapêuticos. O fluxo sanguíneo superficial começa a diminuir dentro do primeiro minuto de tratamento. O resfriamento subsequente diminui o metabolismo celular e a velocidade de condução nervosa. A analgesia máxima é obtida quando a temperatura da pele alcança</p>","o":["13 ºC.","14,4 ºC.","13,4 ºC.","14 ºC.","15 ºC."],"a":"B","e":"É o valor clássico dos livros de recursos terapêuticos (como Starkey): a <b>analgesia máxima</b> acontece quando a pele chega a cerca de <b>14,4 °C</b>, porque o frio reduz a velocidade de condução nas fibras nervosas e o metabolismo. É uma questão de memorização."},{"t":"q","n":27,"stem":"<p>Mariana, que, nos últimos 15 dias, esteve em área de transmissão de dengue, apresenta quadro febril há 7 dias, que está associado a cefaleia, dor retroorbitrária, artralgia e prostração. Com esse quadro, ela deverá ser assistida na seguinte unidade de atenção:</p>","o":["secundária em saúde sem suporte para observação.","terciária em saúde com leitos de cuidados intensivos.","primária em saúde.","secundária em saúde com suporte para observação.","terciária em saúde com leitos de internação."],"a":"D","e":"Febre de até 7 dias com dois ou mais sintomas (cefaleia, dor retro-orbitária, artralgia, prostração), em quem esteve em área de transmissão, é caso suspeito de dengue. A banca entendeu que o quadro, com prostração, pede <b>leito de observação</b> enquanto saem os exames, como no Grupo B do manejo do Ministério da Saúde: unidade com suporte para observação, como a UPA, de nível secundário. Pelo manual, só o Grupo A (sem sinais de alarme nem condições especiais) fica na APS, e os Grupos C e D vão para internação ou UTI.<span class=\"warn\">Dica: decore os 4 grupos (A, B, C, D) e onde cada um é atendido.</span>"},{"t":"q","n":28,"stem":"<p>Maria Eduarda, 13 anos, com diagnóstico de paralisia cerebral espástica diparética nível 4, de acordo com o GMFCS, está inserida no programa de saúde da família (PSF). Esse programa é um dos modelos alternativos de atenção à saúde das pessoas com deficiência. Em relação à característica do PSF, assinale a alternativa correta.</p>","o":["Cada cidadão deve se envolver pessoalmente para conseguir mais saúde para si mesmo e também para a coletividade.","Incorporar ao processo de trabalho a atenção à saúde, à vigilância, à abordagem dos grupos com maiores riscos de adoecimento, e atuar no território com visitas à produção da saúde.","Para que se consiga saúde, não apenas o sistema de saúde deve funcionar bem, mas é necessário que o conjunto das políticas públicas sejam saudáveis ou promovam a saúde.","O conjunto de situações necessárias a uma vida boa não pode ser conseguido isoladamente por um único setor; a saúde no caso em questão.","Melhorar a eficiência e a eficácia dos sistemas de saúde, e, simultaneamente, promover uma maior equidade de acesso aos serviços."],"a":"B","e":"O que caracteriza o PSF/ESF é o processo de trabalho no <b>território</b>: atenção, vigilância em saúde, foco nos grupos de maior risco e visitas domiciliares. As alternativas A, C e D descrevem princípios gerais de promoção da saúde (participação, políticas públicas saudáveis, intersetorialidade), e E descreve metas de reforma de sistemas de saúde."},{"t":"q","n":29,"stem":"<p>Criança 8 anos de idade, após avaliação fisioterapêutica, foi identificada contratura dos músculos reto femoral e dos flexores do quadril. Quais testes, respectivamente, o fisioterapeuta realizou para identificar essas contraturas?</p>","o":["Ely e Ober.","Trendelenburg e Ober.","Patrick e Ober.","Thomas e Patrick.","Ely e Thomas."],"a":"E","e":"<ul>\n<li><b>Ely (reto femoral)</b>: paciente em decúbito ventral; o fisioterapeuta flexiona o joelho. Se o quadril se eleva (o bumbum sobe), o reto femoral está encurtado.</li>\n<li><b>Thomas (flexores do quadril, iliopsoas)</b>: paciente em decúbito dorsal, abraçando um joelho junto ao peito. Se a outra coxa sai da maca, os flexores do quadril estão encurtados.</li>\n</ul>\nOs outros testes: Ober avalia o trato iliotibial, Patrick (FABERE) o quadril e a sacroilíaca, e Trendelenburg a fraqueza do glúteo médio."},{"t":"q","n":30,"stem":"<p>Bebê nascido a termo, atualmente com 5 meses de idade, apresenta refluxo gastroesofágico. Entre outros sinais e sintomas, ele mostra-se irritado, dorme mal, durante ou logo após as mamadas fica irrequieto, apresenta desconforto recurvando a coluna, posteriormente. Além de técnicas especiais de manuseio, o fisioterapeuta pode ensinar aos pais a posicionar o bebê para que este arrote aproveitando melhor a ação da gravidade. O bebê deve ser posicionado com os quadris</p>","o":["em flexão e o tronco ereto e levemente inclinado anteriormente.","em flexão e o tronco ereto.","em posição neutra e o tronco ereto.","em qualquer posição e o tronco ereto e ligeiramente inclinado anteriormente.","em posição neutra e o tronco ereto e levemente inclinado anteriormente."],"a":"A","e":"Com os <b>quadris fletidos</b>, a pressão no abdome diminui e o bebê não se joga em hiperextensão (o “recurvar” da coluna, que piora o refluxo). Com o <b>tronco ereto e levemente inclinado à frente</b>, a gravidade ajuda o ar a subir e o leite a ficar no estômago."},{"t":"q","n":31,"stem":"<p>No pós-operatório de prolapso genital, muitas pacientes podem referir dor importante. Por isso, o emprego de recursos fisioterapêuticos analgésicos pode ser uma medida paliativa, visando reduzir a dor. Dessa forma para permitir uma analgesia rápida e mais efetiva, pode-se empregar a estimulação elétrica nervosa transcutânea (TENS) na modalidade convencional, com os seguintes parâmetros de frequência:</p>","o":["baixa, alta largura de pulso e intensidade forte.","média, baixa largura de pulso e intensidade fraca.","alta, baixa largura de pulso e intensidade forte.","baixa, média largura de pulso e intensidade fraca.","média, média largura de pulso e intensidade forte."],"a":"C","e":"A <b>TENS convencional</b> usa <b>alta frequência</b> (cerca de 50 a 150 Hz), <b>pulso curto</b> (cerca de 50 a 100 µs) e intensidade forte porém confortável, no nível sensorial e sem contração. A analgesia é rápida e se explica pela teoria das comportas. Não confunda com a TENS acupuntura (A), de baixa frequência e pulso largo, que tem efeito mais lento, mediado por opioides endógenos."},{"t":"q","n":32,"stem":"<p>Lívia, diagnosticada com hanseníase há 5 anos, atualmente apresenta fraqueza muscular generalizada e importante nos membros inferiores e dedos dos pés em garra. Os membros superiores apresentam comprometimento leve. Os exercícios indicados para os membros inferiores, nesse caso, são:</p>","o":["ativos assistidos.","ativos livres.","passivos.","resistidos concêntricos.","alongamentos com a técnica mantém-relaxa."],"a":"A","e":"Com fraqueza <b>importante</b> (força baixa, mas ainda com contração), os indicados são os <b>ativo-assistidos</b>: a paciente participa e o fisioterapeuta completa o movimento, sem gerar fadiga. Passivos servem para quem não contrai. Ativos livres e resistidos exigem mais força, e o comprometimento leve dos MMSS é que permitiria exercícios mais fortes."},{"t":"q","n":33,"stem":"<p>Em indivíduos com osteoartrose do joelho, alguns tipos de recursos terapêuticos podem afetar as propriedades viscoelásticas do colágeno e aumentar o estiramento plástico dos ligamentos, conferindo melhorias modestas na dor e na função. Que recurso poderá trazer esse benefício?</p>","o":["Estimulação elétrica neuromuscular.","Ultrassom.","Frio.","Laser.","Estimulação elétrica nervosa transcutânea."],"a":"B","e":"O <b>ultrassom contínuo</b> tem efeito térmico profundo. Ele aquece tecidos ricos em colágeno, como ligamentos, cápsula e tendões, e assim aumenta a extensibilidade e o estiramento plástico, principalmente quando associado ao alongamento. O frio faz o oposto, deixa o colágeno mais rígido. TENS, NMES e laser não têm esse efeito térmico."},{"t":"q","n":34,"stem":"<p>Ludmila, 45 anos, há 1 ano construiu um jardim em seu quintal. Desde então, passou a cuidar diariamente do jardim. Há 2 meses, devido as chuvas e ventos fortes, ervas daninhas começaram a crescer no jardim, levando Ludmila a arrancar todos os dias tais ervas. Esse movimento repetitivo exige extensão do punho, causando dor na região do epicôndilo lateral. Que músculo apresenta maior possibilidade de ser afetado com esse movimento repetitivo?</p>","o":["Extensor profundo e superficial dos dedos.","Flexor radial do carpo.","Flexor ulnar do carpo.","Extensor radial curto do carpo.","Extensor radial longo do carpo."],"a":"D","e":"Dor no epicôndilo lateral com extensão repetitiva do punho é <b>epicondilite lateral</b> (“cotovelo de tenista”). O músculo mais acometido é o <b>extensor radial curto do carpo</b>, que nasce no tendão extensor comum do epicôndilo lateral. Flexores (B, C) têm relação com o epicôndilo medial."},{"t":"q","n":35,"stem":"<p>Mario, 4 anos, com paralisia cerebral apresenta hipertonia elástica, hiperreflexia, clônus bilateral no tríceps sural e sinal de Babinski; sinais esses diretamente associados à dificuldade de execução do movimento. A possível área de lesão dessa criança, e o tipo de paralisia cerebral de acordo com o tônus muscular, são, respectivamente:</p>","o":["cerebelo e espástico.","núcleos da base e discinético.","núcleos da base e espástica.","córtex motor primário e atáxica.","córtex motor primário e espástica."],"a":"E","e":"Hipertonia elástica (espasticidade, que depende da velocidade), hiper-reflexia, clônus e Babinski são sinais de <b>neurônio motor superior</b>, isto é, de lesão do <b>córtex motor e da via piramidal</b>. Isso caracteriza a PC <b>espástica</b>. Para associar: núcleos da base levam à PC discinética (coreoatetose, distonia) e cerebelo à PC atáxica."},{"t":"q","n":36,"stem":"<p>Paciente, 57 anos do sexo masculino, com diagnóstico de <i>diabetes melittus</i> (DM) há 10 anos, evoluiu com quadro de polineuropatia diabética. Está em acompanhamento em um centro multidisciplinar especializado em DM. A equipe da clínica traçou um plano terapêutico baseado na classificação internacional de funcionalidade e incapacidade em saúde. O trabalho dessa equipe, que é composta por médico, fisioterapeuta e nutricionista, permitirá</p>","o":["a elaboração de um esquema de sinais, sintomas e efeitos colaterais de forma a ser aplicado nos sistemas de informação da saúde.","considerar os sinais e sintomas do paciente sobre a sua funcionalidade que independem de fatores contextuais ambientais e individuais.","apresentar uma base científica para a compreensão do estado de saúde, mas não permite relacionar os resultados com os seus determinantes de saúde.","comparar dados entre países, entre as diferentes áreas de saúde, e entre os diferentes serviços.","uma linguagem comum para descrever a saúde e os estados a ela relacionados, com o objetivo de melhoria da comunicação entre os usuários."],"a":"D","e":"Um dos objetivos oficiais da CIF é “permitir a <b>comparação de dados entre países</b>, entre disciplinas relacionadas com os cuidados de saúde, entre serviços e em diferentes momentos”. Os erros das outras:\n<ul>\n<li>A: a CIF descreve funcionalidade, não sinais e efeitos colaterais.</li>\n<li>B: a CIF considera os fatores contextuais (ambientais e pessoais).</li>\n<li>C: a CIF permite, sim, relacionar resultados com determinantes.</li>\n</ul>\n<span class=\"warn\">Atenção: a E lembra outro objetivo oficial (linguagem comum para melhorar a comunicação entre diferentes usuários: profissionais, pesquisadores, gestores e o público). Mesmo assim, a banca manteve D.</span>"},{"t":"q","n":37,"stem":"<p>Maria, 45 anos, com diagnóstico de esquizofrenia há 10 anos. Foi encaminhada ao centro de reabilitação, pois há 1 mês apresentou um quadro álgico na região lombar. Após avaliação, verificou-se que a causa do quadro álgico era mecânica. Nesse caso, para a efetividade do tratamento, os profissionais envolvidos nos cuidados de Maria deverão utilizar o seguinte dispositivo fundamental das práticas da saúde mental:</p>","o":["atividade manual.","exercício de conscientização corporal.","acolhimento.","estabelecimento de rotinas.","exercício de relaxamento."],"a":"C","e":"O <b>acolhimento</b> (escuta qualificada, vínculo, responsabilização) é o dispositivo central das práticas de saúde mental e da PNH, e garante a adesão e a efetividade de qualquer tratamento, inclusive o da dor lombar. As outras alternativas são técnicas terapêuticas, não dispositivos de cuidado."},{"t":"q","n":38,"stem":"<p>António, 23 anos, corredor amador de provas de rua, teve uma entorse de tornozelo com ruptura parcial do ligamento medial do tornozelo. Após avaliação pelo ortopedista, este optou por tratamento conservador, devido ao grau de ruptura que foi de 25%. Nesse caso, a cicatrização dos ligamentos ocorrerá por formação de tecido</p>","o":["cartilaginoso, com formação cicatricial diminuída, e existindo algum grau de instabilidade articular.","cartilaginoso, com formação cicatricial aumentada, e existindo algum grau de instabilidade articular.","fibroso, aumentando em todos os sentidos o ligamento e sem instabilidade articular.","conjuntivo, com formação cicatricial diminuída, e sem instabilidade articular.","fibroso, aumentando em todos os sentidos o ligamento e existindo certo grau de instabilidade articular."],"a":"E","e":"Ligamento cicatriza com <b>tecido fibroso</b> (cicatricial), nunca com cartilagem. Essa cicatriz deixa o ligamento mais volumoso “em todos os sentidos”, mas com colágeno menos organizado, mais frouxo e menos resistente que o original. Por isso costuma restar <b>algum grau de instabilidade</b>, o que justifica o treino proprioceptivo."},{"t":"q","n":39,"stem":"<p>Luiza, após tratamento conservador por ruptura de 25% da fibras do tríceps sural à direita, foi encaminhada à fisioterapia. Após a avaliação, o fisioterapeuta optou por usar a técnica de inibição recíproca para alongar a musculatura extensora do membro inferior direito, como uma das possibilidades para ganho de elasticidade. Essa técnica refere-se à</p>","o":["inibição da musculatura flexora do membro inferior direito.","excitação da musculatura extensora do membro inferior direito.","inibição da musculatura sinergista do membro inferior.","excitação da musculatura sinergista do membro inferior.","inibição da musculatura extensora do membro inferior direito."],"a":"E","e":"Na <b>inibição recíproca</b>, o paciente contrai ativamente o antagonista (os dorsiflexores, como o tibial anterior). Isso inibe por reflexo o músculo que se quer alongar, o tríceps sural, que faz parte da musculatura <b>extensora</b> (flexores plantares) do membro inferior. Ou seja, o que acontece é a <b>inibição dos extensores</b>."},{"t":"txt","x":"<p class=\"t\">Caso clínico para as questões 40 e 41</p>\n<p>Antonieta, 68 anos, realizou cirurgia bariátrica há 3 anos, é hipertensa e diabética. Na manhã de domingo, acordou e apresentou dificuldade em movimentar o hemicorpo esquerdo, o que a impediu de se levantar da cama. Seu filho, assim que percebeu a situação, levou-a ao hospital mais próximo, onde foi diagnosticada após 4 horas com acidente vascular cerebral isquêmico. Após 2 semanas de internação, recebeu alta e foi encaminhada ao centro de reabilitação para iniciar a reabilitação.</p>"},{"t":"q","n":40,"stem":"<p>Antonieta, ao receber alta hospital, apresenta dor no ombro esquerdo, hipotonia principalmente na musculatura da região proximal do ombro. Assim foi orientada a posicionar o membro superior esquerdo para evitar a subluxação de ombro e diminuir a dor. O fisioterapeuta orientou o seguinte posicionamento:</p>","o":["abdução de escápula, 30 graus de abdução de ombro, leve flexão de cotovelo, punho e mão em posição de função com semiextensão de punho, semiflexão de dedos e abdução de polegar.","adução de escápula, 30 graus de abdução de ombro, leve flexão de cotovelo, punho e mão em posição de função com semiextensão de punho, semiflexão de dedos e abdução de polegar.","abdução de escápula, 60 graus de abdução de ombro, leve flexão de cotovelo, punho e mão em posição de função com semiflexão de punho, semiflexão de dedos e abdução de polegar.","abdução de escápula, 45 graus de abdução de ombro, leve flexão de cotovelo, punho e mão em posição de função com semiflexão de punho, semiflexão de dedos e abdução de polegar.","adução de escápula, 60 graus de abdução de ombro, leve flexão de cotovelo, punho e mão em posição de função com semiextensão de punho, semiflexão de dedos e abdução de polegar."],"a":"A","e":"No ombro hemiplégico hipotônico, o posicionamento tem estes elementos:\n<ul>\n<li><b>Escápula em abdução (protração)</b>, porque a escápula retraída e rodada para baixo favorece a subluxação.</li>\n<li>Cerca de <b>30° de abdução</b> do ombro, apoiado.</li>\n<li>Cotovelo levemente fletido.</li>\n<li>Punho e mão em <b>posição funcional</b>: punho em semiextensão (não em flexão, como em C e D), dedos semifletidos e polegar abduzido.</li>\n</ul>"},{"t":"q","n":41,"stem":"<p>Após 4 meses do início do programa de intervenção, após a reunião de equipe, optou-se por introduzir a terapia por contensão induzida (TCI), ao seu plano de tratamento. Na TCI de acordo com as diretrizes, o treinamento deve ser: intensivo (2 a 6 hs), repetitivo e padronizado. A porcentagem do dia ativo recomendada para a realização da TCI é:</p>","o":["65 a 70%","75 a 80%","80 a 90%","50 a 60%","70 a 75%"],"a":"C","e":"No protocolo clássico de Taub, o membro <b>não afetado</b> fica contido (luva ou tipoia) em cerca de <b>90% das horas acordadas</b>, junto com treino intensivo do membro parético (2 a 6 h/dia, por cerca de 2 semanas). A banca adotou a faixa de 80 a 90% do dia ativo."},{"t":"q","n":42,"stem":"<p>Apesar dos progressos no entendimento da fisiopatologia e no tratamento da asma, sua exacerbação continua sendo causa frequente de internações nos hospitais pediátricos. Entretanto, sua identificação imediata, aliada a um tratamento precoce e adequado, contribui, significativamente, com menores morbidade e mortalidade dessas crianças. Durante uma crise asmática, as crianças adotam uma postura característica. Trata-se da seguinte:</p>","o":["em pé, com os joelhos em extensão, discreta cifose dorsal verticalização clavicular, abdução de escápulas, protusão dos ombros, podendo ter ou não o apoio dos membros superiores.","sentada, com os joelhos fletidos, discreta cifose dorsal, verticalização clavicular, abdução de escápulas, protusão dos ombros, podendo ter ou não o apoio dos membros superiores.","sentada, com os joelhos em extensão, tronco em extensão, adução de escápulas, retração dos ombros e apoio posterior dos membros superiores.","sentada, com os joelhos fletidos, tronco ereto, verticalização clavicular, escápulas em posição neutra, ombros alinhados.","em pé, com os joelhos em extensão, tronco ereto, verticalização clavicular, escápulas em posição neutra, ombros alinhados."],"a":"B","e":"É a postura de alívio respiratório, a posição de “tripé”: <b>sentada, joelhos fletidos</b>, tronco levemente inclinado (discreta cifose), clavículas elevadas, escápulas abduzidas e ombros protusos, apoiando ou não os braços. Ela fixa a cintura escapular para os músculos acessórios (esternocleidomastoideo, escalenos, peitorais) ajudarem na inspiração."},{"t":"q","n":43,"stem":"<p>A fisioterapia no tratamento do portador de doença pulmonar obstrutiva crônica (DPOC) engloba o paciente na fase de prevenção e exacerbação da doença. Os programas de reabilitação duram, em sua maioria, entre seis e doze semanas, com resultados favoráveis, principalmente em relação ao endurance no treinamento de membros inferiores, representando melhora dessa variável de</p>","o":["50 a 75% em relação à avaliação de pré-reabilitação.","40 a 50% em relação à avaliação de pré-reabilitação.","30 a 40% em relação à avaliação de pré-reabilitação.","75 a 150% em relação à avaliação de pré-reabilitação.","20 a 30% em relação à avaliação de pré-reabilitação."],"a":"D","e":"A literatura de reabilitação pulmonar mostra que o ganho de <b>endurance de MMII</b> é o resultado mais expressivo, de <b>75 a 150%</b> em relação à avaliação inicial, mesmo sem melhora da espirometria. Por isso o treino de membros inferiores é o pilar da reabilitação na DPOC."},{"t":"q","n":44,"stem":"<p>João, 11 anos, após muitas avaliações médicas, foi diagnosticado com artrite reumatoide juvenil (ARJ). Seu reumatologista o encaminhou para o fisioterapeuta. O fisioterapeuta, após avaliação, propôs um programa de exercícios que inclui exercícios: de alongamento muscular, aeróbios e de força muscular. Para iniciar os exercícios de força muscular foi recomendado 15 repetições sem carga; na sequência, é recomendado baixo peso com aumento de</p>","o":["0,2 kg a um máximo de 1,0 kg; máximo de 20 repetições.","0,2 kg a um máximo de 1,5 kg; máximo de 20 repetições.","0,2 kg a um máximo de 1,5 kg; máximo de 30 repetições.","0,5 kg a um máximo de 2,5 kg; máximo de 30 repetições.","0,5 kg a um máximo de 2,5 kg; máximo de 20 repetições."],"a":"D","e":"Na ARJ, a progressão da força é com <b>baixa carga e muitas repetições</b>, para proteger as articulações: começa com 15 repetições sem carga e depois acrescenta <b>0,5 kg</b> por vez, até no máximo <b>2,5 kg</b> e <b>30 repetições</b>. É uma questão de memorização do protocolo."},{"t":"q","n":45,"stem":"<p>Luiz queimou 50% do hemicorpo direito quando fazia churrasco no fim de semana em sua casa. Foi levado ao hospital mais próximo para os cuidados iniciais, onde permaneceu para a continuidade do tratamento. Ele tende a permanecer imóvel, movimentando pouco seu hemicorpo direito devido a dor e desconforto. O fisioterapeuta do serviço avaliou-o, e indicou um programa de exercícios visando preservar as amplitudes de movimento e a necessidade de posicionamento para amenizar as contraturas. O hemicorpo direito deve ser posicionado por até</p>","o":["12 meses após o incidente, e, em oposição ao plano, à direção que está ocorrendo a contratura.","6 meses após o incidente, e, em oposição ao plano, à direção que está ocorrendo a contratura.","3 meses após o incidente, e, em oposição ao plano, à direção que está ocorrendo a contratura.","6 meses após o incidente, e, no mesmo plano, à direção que está ocorrendo a contratura.","12 meses após o incidente, e, no mesmo plano, à direção que está ocorrendo a contratura."],"a":"A","e":"A cicatriz da queimadura continua amadurecendo e retraindo por cerca de <b>12 meses</b> ou mais, e por isso o posicionamento vai até lá. Ele deve ser <b>oposto à direção da contratura</b>, na posição antideformidade. Uma frase ajuda a lembrar: “a posição de conforto é a posição da contratura”, então nunca deixe o paciente na posição que ele escolhe."},{"t":"q","n":46,"stem":"<p>Os pacientes com insuficiência cardíaca crônica (ICC) apresentam uma perda generalizada de trofismo da musculatura esquelética. Além disso, mesmo nos estágios precoces da ICC, a função dos músculos periféricos está deteriorada por causa das anormalidades estruturais e metabólicas da musculatura esquelética. Tanto a disfunção generalizada da musculatura esquelética como um aumento crônico de carga de trabalho podem resultar em uma diminuição da força e endurance dos músculos respiratórios na ICC. Nos indivíduos com ICC, os sintomas que mais limitam a capacidade funcional são</p>","o":["fadiga e sonolência.","perda de força muscular e sonolência.","fadiga e dispneia.","perda de força muscular e amplitude de movimento.","dispneia e sonolência."],"a":"C","e":"Na ICC, a intolerância ao esforço aparece como <b>fadiga</b> (miopatia periférica e baixo débito para os músculos) e <b>dispneia</b> (congestão pulmonar e fraqueza dos músculos respiratórios). São esses os sintomas que limitam a capacidade funcional e que a reabilitação cardíaca procura melhorar."},{"t":"q","n":47,"stem":"<p>Mulher, 50 anos, há 2 anos apresenta dor pélvica crônica. Após consulta com a ginecologista, foi encaminhada à fisioterapia. Após a avaliação fisioterapêutica, foi indicado o uso de corrente elétrica como um dos recursos para o alívio da dor. A corrente indicada para esse caso é de baixa frequência até</p>","o":["100 Hz.","60 Hz.","40 Hz.","20 Hz.","80 Hz."],"a":"D","e":"Para <b>dor crônica</b> (pélvica), a literatura de uroginecologia indica corrente de <b>baixa frequência, até cerca de 20 Hz</b>. Ela estimula a liberação de opioides endógenos (endorfinas), com analgesia mais duradoura. Compare com a questão 31: dor aguda pede alta frequência (TENS convencional, analgesia rápida) e dor crônica pede baixa frequência."},{"t":"q","n":48,"stem":"<p>Paciente, com 70 anos, após realização de densitometria óssea solicitada pelo médico de família, recebeu o diagnóstico de osteoporose em toda a coluna lombar e nos quadris, estando a cabeça e o colo do fêmur mais afetados. Foi encaminhada ao fisioterapeuta que, após a avaliação, recomendou, prioritariamente, um programa do(s) seguinte(s) exercício(s):</p>","o":["de alongamento, visando aumento da elasticidade muscular e ganho de amplitude de movimento.","de equilíbrio, devido ao aumento da massa muscular.","ativo-assistidos, visando à manutenção da amplitude de movimento.","aeróbios, visando aumento da condição cardiovascular.","resistidos, visando diminuir o risco de fratura, devido ao aumento da massa óssea."],"a":"E","e":"Pela lei de Wolff, a carga mecânica estimula o osso. Os <b>exercícios resistidos</b> (e os de impacto e descarga de peso) aumentam a densidade óssea e a força muscular e assim <b>reduzem o risco de fratura</b>, por isso são a prioridade na osteoporose. O equilíbrio também é importante, mas a justificativa de B (“devido ao aumento da massa muscular”) não faz sentido."},{"t":"q","n":49,"stem":"<p>Frederico, 72 anos, há 2 meses refere dor no ombro e diminuição da amplitude de movimento de flexão, abdução e rotação externa. Na última semana, a dor tornou-se insuportável, e ele resolveu ir ao médico. Após avaliação e exames de imagem, foi diagnosticado com capsulite adesiva, sendo encaminhado ao fisioterapeuta. A avaliação fisioterapêutica revelou que o nível de irritação tecidual do paciente ao estresse mecânico era moderado, e indicou</p>","o":["recursos eletrofisicos, exercícios de mobilidade, autocuidados e exercícios domiciliares, modificando as atividades e monitorando suas deficiências.","recursos eletrofísicos, exercícios de flexibilidade e reeducação neuromuscular, autocuidado e exercícios domiciliares, abordando deficiências e restaurando atividades funcionais básicas.","recursos eletrofísicos, relaxamento e alongamento muscular, reeducação funcional e autocuidados, mudança de atividade ocupacional e monitoramento de deficiências.","exercícios de flexibilidade e exercícios de reeducação neuromuscular, autocuidados e exercícios domiciliares, abordando deficiências e restaurando atividades funcionais de alta demanda.","exercícios de flexibilidade e exercícios de reeducação neuromuscular, autocuidados e exercícios domiciliares, modificando as atividades e monitorando suas deficiências."],"a":"B","e":"O guideline de capsulite adesiva usa o nível de irritabilidade tecidual:\n<ul>\n<li><b>Alta</b>: o foco é controlar a dor, com recursos eletrofísicos, mobilidade suave e modificação de atividades (A, C).</li>\n<li><b>Moderada</b>: recursos eletrofísicos, <b>flexibilidade + reeducação neuromuscular</b>, autocuidado e exercícios domiciliares, restaurando as <b>atividades funcionais básicas</b> (B).</li>\n<li><b>Baixa</b>: exercícios mais intensos, voltados para atividades de <b>alta demanda</b> (D).</li>\n</ul>"},{"t":"q","n":50,"stem":"<p>Lucas, recém-nascido (RN) de risco, desde a alta da maternidade vem sendo acompanhado na unidade de atenção básica mais próxima de sua casa. Além de fatores pré-natais que indicam a necessidade de acompanhamento, o perímetro cefálico abaixo previsto para a idade foi um critério fundamental para e indicação da vigilância. No Brasil, o critério recomendado referente ao perímetro cefálico é que seja menor que</p>","o":["0,5 desvio-padrão (escore Z), na curva de referência.","3 desvios-padrão (escore Z), na curva de referência.","1 desvio-padrão (escore Z), na curva de referência.","1,5 desvio-padrão (escore Z), na curva de referência.","2 desvios-padrão (escore Z), na curva de referência."],"a":"E","e":"Pelo protocolo do Ministério da Saúde (vigilância de microcefalia e estimulação precoce), perímetro cefálico <b>abaixo de −2 desvios-padrão</b> (escore Z) na curva de referência (OMS ou InterGrowth) indica microcefalia e vigilância. Abaixo de −3 DP é microcefalia grave.</div></div>\n\n<!-- ===================== PROVA 2 ===================== -->"}],"total":50},{"id":"uenp","ano":2026,"org":"UENP – Univ. Estadual do Norte do Paraná","cargo":"Fisioterapeuta","data":"11/10/2026","pdf":"https://arquivos.qconcursos.com/prova/arquivo_prova/161735/vunesp-2026-uenp-fisioterapeuta-prova.pdf","b":[{"t":"h","x":"Língua Portuguesa"},{"t":"txt","x":"<p class=\"t\">Texto para as questões 01 a 05 – Desconectados</p>\n<p>Cerca de 18 milhões de brasileiros, ou 9,5% da população acima de 10 anos, não tinham acesso à internet em 2025, de acordo com o módulo de tecnologia da Pesquisa Nacional por Amostra de Domicílios (Pnad) do IBGE.</p>\n<p>É um contingente espantoso dado o papel central da internet no acesso a serviços públicos, financeiros e educacionais. Isso sem contar o fato de que há um amplo mercado de trabalho organizado em torno da integração digital, como o de motoristas de serviços de aplicativos e de entregas.</p>\n<p>Embora o preço seja um entrave ao acesso para 25,9% dos 4 milhões de domicílios brasileiros “desconectados”, a principal razão para a falta de conexão digital não é financeira. Em 36,5% dos domicílios sem acesso digital, nenhum morador sabia usar a internet, um verdadeiro descalabro.</p>\n<p>O analfabetismo digital custa caro ao Brasil, impedindo que o País saia da armadilha da baixa produtividade. A internet não é apenas uma ferramenta de trabalho cada vez mais relevante, mas um meio essencial para a redução de trâmites burocráticos, para agilizar a comunicação e para franquear acesso à educação e à saúde, entre outras finalidades.</p>\n<p>Durante o necessário período de isolamento social provocado pela pandemia de covid-19, por exemplo, foi a internet que permitiu interações humanas e de trabalho. Graças a ela, crianças não perderam o ano escolar por completo e empresas continuaram produzindo, o que impediu uma depressão econômica ainda maior do que a que se viu no período de 2020/2021.</p>\n<p>Por tudo isso, urge que o País trabalhe para democratizar ainda mais o acesso e para educar sua população a utilizar os meios digitais.</p>\n<p>Instrumento de desenvolvimento e inserção, o acesso à internet precisa não só ser acelerado, mas também dominado pela população brasileira, tão carente de oportunidades e cada vez mais na retaguarda de indicadores globais de educação e de competitividade.</p>\n<p class=\"src\">(Editorial, estadao.com.br/opiniao, 13.07.2026. Adaptado)</p>"},{"t":"q","n":1,"stem":"<p>De acordo com o editorial, a desconexão a que estão expostos 18 milhões de brasileiros deve ser vista como</p>","o":["percurso pessoal que tende a ser alterado muito em breve, pela visão positiva que os cidadãos têm em relação à tecnologia; e como incremento à profissionalização, caso seja mantida.","opção pessoal responsável por democratizar a forma como os cidadãos desejam estabelecer as suas relações humanas; e como restrição de acesso a novas oportunidades.","forma pessoal de viver no mundo contemporâneo, da qual resulta escassez de oportunidades para o cidadão interagir com seus semelhantes; e como forma de garantia de emprego.","reação pessoal à imposição de interações pautadas exclusivamente pela tecnologia, ainda que mais rápidas; e como desafio ao cidadão para descobrir possibilidades de emprego.","atraso pessoal, por eliminar as chances de um cidadão de estudar, trabalhar e estabelecer interações humanas; e como atraso nacional, por impactar na produtividade do país."],"a":"E","e":"O editorial mostra dois prejuízos. O <b>individual</b> é perder acesso a serviços, educação, trabalho e interações. O <b>nacional</b> aparece em “o analfabetismo digital custa caro ao Brasil… armadilha da baixa produtividade”. Em nenhum momento o texto trata a desconexão como opção pessoal ou como algo positivo."},{"t":"q","n":2,"stem":"<p>De acordo com o editorial, o fator decisivo para a ausência de conexão digital dos cidadãos é a</p>","o":["insatisfação com a internet após a pandemia.","indisponibilidade de internet onde moram.","impossibilidade financeira de custeá-la.","incapacidade para a utilização da internet.","inaptidão para os estudos e a competitividade."],"a":"D","e":"“A principal razão para a falta de conexão digital <b>não é financeira</b>. Em 36,5% dos domicílios sem acesso, nenhum morador <b>sabia usar</b> a internet.” O preço (C) pesa para 25,9% dos domicílios, um índice menor. A banca tenta confundir justamente com a alternativa financeira."},{"t":"q","n":3,"stem":"<p>Considere as passagens:</p>\n<blockquote>• É um <b>contingente</b> espantoso dado o papel central da internet no acesso a serviços públicos, financeiros e educacionais. (2º parágrafo)<br>• Embora o preço seja um <b>entrave</b> ao acesso para 25,9% dos 4 milhões de domicílios brasileiros “desconectados”... (3º parágrafo)<br>• A internet não é apenas uma ferramenta de trabalho cada vez mais relevante, mas um <b>meio</b> essencial para a redução de <b>trâmites</b> burocráticos... (4º parágrafo)</blockquote>\n<p>No contexto em que estão empregados, os termos destacados significam, correta e respectivamente:</p>","o":["valor; empecilho; método; imposições.","grupo; dificultador; recurso; especulações.","número; obstáculo; expediente; procedimentos.","quinhão; detalhe; metade; cumprimentos.","conjunto; privilégio; modo; obrigações."],"a":"C","e":"“Contingente” é a quantidade de pessoas (<b>número</b>); “entrave” é <b>obstáculo</b>; “meio” é <b>expediente</b> (recurso para alcançar um fim); “trâmites” são <b>procedimentos</b>, as etapas burocráticas. Em B, “especulações” erra o sentido de trâmites; em E, “privilégio” erra o de entrave."},{"t":"q","n":4,"stem":"<p>Assinale a alternativa em que o termo destacado está empregado em sentido próprio.</p>","o":["É um contingente espantoso dado o papel <b>central</b> da internet no acesso a serviços públicos, financeiros e educacionais. (2º parágrafo)","Em 36,5% dos <b>domicílios</b> sem acesso digital, nenhum morador sabia usar a internet, um verdadeiro descalabro. (3º parágrafo)","O analfabetismo digital custa caro ao Brasil, impedindo que o País saia da <b>armadilha</b> da baixa produtividade. (4º parágrafo)","A internet não é apenas uma <b>ferramenta</b> de trabalho cada vez mais relevante, mas um meio essencial... (4º parágrafo)","... o acesso à internet precisa não só ser acelerado, mas também <b>dominado</b> pela população brasileira, tão carente... (7º parágrafo)"],"a":"B","e":"“Domicílios” são casas, residências, sentido literal. Os demais são metafóricos: “central” no sentido de principal (não de posição geográfica), “armadilha” no sentido de situação difícil de sair, “ferramenta” no sentido de instrumento (não objeto físico), “dominado” no sentido de bem conhecido."},{"t":"q","n":5,"stem":"<p>Assinale a alternativa em que a lacuna da frase deve ser preenchida com “à”, de acordo com a norma-padrão.</p>","o":["O analfabetismo digital custa caro ___ nação, impedindo que o País saia da armadilha da baixa produtividade.","A internet tem papel central no acesso ___ uma gama de serviços públicos, financeiros e educacionais.","A população brasileira, carente de oportunidades, precisa dominar ___ internet para garantir sua inserção digital.","Durante o isolamento social provocado, as pessoas começaram ___ usar mais a internet para estudo e trabalho.","No que diz respeito ___ trâmites burocráticos, a internet é um meio relevante que permite diminuí-los."],"a":"A","e":"“Custar caro <b>a</b>” + “<b>a</b> nação” = <b>à nação</b>. Nas demais não há crase:\n<ul>\n<li>B: antes de artigo indefinido (“a uma gama”).</li>\n<li>C: “dominar” é transitivo direto, então só há o artigo (“dominar a internet”).</li>\n<li>D: antes de verbo (“começaram a usar”).</li>\n<li>E: palavra masculina no plural (“a trâmites”).</li>\n</ul>"},{"t":"h","x":"Matemática e Raciocínio Lógico"},{"t":"q","n":6,"stem":"<p>No primeiro mês do ano, um pequeno empreendedor distribuiu igualmente entre dois funcionários um bônus de B reais. No segundo mês, um outro bônus de B reais foi distribuído igualmente entre três funcionários: os dois funcionários anteriores e mais um outro funcionário. No terceiro mês, outro bônus de B reais foi distribuído igualmente entre cinco funcionários, sendo os três que receberam bônus no segundo mês e mais dois funcionários. Considerando o valor total recebido por um dos funcionários que recebeu o bônus nos três meses, e o valor total recebido pelo funcionário que recebeu o bônus em apenas dois meses, em relação a esses dois valores totais, é correto afirmar que</p>","o":["sua soma é menor do que B reais.","o maior não excede o menor em mais do que a metade de B reais.","sua soma é 17B/30 reais a mais do que o dobro de B reais.","um deles é 8B/15 reais a menos do que o outro.","sua soma é 3B/2 reais."],"a":"B","e":"<ul>\n<li>Quem recebeu nos 3 meses: B/2 + B/3 + B/5 = 15B/30 + 10B/30 + 6B/30 = <b>31B/30</b>.</li>\n<li>Quem recebeu em 2 meses (entrou no 2º mês): B/3 + B/5 = <b>16B/30</b>.</li>\n<li>Diferença: 31B/30 − 16B/30 = 15B/30 = <b>B/2</b>. O maior excede o menor em exatamente metade de B, ou seja, <b>não mais</b> que metade. B está correta.</li>\n<li>Soma: 47B/30. Isso é maior que B (A errada), diferente de 2B + 17B/30 = 77B/30 (C errada) e diferente de 3B/2 = 45B/30 (E errada).</li>\n</ul>"},{"t":"q","n":7,"stem":"<p>Observe a sequência de preços de um produto:<br>• Preço 1: X<br>• Preço 2: aumento de 80% em relação ao preço 1.<br>• Preço 3: aumento de 80% em relação ao preço 2.<br>Sabe-se que a diferença entre o preço 2 e o preço 1 é de R$ 19,20. A diferença entre o preço 3 e o preço 2 é igual a</p>","o":["R$ 19,20.","R$ 34,56.","R$ 38,40.","R$ 38,88.","R$ 43,20."],"a":"B","e":"0,8·X = 19,20, então X = 24. O preço 2 é 24 × 1,8 = 43,20 e o preço 3 é 43,20 × 1,8 = 77,76. A diferença é 77,76 − 43,20 = <b>34,56</b>. Atalho: a segunda diferença é a primeira vezes 1,8 (19,20 × 1,8 = 34,56)."},{"t":"q","n":8,"stem":"<p>No primeiro turno de um campeonato de futebol, a razão entre o número de gols marcados e o número de gols sofridos por uma equipe foi 15/4 e o saldo de gols (diferença entre gols marcados e gols sofridos) foi de 33 gols. Já no segundo turno, essa razão foi igual a 5/2 e o saldo de gols foi de 21 gols. Considerando esses dois turnos do campeonato, o número total de gols sofridos por essa equipe foi igual a</p>","o":["12.","14.","18.","22.","26."],"a":"E","e":"No 1º turno, marcados = 15k e sofridos = 4k. O saldo é 11k = 33, então k = 3 e a equipe sofreu <b>12</b>. No 2º turno, marcados = 5k e sofridos = 2k. O saldo é 3k = 21, então k = 7 e a equipe sofreu <b>14</b>. Total: 12 + 14 = <b>26</b>. Cuidado com as alternativas A e B, que trazem os resultados de cada turno separado."},{"t":"q","n":9,"stem":"<p>Assinale a alternativa que indica uma afirmação que corresponda à uma negação lógica da afirmação a seguir:</p>\n<blockquote>Se o código está correto, então o programa roda, ou, se a ideia inicial não funciona, então desistiremos desse caminho.</blockquote>","o":["O código não está correto e o programa não roda e a ideia inicial funciona e não desistiremos desse caminho.","Se o código não está correto, então o programa não roda, ou, se a ideia inicial funciona, então não desistiremos desse caminho.","Se código está correto ou o programa não roda, então a ideia inicial funciona e não desistiremos desse caminho.","O código está correto e o programa não roda e a ideia inicial não funciona e não desistiremos desse caminho.","Se o programa não roda, então o código não está correto, ou, se não desistiremos desse caminho, então a ideia inicial funciona."],"a":"D","e":"A estrutura é (p → q) <b>ou</b> (r → s), com r = “a ideia inicial não funciona”. As regras:\n<ul>\n<li>Negação de “ou”: nega as duas partes e troca por <b>e</b>.</li>\n<li>Negação de “se p então q”: <b>p e não q</b>.</li>\n</ul>\nO resultado é (p e ~q) e (r e ~s): “o código está correto <b>e</b> o programa não roda <b>e</b> a ideia inicial não funciona <b>e</b> não desistiremos”. Note que o r se mantém, porque já era “não funciona”."},{"t":"q","n":10,"stem":"<p>Considere a sequência numérica criada com um padrão lógico matemático:</p>\n<blockquote>1; 2; 1; 3; 2; 5; 4; 8; 7; 12; …</blockquote>\n<p>Seja X o único elemento dessa sequência, que é igual a média aritmética simples dos elementos que ocupam as posições 14, 20 e 24. A posição que o elemento X ocupa, nessa sequência, é</p>","o":["19.","20.","21.","22.","23."],"a":"C","e":"São duas sequências intercaladas:\n<ul>\n<li>Posições ímpares: 1, 1, 2, 4, 7, 11, 16, 22, 29, 37, 46, 56… (soma +0, +1, +2, +3…)</li>\n<li>Posições pares: 2, 3, 5, 8, 12, 17, 23, 30, 38, 47, 57, 68… (soma +1, +2, +3, +4…)</li>\n</ul>\nNa sequência completa, a posição 14 vale 23, a 20 vale 47 e a 24 vale 68. A média é (23 + 47 + 68) ÷ 3 = 138 ÷ 3 = <b>46</b>, que está na posição <b>21</b>."},{"t":"h","x":"Legislação (UENP / Paraná)"},{"t":"q","n":11,"stem":"<p>A Universidade Estadual do Norte do Paraná (UENP) pretende implantar um sistema informatizado destinado a aprimorar a gestão e o controle dos projetos de pesquisa em andamento. Nesse contexto, a empresa X, de propriedade de um ex-aluno da instituição, manifestou interesse em doar à Universidade um sistema capaz de atender a essa finalidade, bem como prestar, gratuitamente, os respectivos serviços de suporte técnico durante todo o período em que o sistema permanecer em utilização. Com base nessa situação hipotética e no disposto no Regimento da Universidade Estadual do Norte do Paraná, é correto afirmar que</p>","o":["a doação, por disposição expressa, não pode abarcar bens imateriais, como sistemas de informática.","a doação, caso realizada, não pode ter uma destinação ou órgão específico, pois o sistema passa a integrar o patrimônio da Universidade.","a Câmara de Orçamento e Finanças deve se pronunciar ou dar parecer sobre a aceitação da doação.","a doação não pode ser aceita, pois foi realizada por empresa, que não possui finalidade filantrópica.","a doação pode ser recebida, pois foi realizada por empresa que conta, em seu quadro societário, com um ex-aluno."],"a":"C","e":"Pelo Regimento da UENP, cabe à <b>Câmara de Orçamento e Finanças</b> se pronunciar ou dar parecer sobre a aceitação de doações, legados e subvenções. O Regimento não proíbe doação de bens imateriais nem doação de empresas, e permite destinação específica. Também não importa o fato de o dono ser ex-aluno (E).<span class=\"warn\">Esta parte é específica do edital da UENP. Vale para treinar, mas o conteúdo muda em outros concursos.</span>"},{"t":"q","n":12,"stem":"<p>Considere que Fabiano, integrante do corpo técnico-administrativo da Universidade Estadual do Norte do Paraná (UENP), praticou infração disciplinar passível de aplicação da penalidade de suspensão. Com base nessa situação hipotética e no disposto no Regimento da Universidade Estadual do Norte do Paraná, é correto afirmar que</p>","o":["a penalidade deverá ser aplicada impreterivelmente por seu chefe imediato.","na aplicação da penalidade a autoridade competente precisa avaliar, dentre outros aspectos, a primariedade do autor, o valor do bem atingido com a prática da infração e o dano provocado à reputação da universidade.","a aplicação da penalidade não precisará ser precedida de processo administrativo, caso o técnico não seja estatutário e possua contrato sujeito à Consolidação das Leis do Trabalho.","por disposição expressa, a pena de suspensão não é passível de recurso.","uma vez aplicada, a suspensão deve ser comunicada, para fins de registro, na Pró-Reitoria de Recursos Humanos."],"a":"E","e":"O Regimento determina que as penalidades aplicadas sejam <b>comunicadas à Pró-Reitoria de Recursos Humanos</b> para registro nos assentamentos do servidor. As outras falham porque a competência depende da autoridade prevista (A), sempre há processo com contraditório e ampla defesa (C) e cabe recurso (D). Os critérios de B não são os que o Regimento lista."},{"t":"q","n":13,"stem":"<p>Com base no Estatuto da Universidade Estadual do Norte do Paraná (UENP), é correto afirmar que</p>","o":["o corpo de servidores técnico-administrativos será formado por todos que exerçam funções de carreira não docente.","o corpo discente é constituído por todos os estudantes regularmente matriculados em seus cursos, excluídos os alunos especiais.","a comunidade universitária é constituída pelo corpo docente, pelo corpo discente, pelo corpo de servidores técnico-administrativos e pelos colaboradores terceirizados.","a pesquisa corresponde ao processo educativo, cultural e científico que articula a extensão e a prática, para fortalecer a relação entre a universidade e a comunidade.","o calendário escolar será organizado tendo por base o ano civil, devendo ser unificado entre todos os campus da UENP."],"a":"A","e":"A alternativa A reproduz o Estatuto. Os erros das outras:\n<ul>\n<li>B: o corpo discente não exclui alunos especiais.</li>\n<li>C: terceirizados não fazem parte da comunidade universitária.</li>\n<li>D: a definição dada é a de <b>extensão</b>, não de pesquisa.</li>\n<li>E: o Estatuto não impõe calendário unificado pelo ano civil.</li>\n</ul>"},{"t":"q","n":14,"stem":"<p>Joana é analista administrativa e foi informada de que, em razão da necessidade do serviço, deverá exercer, temporariamente, atribuições diversas daquelas inerentes ao cargo para o qual foi aprovada em concurso público. Com base nessa situação hipotética e no disposto na Lei Estadual do Estado do Paraná nº 6.174/1970 (Estatuto do Servidor Público do Poder Executivo do Estado do Paraná), é correto afirmar que</p>","o":["como há necessidade imperiosa de serviço, poderão ser cometidos a Joana, mediante prévia autorização do órgão competente, por prazo não superior a seis meses, atribuições não compreendidas na especificação de seu cargo.","Joana não pode exercer atribuições diversas, de forma alguma, pois isso ofenderia o princípio constitucional do concurso público.","caso praticado o desvio de função, Joana e o responsável pela designação para o novo posto deverão ser demitidos a bem do serviço público.","Joana pode exercer outras funções, caso atenda o interesse público, hipótese em que fará jus à remuneração das atribuições que estiver exercendo e um adicional de 20% (vinte por cento).","Joana somente poderá exercer funções diversas do cargo que ocupa caso haja situação de iminente perigo público, devidamente decretado pelo Governador do Estado."],"a":"A","e":"A regra do Estatuto do Servidor do Paraná é proibir o desvio de função, com uma exceção: em <b>necessidade imperiosa do serviço</b>, com <b>prévia autorização</b> e por <b>no máximo 6 meses</b>, o servidor pode exercer atribuições fora do seu cargo."},{"t":"q","n":15,"stem":"<p>De acordo com a Lei do Estado do Paraná nº 21.583/2023 (Lei da Carreira Técnica Universitária das Universidades Públicas Estaduais do Paraná), a carga de trabalho dos cargos da Carreira Técnica Universitária é de</p>","o":["trinta horas semanais, com exceção da função de médico, que será de vinte horas semanais, com jornada de quatro horas diárias.","quarenta horas semanais para todos os cargos.","quarenta horas semanais, com exceção dos profissionais da área de saúde, hipótese em que será de trinta horas semanais.","quarenta e quatro horas semanais, com exceção da função de médico, que será de trinta horas semanais.","quarenta horas semanais, com exceção da função de médico, que será de vinte horas semanais, com jornada de quatro horas diárias."],"a":"E","e":"A Lei 21.583/2023 fixa <b>40 h semanais</b>. A única exceção é o <b>médico</b>, com 20 h semanais (4 h diárias). Atenção: a lei não garante 30 h para os profissionais de saúde em geral (C)."},{"t":"h","x":"Informática"},{"t":"q","n":16,"stem":"<p>Desejando verificar algumas funcionalidades de seu computador, Miguel pretende executar o programa Teste.exe, que está localizado em uma pasta com seu nome armazenada no diretório raiz da unidade de disco rígido C: do equipamento. Considerando que o computador utiliza o MS-Windows 11, em sua configuração padrão, e que o usuário possui todas as permissões requeridas para realizar essa ação, assinale a alternativa que apresenta o conteúdo que Miguel deve inserir no campo endereço do Explorador de Arquivos para executar o programa pretendido.</p>","o":["C#Miguel#Teste.exe","C://Miguel//Teste.exe","C:/Miguel/Teste.exe","C:\\Miguel\\Teste.exe","C@Miguel@Teste.exe"],"a":"D","e":"No Windows, o caminho começa pela unidade (<b>C:</b>) e as past
