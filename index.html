os privados. – está de acordo com o sentido do texto e com a norma-padrão em:","o":["Como contamos com um sistema público universal de atendimento, o que provavelmente é uma conquista civilizatória, estamos longe de poder renunciar dos recursos privados.","Ainda que contemos com um sistema público universal de atendimento, o que indubitavelmente é uma conquista civilizatória, estamos longe de poder renunciar aos recursos privados.","Apesar de contarmos com um sistema público universal de atendimento, o que certamente é uma conquista civilizatória, estamos longe de poder renunciar com os recursos privados.","Tanto contemos com um sistema público universal de atendimento, o que possivelmente é uma conquista civilizatória, que estamos longe de poder renunciar pelos recursos privados.","Uma vez que contamos com um sistema público universal de atendimento, o que consequentemente é uma conquista civilizatória, estamos longe de poder renunciar os recursos privados."],"a":"B","e":"“Ainda que contemos” mantém a concessão, “indubitavelmente” mantém o “sem dúvida”, e “renunciar <b>a</b>” é a regência correta."},{"t":"q","n":9,"stem":"A reescrita de passagem do texto está em conformidade com a norma-padrão de pontuação em:","o":["A expansão, deve continuar nos próximos anos…","… o aumento dos gastos no período se concentrou, nas famílias…","… o que, sem dúvida, é uma conquista civilizatória…","Será necessário, fortalecer o SUS…","… projeta-se que, o patamar de 20% será ultrapassado em 2050…"],"a":"C","e":"“o que, <b>sem dúvida</b>, é…”: as vírgulas isolam a expressão intercalada. As outras separam termos que andam juntos (sujeito e verbo, verbo e complemento)."},{"t":"q","n":10,"stem":"Considere as frases:<br>• \u0007Parcelas crescentes de renda dos brasileiros têm sido destinadas despesas com serviços de saúde e medicamentos.<br>• \u0007Será necessário fortalecer o SUS para que se possa dar a devida assistência população idosa.<br>• \u0007Hoje, homens e mulheres que chegam 65 anos representam perto de 11% dos brasileiros. De acordo com a norma-padrão, as lacunas devem ser preenchidas, respectivamente, com:","o":["as … a … à","a … a … à","à … à … a","às … à … a","a … à … à"],"a":"D","e":"“destinadas <b>às</b> despesas” (crase no plural), “assistência <b>à</b> população” e “chegam <b>a</b> 65 anos” (não há crase antes de número)."},{"t":"q","n":11,"stem":"A concordância nominal atende à norma-padrão em:","o":["De acordo com estudos, projeta-se que haja bastante idosos no Brasil em 2070.","A longo prazo, é necessário a revisão de prioridades e a contenção de despesas.","O fortalecimento do SUS é urgente, pois a rede de atendimento está meia onerada.","Vem mostrando-se relevante o aumento dos gastos com saúde nas famílias.","Para que seja viabilizado mais atenção ao SUS, devem-se conter outras despesas."],"a":"D","e":"Em D, o sujeito “o aumento” concorda com “vem mostrando-se relevante”. Os erros das outras: “bastantes idosos” (A), “é necessária a revisão” (B), “meio onerada” (C, advérbio invariável) e “seja viabilizada mais atenção” (E)."},{"t":"txt","x":"<p class=\"t\">Leia o texto para responder às questões de números 12 a 15.</p><p class=\"ti\">A velha</p><p>A velha era felicíssima. Pois não é verdade que tinha uma boa vida e nada lhe faltava?</p><p>Só nessa manhã tinha encontrado um lugar vago num banco de jardim, nem demasiado à sombra nem demasiado ao sol, o elétrico não vinha excessivamente cheio e também conseguiu lugar, o padeiro disse-lhe bom dia com um ar tão simpático, quando ela deixou em cima do balcão o dinheiro de três carcaças, e o empregado da mercearia ficou a conversar depois de lhe dar o troco e perguntou-lhe se gostava daquela nova marca de café.</p><p>O mal de muita gente era não saber dar o devido valor às coisas. A maioria esbanjava tempo e felicidade, da mesma forma que esbanjava dinheiro. Se se fosse a ver, poucos sabiam aproveitar o que tinham. Por exemplo, não aproveitavam a água quente, que ficava nos canos depois de se ligar o gás e de a água aquecer, não se lembravam de apagar logo as luzes do teto quando passavam de um quarto para outro, nem desligavam os queimadores do fogão um pouco antes de a comida estar pronta. Sim, quantos faziam isso? E depois admiravam-se de o dinheiro não chegar ao fim do mês.</p><p class=\"src\">(Teolinda Gersão, “A velha”. Em: Massaud Moisés. A Literatura Portuguesa Através Dos Textos. Adaptado)</p>"},{"t":"q","n":12,"stem":"Entende-se que contribuía para a felicidade da velha","o":["a satisfação com o endividamento alheio.","o gasto com produtos de alto valor.","a economia contínua em seu cotidiano.","o controle de gastos pessoais e alheios.","a admiração de pessoas esbanjadoras."],"a":"C","e":"A velha se sentia feliz porque <b>economizava</b> e aproveitava tudo o que tinha, em contraste com os outros, que esbanjavam."},{"t":"q","n":13,"stem":"Considere as passagens do terceiro parágrafo:<br>• \u0007Se se fosse a ver, poucos sabiam aproveitar o que tinham.<br>• \u0007E depois admiravam-se de o dinheiro não chegar ao fim do mês. Os termos destacados são, correta e respectivamente:","o":["artigo; pronome; artigo.","preposição; pronome; artigo.","pronome; pronome; pronome.","preposição; artigo; artigo.","pronome; artigo; pronome."],"a":"E","e":"Gabarito oficial: <b>E</b> (pronome; artigo; pronome). Os termos destacados aparecem em negrito no caderno. Confira no PDF da prova."},{"t":"q","n":14,"stem":"O sentido expresso pelo adjetivo em “A velha era felicíssima.” e o sentido da frase “A maioria esbanjava tempo e felicidade, da mesma forma que esbanjava dinheiro.” são, correta e respectivamente, de:","o":["intensidade e comparação.","desdém e conclusão.","polidez e oposição.","intensidade e finalidade.","desdém e comparação."],"a":"A","e":"“Felicíssima” é superlativo, ou seja, <b>intensidade</b>. “Da mesma forma que” indica <b>comparação</b>."},{"t":"q","n":15,"stem":"Assinale a alternativa em que a colocação pronominal está em conformidade com a norma-padrão.","o":["Se sentia feliz a velha, pois achava que tinha uma boa vida e nada lhe faltava.","As pessoas sempre admiravam-se de o dinheiro nunca chegar ao fim do mês.","O mal de muita gente era não preocupar-se em dar o devido valor às coisas.","Não aproveitavam a água quente, que mantinha-se nos canos após ligar o gás.","A velha encontrou lugar no elétrico; sentou-se, já que ele não vinha muito cheio."],"a":"E","e":"Em E, depois de ponto e vírgula, sem palavra que atraia, a ênclise “sentou-se” está correta. Os erros das outras: frase iniciada por oblíquo (A), “sempre” atrai o pronome (B), “não” atrai (C) e “que” atrai (D)."},{"t":"h","x":"Política de Saúde"},{"t":"q","n":16,"stem":"As diferentes condições de vida, habitação, trabalho, renda e de acesso à educação, lazer, cultura e serviços públicos impactam de forma diferenciada a saúde da população, assim como as diferentes formas de preconceito e discriminação social, tais como o racismo, a misoginia, a LGBTfobia e a exclusão social de populações que vivem em situação de rua ou em condições de isolamento territorial. Assinale a alternativa que corresponde ao princípio do SUS que reconhece as necessidades, diversidades e especificidades de cada cidadão ou grupo social na formulação de políticas públicas, tendo como objetivo diminuir as desigualdades.","o":["Regionalização.","Integralidade.","Equidade.","Participação Popular.","Universalidade."],"a":"C","e":"Reconhecer as diferenças para reduzir desigualdades é a <b>equidade</b>."},{"t":"q","n":17,"stem":"A garantia do cuidado na Atenção Básica passa pela formação de uma fonte contínua de atenção, a partir da presença de vínculo e confiança entre usuários e profissionais de saúde, que permite conhecer o usuário de maneira integral, desde comportamentos, hábitos e o contexto em que está inserido, possibilitando o planejamento adequado do cuidado e das intervenções. Trata-se de uma diretriz da Política Nacional de Atenção Básica denominada","o":["Resolutividade.","Ordenação de Redes.","Longitudinalidade do Cuidado.","Acolhimento.","Humanização."],"a":"C","e":"Vínculo e fonte contínua de cuidado ao longo do tempo correspondem à <b>longitudinalidade</b> (PNAB)."},{"t":"q","n":18,"stem":"No delineamento do estudo epidemiológico do tipo transversal, define-se uma população de referência e coletam-se os dados de exposição e doença ao mesmo tempo. A partir desse conjunto, divide-se em quatro grupos para análise: a) doentes e expostos ao fator de risco; b) não doentes expostos ao fator de risco; c) doentes não expostos ao fator de risco; d) não doente e não exposto ao fator de risco. Assinale a alternativa que corresponde ao cálculo do coeficiente de prevalência da doença entre os expostos. (As alternativas são fórmulas em imagem no caderno original.)","o":["Fórmula (A) – ver caderno","Fórmula (B) – ver caderno","Fórmula (C) – ver caderno","Fórmula (D) – ver caderno","Fórmula (E) – ver caderno"],"a":"A","e":"Questão com fórmulas em imagem no caderno. Gabarito oficial: <b>A</b>. A prevalência entre os expostos é <b>a/(a+b)</b>: os doentes expostos divididos por todos os expostos.","img":true},{"t":"q","n":19,"stem":"A história natural da doença refere-se ao curso da doença, desde o início até sua resolução, na ausência de intervenção. Considerando o modelo tradicional da história natural da doença e sua relação com os níveis de prevenção propostos por Level e Clark, assinale a alternativa correta em relação às medidas preventivas do período pré-patogênico.","o":["São realizadas no início da doença, na fase subclínica, antes de sua progressão aparente, visando à regressão.","Correspondem às ações primárias, aplicadas em fases anteriores ao início biológico da doença, e são dirigidas para a manutenção da saúde.","São classificadas em prevenção primária, secundária e terciária.","Compreendem as ações de rastreamento e diagnóstico precoce.","Incluem medidas recomendadas em fase mais avançada da doença, no intuito de prevenir deterioração ainda maior da história natural da doença."],"a":"B","e":"O período pré-patogênico corresponde à <b>prevenção primária</b> (promoção e proteção específica), antes do início biológico da doença."},{"t":"q","n":20,"stem":"Assinale a alternativa que corresponde à área da Vigilância em Saúde que é operacionalizada com base em um ciclo de funções específicas e intercomplementares, dentre as quais a coleta e processamento de dados, com o propósito de conhecer, a cada momento, o comportamento da doença ou agravo, visando, oportunamente, adotar medidas de intervenção.","o":["Tecnologia da Informação e Comunicação.","Comitê de Informação e Informática em Saúde.","Monitoramento e Avaliação do SUS.","Saúde Digital.","Vigilância Epidemiológica."],"a":"E","e":"Coletar e analisar dados de forma contínua para conhecer o comportamento da doença e intervir é a <b>vigilância epidemiológica</b>."},{"t":"q","n":21,"stem":"Considerando que a Taxa de Mortalidade Infantil estima o risco de as crianças nascidas vivas morrerem antes de completar um ano de vida, assinale a alternativa correta sobre o indicador.","o":["As altas taxas de mortalidade infantil estão diretamente relacionadas com a qualidade do pré-natal e assistência ao parto.","Expressa tendências dentro dos diferentes grupos etários, como exemplo, declínio das mortes pós-neonatais em razão da melhor atenção pré-natal, parto e puerpério.","Pode estar subestimada pela exclusão de óbitos declarados como natimortos, ocorridos pouco após o parto.","Os dados do numerador provêm do sistema nacional de informação sobre mortalidade e os dados do denominador do sistema nacional de informação sobre nascidos vivos.","Inclui os diferentes grupos etários, como perinatal, neonatal precoce, neonatal tardio e pós-natal."],"a":"D","e":"Na Taxa de Mortalidade Infantil, o <b>numerador</b> (óbitos de menores de 1 ano) vem do <b>SIM</b> e o <b>denominador</b> (nascidos vivos) vem do <b>SINASC</b>."},{"t":"q","n":22,"stem":"A gestão do SUS é um processo complexo, permeada por um contexto cujas influências políticas locais, estaduais e federais determinam as práticas de saúde e interferem nas relações de poder e nas tomadas de decisões. Assinale a alternativa que indica, corretamente, um avanço do processo de descentralização da gestão em saúde.","o":["Investimentos para a expansão da rede especializada, visando ampliar a oferta da atenção secundária e terciária.","Maior influência da casa legislativa municipal na elaboração do orçamento e na definição de prioridades.","Obrigatoriedade da dedicação exclusiva da força de trabalho no SUS, incluindo médicos, estabelecido no plano de carreiras aprovado no Conselho Nacional de Saúde.","Aumento do número de leitos hospitalares pelas Secretarias Estaduais de Saúde.","Ampliação do acesso em nível local e da cobertura assistencial em relação às ações básicas de saúde."],"a":"E","e":"A descentralização levou à <b>ampliação do acesso local</b> e da cobertura das ações básicas, sob gestão municipal."},{"t":"q","n":23,"stem":"Determinados agravos à saúde, como os casos de dengue, devem ser comunicados à autoridade de saúde, quando da sua ocorrência de suspeita ou confirmação. Em face do exposto, assinale a alternativa correta.","o":["A notificação de casos confirmados de dengue deve ser realizada somente pelos profissionais médicos.","A suspeita de dengue deve ser notificada em até 24 (vinte e quatro) horas, ao passo que os casos confirmados podem ser notificados semanalmente.","A notificação deve ser realizada pelo modelo de vigilância sentinela, por se tratar de epidemia.","Os óbitos por dengue são de notificação imediata para a autoridade de saúde competente.","Em não havendo nenhum caso de dengue na semana, o estabelecimento de saúde fica isento de enviar qualquer informação à autoridade de saúde."],"a":"D","e":"Pela portaria de notificação compulsória, os <b>óbitos por dengue</b> são de notificação <b>imediata</b> (até 24 h). Os casos comuns são semanais, e outros profissionais além dos médicos também notificam."},{"t":"q","n":24,"stem":"A organização do trabalho em rede está associada à ideia de uma organização, a fim de garantir atenção integral, efetiva e eficaz às populações assistidas, com a possibilidade de construção de vínculos de cooperação e solidariedade entre as equipes e os níveis de gestão do sistema de saúde. Assinale a alternativa que descreve, corretamente, uma característica da Rede de Atenção à Saúde no SUS.","o":["Formação de relações verticais entre os diferentes pontos de atenção.","Atenção Primária à Saúde como centro de comunicação.","Planejamento das ações considera o quantitativo de procedimentos executados nos estabelecimentos de saúde do ano anterior.","Cuidado multiprofissional, sob coordenação do profissional médico.","Pronto-Socorro e centro de especialidades são coordenadores do cuidado na garantia da atenção à saúde do usuário."],"a":"B","e":"Nas RAS, a <b>APS é o centro de comunicação</b> e a coordenadora do cuidado. As relações são horizontais, não hierárquicas."},{"t":"q","n":25,"stem":"A governança das redes de atenção à saúde, no SUS, deve ser feita pelas comissões intergestores, com responsabilidade na pactuação da organização e funcionamento das ações e serviços de saúde integrados em redes de atenção à saúde. Sobre a Comissão Intergestores Tripartite, é correto afirmar:","o":["Responsável por pactuar os critérios para o planejamento integrado das ações e serviços de saúde da Região de Saúde, em razão do compartilhamento da gestão.","É vinculada às Secretarias Estaduais de Saúde para efeitos administrativos e operacionais.","Os gestores públicos de saúde podem ser representados pelos Conselhos de Saúde.","É de sua competência exclusiva pactuar as etapas do processo e os prazos do planejamento municipal em consonância com os planejamentos estadual e nacional.","Estabelece critérios para o diagnóstico da doença ou do agravo à saúde, o tratamento preconizado e o acompanhamento dos resultados terapêuticos."],"a":"A","e":"Gabarito oficial: A. A CIT pactua, na esfera nacional, os <b>critérios para o planejamento integrado</b> das ações e serviços de saúde (Decreto 7.508/2011)."},{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":26,"stem":"Uma puérpera apresentou diástase dos músculos retos abdominais. A fisioterapeuta que a atende programou realizar exercícios abdominais hipopressivos nessa paciente. Esses exercícios têm como objetivo","o":["combinar exercícios de fortalecimento dos músculos abdominais para aumentar a pressão intra-abdominal, além de favorecer a ativação do músculo transverso do abdômen.","combinar exercícios posturais e respiratórios para diminuir a pressão intra-abdominal, além de favorecer a ativação do músculo transverso do abdômen.","ativar os músculos retos abdominais e os do assoalho pélvico para aumentar a pressão intra-abdominal, produzindo a redução do espaço entre os músculos retos abdominais.","alongar os músculos retos abdominais, fortalecer os músculos do assoalho pélvico para aumentar a pressão intra-abdominal, produzindo a redução do espaço entre os músculos retos abdominais.","relaxar os músculos retos abdominais, para diminuir a pressão intra-abdominal, produzindo a redução do espaço entre os músculos retos abdominais."],"a":"B","e":"Os hipopressivos combinam <b>posturas e respiração</b> (apneia expiratória) para <b>reduzir a pressão intra-abdominal</b> e ativar o transverso do abdome."},{"t":"q","n":27,"stem":"O INSS oferece serviços e benefícios; entre eles, o processo de reabilitação profissional. Esse serviço pode ser utilizado por trabalhadores","o":["que sofreram acidente de trabalho ou têm doença ocupacional.","que sofreram acidentes de trânsito não relacionados ao trabalho.","que sofrem de doenças crônicas, como hipertensão.","aposentados que buscam reinserção no trabalho.","aposentados que apresentam disfunções neurológicas."],"a":"A","e":"A reabilitação profissional do INSS atende principalmente segurados afastados por <b>acidente de trabalho ou doença ocupacional</b> (e também outros segurados incapacitados, conforme o caso)."},{"t":"q","n":28,"stem":"O novo Plano Novo Viver sem Limites, do governo federal, apresenta diversas diretrizes. A diretriz que prevê que qualquer diferenciação, exclusão ou restrição baseada em deficiência, com o propósito ou o efeito de impedir ou impossibilitar o reconhecimento, o desfrute ou o exercício, pelas pessoas com deficiência, em igualdade de oportunidades com as demais pessoas, de todos os direitos humanos e liberdades fundamentais nos âmbitos político, econômico, social, cultural, civil ou qualquer outro, nos termos do artigo 2o da Convenção Internacional sobre os Direitos das Pessoas com Deficiência, é a diretriz sobre","o":["o reconhecimento da interseccionalidade como componente constitutivo das identidades de pessoas e grupos.","o reconhecimento da participação e do protagonismo das pessoas com deficiência.","a garantia de acesso das pessoas com deficiência aos produtos, aos serviços e aos equipamentos públicos e privados.","o enfrentamento do capacitismo, do preconceito e da violência contra pessoas com deficiência.","o compartilhamento pactuado de ações e estratégias com os entes federativos e com organizações e movimentos da sociedade civil."],"a":"D","e":"Definir discriminação por deficiência, nos termos do art. 2º da Convenção, fundamenta a diretriz de <b>enfrentamento do capacitismo</b>, do preconceito e da violência."},{"t":"q","n":29,"stem":"Quando um paciente apresenta coxa valga, pode ocorrer","o":["elevação contralateral do quadril, resultando em encurtamento dos músculos abdutores do quadril.","elevação do ilíaco ipsilateral e obliquidade da pelve, resultando em adução ipsilateral do quadril.","aumento da distância da cabeça do fêmur ao trocanter maior, diminuindo o comprimento do braço dos abdutores do quadril.","diminuição do ângulo patológico de inclinação da pelve, provocando um aumento na força de cisalhamento no colo do fêmur.","abaixamento do ilíaco ipsilateral, tornando o membro anatomicamente mais longo."],"a":"C","e":"Gabarito oficial: C. Na coxa valga, o ângulo cervicodiafisário maior muda a relação entre a cabeça femoral e o trocânter maior e <b>diminui o braço de alavanca dos abdutores</b>, que perdem eficiência."},{"t":"q","n":30,"stem":"Ao analisar as alterações que ocorrem em um paciente com escoliose, verifica-se que","o":["curvas acima de 10º devem ser tratadas com cirurgia.","curvas no plano coronal são normais até um ângulo estabelecido de 15º.","ocorre uma alteração da coluna vertebral no plano coronal.","ocorrem alterações da coluna no plano sagital.","ocorre curva para o lado oposto ao lado da giba."],"a":"C","e":"Escoliose é o desvio da coluna no <b>plano coronal</b> (frontal), associado à rotação vertebral. Curvas a partir de 10° já definem escoliose, e a cirurgia fica para curvas maiores (acima de 40° a 50°)."},{"t":"q","n":31,"stem":"Sobre a ocorrência de arritmias cardíacas na gestação, é correto afirmar que","o":["as arritmias leves são comuns durante a gestação e geralmente são pouco sintomáticas e bem toleradas sem medicação.","as taquiarritmias supraventriculares sustentadas podem ocorrer em até 1,3% de gestações com anomalias cardíacas estruturais.","a fibrilação atrial pode se manifestar pela primeira vez durante a gestação, especialmente em pacientes com menos idade.","o surgimento de uma arritmia sintomática não está associado a outras condições, como anemia, infecção, hipertireoidismo ou embolia pulmonar.","as arritmias acontecem apenas em gestantes com idades superiores a 40 anos e requerem o uso de medicação."],"a":"A","e":"Arritmias leves (extrassístoles, taquicardia sinusal) são <b>comuns e bem toleradas</b> na gestação, em geral sem medicação."},{"t":"q","n":32,"stem":"A técnica fórcipe é usualmente utilizada quando existe suspeita de sofrimento fetal, com o intuito de abreviar o período expulsivo, e pode gerar algumas complicações. Nesse tipo de parto, raramente ocorre(m) como complicação:","o":["anemia.","fissuras perineais.","esgarçamento do colo do útero.","fissuras vaginais.","roturas de esfíncter do ânus."],"a":"C","e":"Lesões de períneo, vagina, colo e esfíncter são complicações maternas frequentes do fórceps. A <b>anemia</b> é a menos comum como complicação direta."},{"t":"q","n":33,"stem":"Uma criança tem suspeita de displasia do desenvolvimento do quadril. Os principais sinais clínicos que devem ser pesquisados para o diagnóstico dessa alteração são:","o":["rotação externa de quadril e encurtamento dos membros.","limitação da adução e assimetria dos membros.","limitação da abdução e assimetria dos membros.","rotação interna de quadril e externa de joelho.","rotação externa de joelhos e flexão plantar de tornozelo."],"a":"E","e":"Na displasia do desenvolvimento do quadril, procura-se <b>limitação da abdução</b> e <b>assimetria</b> de membros e de pregas, além das manobras de Ortolani e Barlow."},{"t":"q","n":34,"stem":"O Brasil tem vivido um surto importante de dengue no ano de 2024. Sobre a transmissão da dengue, é correto afirmar que","o":["crianças de até 2 anos que foram amamentadas possuem imunidade natural contra a doença.","a transmissão por via vertical (de mãe para filho durante a gestação) é frequente, por isso essa população deve ser mantida sob vigilância.","o vírus da dengue não é transmitido por transfusão de sangue, apenas pela picada de fêmeas de Aedes aegypti infectadas.","adolescentes possuem 3 vezes mais chances de ter maiores riscos de desenvolver complicações pela doença.","o vírus da dengue pode ser transmitido ao homem principalmente por via vetorial, pela picada de fêmeas de Aedes aegypti infectadas."],"a":"A","e":"A dengue é transmitida principalmente pela <b>picada da fêmea de Aedes aegypti</b>. A transmissão vertical e a transfusional existem, mas são raras."},{"t":"q","n":35,"stem":"Pacientes com diabetes melito podem apresentar neuropatias com características clínicas diferentes, dependendo do tipo de fibra nervosa acometida. Quando fibras nervosas grandes são acometidas, o tipo de caraterística que os pacientes podem apresentar é","o":["perda de sensibilidade vibratória e de propriocepção.","ardência ou dor lancinante.","perda das sensações de dor e de temperatura.","perda da dor visceral.","ulceração nos pés."],"a":"E","e":"Fibras <b>grossas</b> (A-alfa e A-beta) cuidam da sensibilidade <b>vibratória e da propriocepção</b>. Fibras finas cuidam da dor e da temperatura."},{"t":"q","n":36,"stem":"Assinale a alternativa correta sobre o tratamento fisioterapêutico em pacientes com hálux valgo.","o":["O separador de dedos, utilizado de forma isolada ou associada a outros procedimentos, não apresenta efeito terapêutico.","A combinação de terapia manual, exercícios e uso de separador de dedos é eficiente no tratamento do hálux valgo.","A terapia manual consegue alcançar a correção plena dessa deformidade.","A correção plena da deformidade pode ser alcançada com terapia manual, exercícios e uso de separador de dedos.","O taping melhora a dor, mas não apresenta efeitos sobre o ângulo do hálux valgo."],"a":"B","e":"Estudos mostram que a <b>combinação</b> de terapia manual, exercícios e separador de dedos melhora a dor e o ângulo do hálux valgo, mas sem correção plena."},{"t":"q","n":37,"stem":"O fisioterapeuta que atende pacientes com doença de Parkinson realiza, entre outros recursos, cinesioterapia para tratar essa patologia. Com relação ao tipo de exercício aplicado nessa população, é correto afirmar que","o":["exercícios de reabilitação motora tradicionais são mais eficazes para melhorar a qualidade de vida de pacientes com Parkinson quando comparados a treinamentos com exercícios de resistência adaptados com instabilidade.","exercícios de reabilitação motora tradicionais são mais eficazes para diminuir o freezing quando comparados a treinamentos com exercícios de resistência adaptados com instabilidade.","treinamentos com exercícios de resistência adaptados com instabilidade são mais efetivos do que exercícios de reabilitação motora tradicionais para melhorar a qualidade de vida de pacientes com Parkinson.","treinamentos com exercícios de resistência adaptados com instabilidade são mais efetivos do que exercícios de reabilitação motora tradicionais para diminuir o freezing.","treinamentos com exercícios de resistência adaptados com instabilidade e exercícios de reabilitação motora tradicionais são igualmente eficazes para diminuir o freezing e melhorar a qualidade de vida de pacientes com Parkinson."],"a":"D","e":"Gabarito oficial: D. Exercícios resistidos com <b>instabilidade</b> se mostraram mais eficazes que a reabilitação tradicional para reduzir o <b>freezing</b>."},{"t":"q","n":38,"stem":"Um paciente com alterações respiratórias compareceu à fisioterapia para melhorar a sua condição clínica. Durante a avaliação, o fisioterapeuta verificou que o paciente apresentava uma grande quantidade de muco com baixa adesividade. A técnica mais indicada para essa condição clínica consiste em","o":["espirometria de incentivo.","exercícios de expansão torácica localizada.","inspiração em tempos com ou sem pausa inspiratória.","exercício diafragmático.","drenagem postural."],"a":"E","e":"Muito muco com <b>baixa adesividade</b> (fluido) responde bem à <b>drenagem postural</b>, que usa a gravidade."},{"t":"q","n":39,"stem":"T.D., portador de espondilite anquilosante, apresenta alterações na funcionalidade, além dos comprometimentos articulares e extra-articulares da patologia. Visando obter melhora da funcionalidade, o fisioterapeuta deve eleger como conduta","o":["decidir e escolher junto ao paciente as AVDs que deseja executar dentro de suas capacidades e associar as adaptações necessárias.","mobilização passiva, exercícios ativo-assistidos, alongamentos globais, fortalecimento muscular.","reduzir o medo de quedas, treinar equilíbrio e introduzir o uso de dispositivo auxiliar de marcha.","trabalho em educação em saúde, lidar com as expectativas do paciente em relação ao medo e às suas capacidades.","programa gradual de atividade para condicionamento individualizado, encontrar uma atividade em que o paciente se sinta seguro para realizar de forma autônoma e contínua."],"a":"A","e":"Para a funcionalidade, a conduta centrada no paciente é <b>escolher com ele as AVDs</b> que deseja fazer e adaptar o necessário."},{"t":"q","n":40,"stem":"A.J. sofreu queimaduras com óleo quente na mão e desenvolveu cicatrizes hipertróficas na região, que provocaram diminuição da amplitude de movimento de extensão de dedos e punho. Assinale a alternativa correta sobre procedimento(s) fisioterapêutico(s) que pode(m) ser adotado(s) para aumentar a amplitude de movimento desse paciente.","o":["Laserterapia de baixa intensidade.","Iontoforese com ácido acetilsalicílico.","Compressas frias.","Sonoforese com ultrassom terapêutico associado a gel à base de Cepalin® e alantoína.","Estimulação Elétrica Nervosa Transcutânea."],"a":"D","e":"A <b>sonoforese</b> com agentes cicatriciais (Cepalin®, alantoína) ajuda a remodelar a cicatriz hipertrófica e ganhar extensibilidade."},{"t":"q","n":41,"stem":"Para prevenção de trombose venosa profunda em pacientes hospitalizados, avaliados com baixo risco de desenvolver essa patologia, a conduta adequada é","o":["repouso no leito, não havendo recomendação de terapia farmacológica.","movimentação no leito e fisioterapia; administração de heparina não fracionada duas vezes ao dia.","movimentação no leito e fisioterapia; administração de heparina não fracionada quatro vezes ao dia.","repouso no leito e movimentação apenas quando a heparina não fracionada aplicada duas vezes ao dia fizer efeito.","movimentação no leito e fisioterapia, não havendo recomendação de terapia farmacológica."],"a":"E","e":"No paciente de <b>baixo risco</b> de TVP, basta deambular e se movimentar (e fazer fisioterapia). Não há indicação de profilaxia farmacológica."},{"t":"q","n":42,"stem":"Uma paciente com incontinência urinária de urgência foi avaliada pela fisioterapeuta que a atende e a profissional optou pela utilização da estimulação no nervo tibial com a TENS (Estimulação Elétrica Nervosa Transcutânea). Assinale a alternativa que apresenta corretamente o tipo de bioefeito que justifica a utilização de TENS nessa paciente.","o":["Liberação de opioides causaria diminuição da pressão do detrusor, elevação da pressão uretral e da capacidade vesical.","A TENS provocaria uma ativação da transmissão nervosa originada nos receptores muscarínicos M1 e M3, auxiliando na inibição da contração do detrusor humano.","A TENS provocaria uma inibição da atividade β-adrenérgica, facilitando o relaxamento da bexiga.","A neuromodulação realizada pela TENS é pensada para atuar nos receptores periféricos influenciando o equilíbrio entre as informações excitatórias e inibitórias para o trato urinário inferior.","A TENS promove mudanças na concentração de substância que provocam a contração da musculatura lisa."],"a":"A","e":"A estimulação do nervo tibial (TENS) faz <b>neuromodulação</b>: estímulos periféricos ajustam o equilíbrio entre aferências excitatórias e inibitórias do trato urinário inferior (raízes S2 e S3)."},{"t":"q","n":43,"stem":"Ao planejar a realização de fisioterapia aquática em idoso, os profissionais de fisioterapia têm em mente que consequências da imersão estão relacionadas à temperatura do corpo, à circulação e à intensidade dos exercícios. Essas consequências podem ser:","o":["centralização do volume sanguíneo, com o sangue sendo deslocado para os grandes vasos da caixa torácica e do coração.","diminuição do volume cardíaco, estirando o miocárdio, com melhora na capacidade de contração e aumento do débito cardíaco.","diminuição da frequência respiratória, seguida de aumento da circulação periférica.","diminuição da pressão arterial, diminuição do suprimento de sangue para os músculos.","aumento do metabolismo muscular, melhora do retorno venoso e nos rins, e diminuição do filtrado glomerular."],"a":"C","e":"A pressão hidrostática da imersão causa <b>centralização do volume sanguíneo</b> para os grandes vasos do tórax e para o coração, aumentando o volume cardíaco e o débito."},{"t":"q","n":44,"stem":"Um paciente teve uma entorse de tornozelo esquerdo há 4 dias. Apresenta um leve edema no maléolo lateral e dor na região do ligamento talofibular anterior e calcaneofibular. Ao utilizar o ultrassom terapêutico nessa fase, o bioefeito esperado é:","o":["auxiliar na degranulação dos mastócitos, causando liberação de ácido araquidônico.","produzir um colágeno maduro, de um colágeno predominantemente tipo III para um colágeno tipo I.","estimulativo, tendo como alvos primários os fibroblastos, as células endoteliais e os miofibroblastos.","otimizar a resposta inflamatória, que é essencial para que uma reparação efetiva aconteça.","modular o processo de reparo tecidual, produzindo efeito anti-inflamatório."],"a":"E","e":"Gabarito oficial: C. No 4º dia, já na fase proliferativa, o ultrassom tem efeito <b>estimulativo</b> sobre fibroblastos, células endoteliais e miofibroblastos."},{"t":"q","n":45,"stem":"O e-SUS Atenção Primária (e-SUS APS) é uma estratégia para reestruturar as informações da Atenção Primária em âmbito nacional. Assinale a alternativa correta sobre essa estratégia do Ministério da Saúde.","o":["Os profissionais deverão registrar suas ações nas fichas do e-SUS AB: ficha de atendimento individual, de procedimentos e de atividade coletiva, mas ainda não há um bloco de preenchimento exclusivo para que o profissional do NASF aponte suas ações na equipe.","A utilização do Coleta de Dados Simplificada é indicada para todos os estabelecimentos de saúde, que possuam ou não conexão de internet e computadores suficientes para os profissionais na unidade.","A versão 5.2 do Prontuário Eletrônico do Cidadão (PEC), software gratuito disponibilizado pelo Ministério da Saúde por meio da estratégia e-SUS Atenção Primária à Saúde, permite agora o uso do sistema em Unidades de Pronto Atendimento (UPA), mas ainda não está disponível para Centro de Especialidades e Policlínicas.","As fichas do e-SUS AB são iguais às do SIAB e constam as seguintes informações: fichas de cadastro domiciliar, cadastro individual, ficha de atividade coletiva, ficha de procedimentos, ficha de atendimento individual e ficha de atendimento odontológico individual.","Para utilização do Prontuário Eletrônico do Cidadão (PEC), não é necessário conexão com a internet em todos os computadores. Ela pode ser instalada em um computador mais robusto na UBS para que o sistema seja compartilhado com os demais ambientes."],"a":"C","e":"O PEC pode rodar em <b>rede local</b>: instalado num servidor da UBS, atende aos outros computadores sem precisar de internet em todos."},{"t":"q","n":46,"stem":"A higienização das mãos é um componente fundamental de biossegurança para os pacientes tratados pelos profissionais de saúde. Assinale a alternativa que apresenta corretamente uma ou mais recomendações que devem ser seguidas pelos profissionais de saúde, conforme preconizado pela Anvisa.","o":["Unhas postiças podem ser utilizadas, desde que curtas e limpas.","Evitar o uso de esmaltes nas unhas.","O esmalte pode ser utilizado, desde que as unhas estejam curtas e limpas.","Evitar utilizar anéis, pulseiras e outros adornos quando assistir o paciente, exceto aliança.","Aplicar creme hidratante nas mãos (uso individual), semanalmente, para evitar ressecamento da pele."],"a":"B","e":"A Anvisa orienta <b>evitar esmalte</b>, unhas postiças e qualquer adorno, inclusive aliança. As unhas devem ficar curtas."},{"t":"q","n":47,"stem":"O Programa Previne Brasil tem como um dos princípios:","o":["organizar as ações na atenção primária para controle das doenças infecciosas.","estruturar o calendário de vacinações nas cidades brasileiras.","estruturar as ações junto ao Ministério do Trabalho para prevenção de acidentes de trabalho.","estruturar um modelo de financiamento focado em aumentar o acesso das pessoas aos serviços da Atenção Primária.","organizar os níveis de atenção à saúde nos âmbitos nacional, estadual e municipal."],"a":"D","e":"O Previne Brasil (2019) é um <b>modelo de financiamento</b> da APS (capitação ponderada, desempenho, ações estratégicas) para ampliar o acesso."},{"t":"q","n":48,"stem":"Ao visitar uma família na sua área de adscrição, um agente comunitário de saúde constatou insegurança alimentar nessa família. Ele sugeriu que a família recorresse ao programa Bolsa Família para minimizar essa insegurança. Para que essa família possa recorrer ao programa, a renda de cada pessoa da família deve ser, no máximo, de","o":["R$ 300.","R$ 218.","R$ 350.","R$ 440.","R$ 280."],"a":"B","e":"O Bolsa Família (Lei 14.601/2023) atende famílias com renda per capita de até <b>R$ 218</b>."},{"t":"q","n":49,"stem":"O Ministério da Saúde possui uma Política Nacional de Humanização. Há um documento base para gestores e trabalhadores do SUS, que prevê","o":["apoio à construção de iniciativas individuais, solidárias e comprometidas com a produção de saúde e com a produção de sujeitos.","construção de autonomia e protagonismo de diretores de UBSs na rede do SUS.","corresponsabilidade desses sujeitos nos processos de gestão e atenção.","fortalecimento do controle de gerentes de UBSs, com caráter participativo, em todas as instâncias gestoras do SUS.","compromisso com a hierarquização das relações de trabalho e valorização dos trabalhadores da saúde, estimulando processos de educação permanente em saúde."],"a":"C","e":"A PNH defende a <b>corresponsabilidade</b> de gestores, trabalhadores e usuários nos processos de gestão e atenção."},{"t":"q","n":50,"stem":"O Programa Melhor em Casa atende pacientes que","o":["apresentam apenas dificuldades definitivas de sair do espaço da casa para chegar até uma unidade de saúde.","estejam em situações nas quais a atenção domiciliar é a mais indicada para o seu tratamento e que apresentam apenas dificuldades transitórias para sair de casa.","necessitam de cuidados médicos e enfermagem; os cuidados que necessitam de outros profissionais além desses devem ser feitos na UBS.","precisam ser visitados semanalmente ou mais; o cuidado poderá ser acompanhado por equipes específicas de atenção domiciliar.","solicitam atendimento domiciliar aos agentes comunitários de saúde, independentemente dos problemas de saúde que eles apresentam."],"a":"D","e":"Gabarito oficial: D. A atenção domiciliar do Melhor em Casa é feita por equipes específicas (EMAD/EMAP), com visitas <b>semanais ou mais frequentes</b> conforme a modalidade (AD2/AD3)."}],"total":50}];
(function(){
const KEY='fisio-vunesp-progresso-v1';
let S={};
try{S=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){S={}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));const s=document.getElementById('saved');s.classList.add('on');clearTimeout(save.t);save.t=setTimeout(()=>s.classList.remove('on'),1400)}catch(e){}};
const st=id=>(S[id]=S[id]||{});
const $=s=>document.querySelector(s);
const app=$('#app');
const L='ABCDE';
let filtro='todas',anoSel='todos';
const get=(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}};
const set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function toast(msg,act){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;
  if(act){const b=document.createElement('button');b.type='button';b.className='tact';b.textContent=act.label;b.onclick=()=>{t.hidden=true;clearTimeout(toast.t);act.fn()};t.appendChild(b)}
  t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,act?10000:2600)}
/* lixeira: guarda as respostas antes do "Recomeçar" para poder desfazer (inclusive depois de fechar o app) */
const LX='fisio-vunesp-lixeira-v1',LX_DIAS=30;
const lxAll=()=>{try{return JSON.parse(localStorage.getItem(LX)||'{}')||{}}catch(e){return {}}};
const lxSet=o=>{try{localStorage.setItem(LX,JSON.stringify(o))}catch(e){}};
const lxGet=id=>{const b=lxAll()[id];return b&&Date.now()-b.t<LX_DIAS*864e5&&Object.keys(b.d||{}).length?b:null};
const lxDel=id=>{const o=lxAll();delete o[id];lxSet(o)};
function restaurar(id){const b=lxGet(id);if(!b)return;S[id]=Object.assign({},b.d,st(id));save();lxDel(id);toast('Respostas restauradas.');renderExam(id)}

/* tema */
const tm=get('fisio-tema','');if(tm)document.documentElement.dataset.theme=tm;
$('#btnTema').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const n=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=n;set('fisio-tema',n)};

function score(e){
  const s=st(e.id);let r=0,k=0;
  e.b.forEach(b=>{if(b.t==='q'){const a=s[b.n]&&s[b.n].m;if(a){r++;if(a===b.a)k++;}}});
  return{r,k,w:r-k,t:e.total};
}
const pct=(a,b)=>b?Math.round(a*100/b):0;
const plural=(n,a,b)=>n===1?a:b;

/* ---------- início ---------- */
function renderHome(){
  $('#foot').classList.add('hide');
  let R=0,K=0,T=0;EXAMS.forEach(e=>{const s=score(e);R+=s.r;K+=s.k;T+=s.t});
  const ult=EXAMS.find(e=>e.id===get('fisio-ultima',''));
  const anos=['todos',2026,2025,2024];
  const lista=EXAMS.filter(e=>anoSel==='todos'||e.ano===anoSel);
  app.innerHTML=`
  <section class="hero">
    <div class="eyebrow">Fundação VUNESP · Fisioterapia</div>
    <h1>Provas de 2024, 2025 e 2026</h1>
    <p>${EXAMS.length} provas reais e ${T} questões com gabarito e explicação (a de Jundiaí tem gabarito próprio, não oficial). Cada resposta fica salva neste aparelho.</p>
    <div class="row">
      <div class="ring" style="--p:${pct(R,T)}"><span>${pct(R,T)}%<small>feito</small></span></div>
      <div class="hstats">
        <div><b>${R}/${T}</b><span>respondidas</span></div>
        <div><b>${K}</b><span>${plural(K,'acerto','acertos')}</span></div>
        <div><b>${R?pct(K,R)+'%':'–'}</b><span>aproveitamento</span></div>
      </div>
      ${ult?`<button type="button" class="cta" data-open="${ult.id}">Continuar: ${ult.org.split(' – ')[0].replace('Prefeitura de ','')} →</button>`:''}
    </div>
  </section>
  <div class="sec-t"><h2>Provas</h2>
    <div class="seg" role="group" aria-label="Filtrar por ano">${anos.map(a=>`<button type="button" aria-pressed="${anoSel===a}" data-ano="${a}">${a==='todos'?'Todas':a}</button>`).join('')}</div>
  </div>
  <div class="grid">${lista.map(e=>{const s=score(e);return `
    <button type="button" class="card" data-open="${e.id}">
      <span class="top"><span class="yr y${e.ano}">${e.ano}</span><span class="mini" style="--p:${pct(s.k,s.t)}" title="Acertos sobre o total"><span>${pct(s.r,s.t)}%</span></span></span>
      <span class="org">${e.org}</span>
      <span class="meta">${e.cargo}<br>${e.data} · ${e.total} questões</span>
      <span class="bar"><i class="k" style="width:${pct(s.k,s.t)}%"></i><i class="w" style="width:${pct(s.w,s.t)}%"></i></span>
      <span class="prog"><span>${s.r?`${s.r} de ${s.t} respondidas`:'Não iniciada'}</span><span>${s.r?`${s.k} ${plural(s.k,'acerto','acertos')} · ${pct(s.k,s.r)}%`:''}</span></span>
    </button>`}).join('')}</div>
  <section class="panel">
    <h3>Como funciona</h3>
    <ul class="tips">
      <li><b>Responda e aprenda</b>Toque numa alternativa: verde é acerto, vermelho é erro, e a explicação aparece na hora.</li>
      <li><b>Salvo automaticamente</b>Feche a página quando quiser. Ao voltar, tudo continua de onde parou.</li>
      <li><b>Revise o que errou</b>Use o filtro “Erradas” ou o mapa de questões para ir direto ao ponto.</li>
      <li><b>Leve para outro aparelho</b>Exporte o progresso em arquivo e importe no celular ou no notebook.</li>
    </ul>
    <div class="row-btns"><button class="btn" type="button" id="exp">⧉ Copiar código do progresso</button><button class="btn" type="button" id="imp">⬆ Importar progresso</button></div>
    <div id="impBox" class="hide"><textarea class="code" id="impTxt" placeholder="Cole aqui o código do progresso"></textarea><div class="row-btns"><button class="btn" type="button" id="impGo">Importar código colado</button></div></div>
  </section>
  <p class="end">Fontes: cadernos de prova e gabaritos oficiais da Fundação VUNESP, do acervo do QConcursos. Questões que dependem de imagem (charge, figura, fórmula) estão sinalizadas e têm link para o PDF original. As explicações são material de apoio. Confira a lei seca e a bibliografia do edital, e veja no site da VUNESP se alguma questão foi anulada.</p>`;
  app.querySelectorAll('[data-ano]').forEach(b=>b.onclick=()=>{anoSel=b.dataset.ano==='todos'?'todos':+b.dataset.ano;renderHome()});
  app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{location.hash='#'+b.dataset.open});
  $('#exp').onclick=()=>{const code=JSON.stringify(S);const box=$('#impBox'),ta=$('#impTxt');
    const fallback=()=>{box.classList.remove('hide');ta.value=code;ta.select();toast('Código selecionado. Copie e guarde.')};
    try{navigator.clipboard.writeText(code).then(()=>toast('Código copiado. Cole num lugar seguro.'),fallback)}catch(e){fallback()}};
  $('#imp').onclick=()=>{$('#impBox').classList.toggle('hide');$('#impTxt').focus()};
  $('#impGo').onclick=()=>{try{const d=JSON.parse($('#impTxt').value);if(!d||typeof d!=='object'||Array.isArray(d))throw 0;S=d;save();toast('Progresso importado.');renderHome()}catch(e){toast('Código inválido. Cole o código completo copiado antes.')}};
}

/* ---------- prova ---------- */
function qHTML(e,b){
  const s=st(e.id)[b.n]||{};const m=s.m,rev=!!m||s.v;
  const cls=m?(m===b.a?'ok':'bad'):'';
  return `<article class="q ${cls}" id="q-${e.id}-${b.n}" data-n="${b.n}">
   <div class="qh"><span class="qn">${String(b.n).padStart(2,'0')}</span>${b.img?'<span class="tag img">imagem no caderno</span>':''}${m?(m===b.a?'<span class="tag ok">✓ acertou</span>':'<span class="tag bad">✕ errou</span>'):''}</div>
   <div class="stem">${b.stem}</div>
   ${b.o.map((o,i)=>{const l=L[i];let c='op';if(rev){if(l===b.a)c+=m===l?' right':' correct';else if(m===l)c+=' wrong';else c+=' dim';}
     return `<button type="button" class="${c}" data-l="${l}" ${rev?'disabled':''} aria-label="Alternativa ${l}"><b>${l}</b><span>${o}</span></button>`}).join('')}
   <div class="acts">${!rev?'<button class="lk" type="button" data-act="ver">Ver resposta</button>':''}${rev?'<button class="lk" type="button" data-act="refazer">↺ Refazer</button>':''}${b.img?`<a class="lk" href="${e.pdf}" target="_blank" rel="noopener">Abrir PDF da prova ↗</a>`:''}</div>
   ${rev?`<div class="exp"><span class="g">${m?(m===b.a?'✅':'❌'):'💡'} Resposta: ${b.a}${m&&m!==b.a?` · você marcou ${m}`:''}</span>${b.e}</div>`:''}
  </article>`;
}
function visible(e,b){
  const m=(st(e.id)[b.n]||{}).m;
  if(filtro==='nao')return!m;if(filtro==='erradas')return m&&m!==b.a;if(filtro==='certas')return m&&m===b.a;return true;
}
function mapHTML(e){
  const s=st(e.id);let out='';
  e.b.forEach(b=>{
    if(b.t==='h'){out+=`<span class="ms">${b.x}</span>`;return}
    if(b.t!=='q')return;const x=s[b.n]||{};const c=x.m?(x.m===b.a?'ok':'bad'):(x.v?'seen':'');
    out+=`<button type="button" class="${c}" data-go="${b.n}" aria-label="Questão ${b.n}">${b.n}</button>`;
  });return out;
}
function renderExam(id){
  const e=EXAMS.find(x=>x.id===id);if(!e)return renderHome();
  set('fisio-ultima',id);
  const C={todas:e.total,nao:0,erradas:0,certas:0};const s=st(e.id);
  e.b.forEach(b=>{if(b.t!=='q')return;const m=(s[b.n]||{}).m;if(!m)C.nao++;else if(m===b.a)C.certas++;else C.erradas++});
  let out=`<div class="ehead">
    <button class="back" type="button" id="voltar">← Todas as provas</button>
    <div><span class="yr y${e.ano}">${e.ano}</span></div>
    <h1>${e.org}</h1>
    <div class="meta"><span>${e.cargo}</span><span>·</span><span>${e.data}</span><span>·</span><span>${e.total} questões</span>${e.pdf?`<a class="lk" href="${e.pdf}" target="_blank" rel="noopener">PDF original ↗</a>`:''}</div>
    ${e.nota?`<div class="note">${e.nota}</div>`:''}
  </div>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Filtrar questões">${[['todas','Todas'],['nao','A fazer'],['erradas','Erradas'],['certas','Certas']].map(([k,t])=>`<button type="button" aria-pressed="${filtro===k}" data-f="${k}">${t} <span style="opacity:.6" data-c="${k}">${C[k]}</span></button>`).join('')}</div>
    <button class="ib" type="button" id="btnMap" aria-label="Mapa de questões" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
  </div>
  <div class="navmap" id="navmap">${mapHTML(e)}</div>`;
  const lx=lxGet(e.id);
  if(lx){const d=new Date(lx.t),n=Object.keys(lx.d).length;out+=`<div class="lxbar" role="status"><span>${n} ${plural(n,'resposta apagada','respostas apagadas')} em ${d.toLocaleDateString('pt-BR')} às ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}.</span><span class="lxb"><button type="button" class="btn" id="lxRest">Restaurar</button><button type="button" class="btn ghost" id="lxDesc">Descartar</button></span></div>`}
  let pend='',shown=0;
  e.b.forEach(b=>{
    if(b.t==='h'){out+=`<h3 class="sec">${b.x}</h3>`;pend='';return}
    if(b.t==='txt'){if(filtro==='todas')out+=`<div class="txt">${b.x}</div>`;else pend=`<div class="txt">${b.x}</div>`;return}
    if(!visible(e,b))return;
    if(pend){out+=pend;pend=''}
    out+=qHTML(e,b);shown++;
  });
  if(!shown)out+=`<p class="empty">Nenhuma questão neste filtro. 🎉</p>`;
  app.innerHTML=out;
  app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{filtro=b.dataset.f;renderExam(id);window.scrollTo(0,0)});
  $('#voltar').onclick=()=>{location.hash=''};
  if(lx){$('#lxRest').onclick=()=>restaurar(id);$('#lxDesc').onclick=ev=>{const b=ev.currentTarget;if(!b.dataset.arm){b.dataset.arm='1';b.textContent='Toque de novo';return}lxDel(id);renderExam(id)}}
  $('#btnMap').onclick=ev=>{const m=$('#navmap');const o=m.classList.toggle('open');ev.currentTarget.setAttribute('aria-expanded',o)};
  $('#navmap').onclick=ev=>{const g=ev.target.closest('[data-go]');if(!g)return;let el=document.getElementById(`q-${id}-${g.dataset.go}`);
    if(!el){filtro='todas';renderExam(id);el=document.getElementById(`q-${id}-${g.dataset.go}`)}
    $('#navmap').classList.remove('open');el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')};
  app.onclick=ev=>{
    const q=ev.target.closest('.q');if(!q)return;const n=+q.dataset.n;const b=e.b.find(x=>x.t==='q'&&x.n===n);
    const op=ev.target.closest('.op');const act=ev.target.closest('[data-act]');
    const redraw=()=>{q.outerHTML=qHTML(e,b);$('#navmap').innerHTML=mapHTML(e);foot(e)};
    if(op&&!op.disabled){st(e.id)[n]={m:op.dataset.l,t:Date.now()};save();redraw()}
    else if(act&&act.dataset.act==='ver'){st(e.id)[n]={v:1};save();redraw()}
    else if(act&&act.dataset.act==='refazer'){delete st(e.id)[n];save();redraw()}
  };
  foot(e);
}
function foot(e){
  const s=score(e);$('#foot').classList.remove('hide');
  const cc={todas:s.t,nao:s.t-s.r,erradas:s.w,certas:s.k};document.querySelectorAll('[data-c]').forEach(x=>x.textContent=cc[x.dataset.c]);
  $('#score').innerHTML=`<div style="display:flex;justify-content:space-between;gap:8px;align-items:baseline"><span><b>${s.k}</b> ${plural(s.k,'acerto','acertos')} em <b>${s.r}</b> · ${s.r}/${s.t}</span><span class="pc">${s.r?pct(s.k,s.r)+'%':'–'}</span></div><span class="bar"><i class="k" style="width:${pct(s.k,s.t)}%"></i><i class="w" style="width:${pct(s.w,s.t)}%"></i></span>`;
  const rb=$('#btnReset');rb.innerHTML='↺ <span>Recomeçar</span>';rb.dataset.arm='';
  rb.onclick=()=>{if(rb.dataset.arm){const cur=st(e.id);if(Object.keys(cur).length){const o=lxAll();o[e.id]={t:Date.now(),d:JSON.parse(JSON.stringify(cur))};lxSet(o)}
      S[e.id]={};save();renderExam(e.id);if(lxGet(e.id))toast('Respostas desta prova apagadas.',{label:'Desfazer',fn:()=>restaurar(e.id)});else toast('Nada para apagar.');return}
    rb.dataset.arm='1';rb.innerHTML='Toque de novo para apagar';clearTimeout(rb.t);rb.t=setTimeout(()=>{rb.dataset.arm='';rb.innerHTML='↺ <span>Recomeçar</span>'},3500)};
}

function route(){const id=location.hash.replace(/^#\/?/,'');if(id){filtro='todas';renderExam(id)}else renderHome();window.scrollTo(0,0)}
$('#home').onclick=()=>{location.hash=''};
window.addEventListener('hashchange',route);
route();
