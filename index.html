as são separadas pela <b>barra invertida \\</b>. A barra normal “/” é usada em endereços de internet e no Linux."},{"t":"q","n":17,"stem":"<p>Em um documento do MS-Word 365, em sua configuração padrão, é possível inserir espaços reservados para dados ou informações que podem ser modificadas automaticamente. Desta forma, em vez de digitar um texto estático, o usuário insere um código determinado que instrui o programa a buscar, calcular ou exibir informações específicas, como a data atual, o nome do arquivo ou o número da página. Esses espaços reservados são conhecidos como</p>","o":["Campos.","Estilos.","Fontes.","Formas.","Links."],"a":"A","e":"<b>Campos</b> (Inserir › Partes Rápidas › Campo) são códigos como DATE, FILENAME e PAGE, que o Word atualiza sozinho. Estilos são formatação, Fontes são tipos de letra e Formas são desenhos."},{"t":"q","n":18,"stem":"<p>Um usuário do MS-PowerPoint 2016, em sua configuração padrão, deseja que a apresentação que está preparando seja iniciada diretamente no modo \"Apresentação de Slides\" quando o correspondente arquivo é aberto. Para tanto, o referido arquivo deverá ser salvo com a extensão</p>","o":[".pdfx",".potx",".ppsx",".pptm",".pptx"],"a":"C","e":"<b>.ppsx</b> é o formato “Apresentação de Slides do PowerPoint” e abre direto no modo apresentação (o “s” é de <i>show</i>). As outras extensões: .pptx é a apresentação normal, .pptm é a apresentação com macros, .potx é o modelo e .pdfx não é formato do PowerPoint."},{"t":"q","n":19,"stem":"<p>As células de uma planilha que está sendo preparada com a ajuda do programa MS-Excel 365, em sua configuração padrão, foram preenchidas inicialmente conforme mostrado a seguir:</p>\n<table class=\"xl\"><tr><th></th><th>A</th><th>B</th><th>C</th></tr>\n<tr><th>1</th><td>Melancia</td><td>a</td><td></td></tr>\n<tr><th>2</th><td>Jenipapo</td><td>e</td><td></td></tr>\n<tr><th>3</th><td>Goiaba</td><td>i</td><td></td></tr>\n<tr><th>4</th><td>Figo</td><td>o</td><td></td></tr>\n<tr><th>5</th><td>Cupuaçu</td><td>u</td><td></td></tr>\n<tr><th>6</th><td></td><td></td><td></td></tr></table>\n<p>Em seguida, a expressão =LOCALIZAR(B1;A1) foi digitada na célula C1. Prosseguindo, a célula C1 foi selecionada com um clique do botão principal do mouse e copiada para as células C2 a C5. Finalmente, a expressão =MULT(C1:C3)/MÉDIA(C1:C5) foi inserida na célula C6. O valor numérico obtido na célula C6 é</p>","o":["4.","5.","6.","7.","8."],"a":"E","e":"LOCALIZAR devolve a posição da letra dentro da palavra:\n<ul>\n<li>C1: “a” em Melancia (M-e-l-<b>a</b>) = 4.</li>\n<li>C2: “e” em Jenipapo (J-<b>e</b>) = 2.</li>\n<li>C3: “i” em Goiaba (G-o-<b>i</b>) = 3.</li>\n<li>C4: “o” em Figo (F-i-g-<b>o</b>) = 4.</li>\n<li>C5: “u” em Cupuaçu (C-<b>u</b>) = 2.</li>\n</ul>\nMULT(C1:C3) = 4 × 2 × 3 = 24 e MÉDIA(C1:C5) = 15 ÷ 5 = 3. Resultado: 24 ÷ 3 = <b>8</b>."},{"t":"q","n":20,"stem":"<p>Um servidor público necessita utilizar um computador compartilhado entre vários usuários para acessar Internet. Com o objetivo de preservar sua privacidade e evitar que outras pessoas vejam os sites que visitou ou acessem suas contas, ele usa o navegador instalado no computador em um modo de operação que apaga automaticamente o histórico de navegação, cookies e dados de formulários quando a janela é fechada. Esse modo de operação do navegador é conhecido como</p>","o":["Reservado.","Privado.","Particular.","Íntimo.","Exclusivo."],"a":"B","e":"É a <b>navegação privada</b>: “Janela Privativa” no Safari e no Firefox, “InPrivate” no Edge, “Anônima” no Chrome. Ela apaga histórico, cookies e dados de formulário quando a janela é fechada."},{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":21,"stem":"<p>Com base nas Metas Internacionais de Segurança do Paciente aplicáveis ao ambiente hospitalar e de reabilitação, qual das seguintes condutas representa uma intervenção correta na prevenção de quedas durante a assistência fisioterapêutica?</p>","o":["O uso de contenção física contínua é a principal medida recomendada pelos protocolos para prevenir a queda do leito em todas as faixas etárias.","A avaliação do risco de queda deve ser feita exclusivamente na admissão do paciente, não necessitando de reavaliações diárias nos setores de internação.","O fisioterapeuta deve orientar o paciente a levantar-se vagarosamente, permanecendo sentado com os pés apoiados no chão por pelo menos 5 minutos antes de sair da cama.","A identificação visual do risco de queda do paciente no ambiente hospitalar deve ser realizada preferencialmente pela colocação de uma pulseira vermelha.","A queda é definida como a descida intencional do paciente ao chão durante o treinamento de marcha, que resulta em lesão de partes moles; por isso, o treino deve ser feito com dispositivo auxiliar."],"a":"C","e":"O protocolo de prevenção de quedas (meta 6) orienta <b>levantar em etapas</b>: deitado, depois sentado com os pés apoiados, aguardar e só então ficar em pé. Assim se evita a hipotensão postural. Os erros das outras:\n<ul>\n<li>A: contenção física <b>não</b> é recomendada; aumenta agitação e lesões.</li>\n<li>B: o risco deve ser reavaliado diariamente e sempre que o quadro mudar.</li>\n<li>D: a cor da pulseira depende da instituição; muitas usam amarelo, e o vermelho costuma indicar alergia.</li>\n<li>E: queda é um deslocamento <b>não intencional</b>.</li>\n</ul>"},{"t":"q","n":22,"stem":"<p>A colaboração interprofissional é uma estratégia fundamental para garantir a integralidade do cuidado na Atenção Primária à Saúde (APS). De acordo com os preceitos do trabalho interprofissional e da humanização, é correto afirmar que</p>","o":["a colaboração interprofissional caracteriza-se por objetivos comuns, clareza de papéis, interdependência e corresponsabilização entre os profissionais da equipe.","a abordagem adotada deve focar na subordinação dos demais profissionais da saúde ao núcleo de saber médico, que é quem centraliza as decisões sobre os projetos terapêuticos.","espaços de comunicação formal, como as reuniões de equipe, são desnecessários e devem ser desencorajados, visto que a comunicação informal isolada otimiza o tempo clínico.","o trabalho em equipe foca estritamente na divisão fragmentada de tarefas, em que cada profissional atua de forma isolada em seu consultório, para garantir a produtividade.","o papel das lideranças na APS deve ser autocrático, limitando a participação técnica dos trabalhadores para evitar conflitos de poder nos núcleos de saberes."],"a":"A","e":"A colaboração interprofissional (Peduzzi, D’Amour) se apoia em <b>objetivos comuns, clareza de papéis, interdependência, corresponsabilização</b> e comunicação, que inclui reuniões de equipe. As outras alternativas descrevem o modelo fragmentado, hierárquico e médico-centrado que se quer superar."},{"t":"q","n":23,"stem":"<p>Durante o atendimento fisioterapêutico de um paciente internado com diagnóstico confirmado de tuberculose pulmonar bacilífera, o fisioterapeuta deve adotar, além das precauções padrão, medidas específicas de isolamento. Assinale a alternativa que indica corretamente o tipo de precaução e o equipamento de proteção individual (EPI) adequados para essa situação.</p>","o":["Precaução de gotículas; uso obrigatório de máscara cirúrgica pelo profissional e pelo paciente durante todo o tempo de internação.","Precaução de contato; uso de luvas e avental de manga longa impermeável, sendo dispensada a proteção respiratória.","Precaução por aerossóis; uso obrigatório de máscara tipo N95 ou PFF2 pelo profissional de saúde durante todo o tempo em que estiver no quarto.","Precaução por aerossóis; uso obrigatório de máscara cirúrgica pelo profissional e máscara N95 de forma contínua pelo paciente.","Precaução padrão; higienização rigorosa das mãos com álcool 70% e uso de protetor facial (face shield) durante a ausculta pulmonar."],"a":"C","e":"Tuberculose pulmonar se transmite por <b>aerossóis</b>. O profissional usa <b>N95/PFF2</b> o tempo todo dentro do quarto, de preferência com pressão negativa e porta fechada. O <b>paciente</b> usa máscara <b>cirúrgica</b> quando precisa sair do quarto. A alternativa D inverte essas máscaras. Para memorizar, as doenças de aerossóis são TB, sarampo e varicela."},{"t":"q","n":24,"stem":"<p>A reabilitação profissional, no âmbito do Instituto Nacional do Seguro Social (INSS), é o serviço voltado ao trabalhador afastado por motivo de doença ou acidente. Em relação à conceituação e à base legal desse processo, é correto afirmar que</p>","o":["a reabilitação profissional exige um tempo mínimo de carência contributiva para que o segurado em gozo de auxílio-doença possa ter acesso ao benefício.","o processo compreende as funções básicas de avaliação do potencial laborativo, orientação e acompanhamento da programação, articulação com a comunidade e pesquisa de fixação no mercado de trabalho.","para os segurados em gozo de auxílio-doença, quando a reabilitação for prescrita pela perícia, o programa assume caráter optativo, sendo a recusa um direito do trabalhador sem prejuízo do benefício.","a equipe responsável pela reabilitação atua na emissão de laudos de aposentadoria por invalidez, sendo proibido o encaminhamento do trabalhador para a realização de cursos profissionalizantes.","a reabilitação profissional tem como foco as condições clínicas biológicas do trabalhador, ignorando o seu nível de escolaridade, a sua faixa etária e o mercado de trabalho restrito."],"a":"B","e":"O Decreto 3.048/99 (art. 137) lista as funções básicas: <b>avaliação do potencial laborativo; orientação e acompanhamento da programação profissional; articulação com a comunidade; e pesquisa da fixação no mercado de trabalho</b>. Os erros das outras:\n<ul>\n<li>A: a reabilitação não exige carência.</li>\n<li>C: para o segurado em auxílio-doença, ela é <b>obrigatória</b>, e a recusa pode suspender o benefício.</li>\n<li>D: o INSS oferece cursos, órteses e próteses.</li>\n<li>E: escolaridade, idade e mercado de trabalho são considerados.</li>\n</ul>"},{"t":"q","n":25,"stem":"<p>A Classificação Internacional de Funcionalidade, Incapacidade e Saúde (CIF) transformou os paradigmas de avaliação em saúde. Sobre os conceitos abordados por essa classificação, assinale a alternativa correta.</p>","o":["A CIF é um instrumento concebido e aplicável para a população com deficiências ou incapacidades graves congênitas, sendo pouco sensível em deficiências adquiridas.","Os Fatores Ambientais, componentes da CIF, englobam as atitudes, o mundo físico criado pelo homem, as políticas sociais e as barreiras ou os facilitadores que impactam a funcionalidade.","A “Deficiência” (Impairment), no modelo da CIF, é o termo que define especificamente os problemas sociais e o preconceito que limitam o envolvimento de uma pessoa na vida real.","O construto “Desempenho” (Performance) reflete a capacidade máxima e isolada de um indivíduo de realizar tarefas em um ambiente laboratorial idealmente padronizado e controlado.","O modelo da CIF exclui as funções mentais e psicológicas do escopo de Funções do Corpo, categorizando-as isoladamente sob a rubrica restrita dos Fatores Pessoais intrínsecos."],"a":"B","e":"<b>Fatores ambientais</b> são o ambiente físico, social e de atitudes: produtos e tecnologia, ambiente natural e construído, apoio e relacionamentos, atitudes, serviços, sistemas e políticas. Eles atuam como <b>barreiras ou facilitadores</b>. Os erros das outras:\n<ul>\n<li>A: a CIF é <b>universal</b>, vale para qualquer pessoa.</li>\n<li>C: “deficiência” é problema na função ou estrutura do <b>corpo</b>.</li>\n<li>D: isso define <b>capacidade</b> (ambiente padronizado). <b>Desempenho</b> é o que a pessoa faz no ambiente habitual.</li>\n<li>E: as funções mentais (b1) fazem parte das Funções do Corpo.</li>\n</ul>"},{"t":"q","n":26,"stem":"<p>A osteoartrite é uma doença crônica e degenerativa que cursa com dor e limitação da função articular. O uso de agentes físicos mecânicos e eletromagnéticos é comum na reabilitação traumato-ortopédica. Em relação ao uso da fotobiomodulação (laser) e do ultrassom terapêutico, assinale a alternativa correta.</p>","o":["O exercício físico de alta intensidade isolado é suficiente para restaurar a cartilagem articular, sendo a aplicação de agentes como o laser e o ultrassom dispensável nesses casos.","O uso isolado de ultrassom é contraindicado na vigência de espasmos musculares, devendo-se utilizar estritamente a crioterapia.","O ultrassom e a fotobiomodulação, quando associados de forma sinérgica, promovem analgesia, ação anti-inflamatória e melhora da funcionalidade, minimizando os impactos nocivos de possíveis microlesões originadas no exercício.","A terapia combinada com o equipamento que une laser e ultrassom deve ser aplicada mantendo o transdutor de modo totalmente estacionário sobre o local da dor.","O ultrassom pulsado atua promovendo predominantemente os mesmos efeitos térmicos que o modo contínuo, não havendo base fisiológica para diferenciar a aplicação dos modos na doença aguda ou crônica."],"a":"C","e":"A associação <b>laser + ultrassom</b>, junto com o exercício, tem efeito sinérgico: analgesia, ação anti-inflamatória e melhora da função. Os erros das outras:\n<ul>\n<li>A: exercício não “restaura” cartilagem.</li>\n<li>B: o ultrassom pode ser usado no espasmo muscular.</li>\n<li>D: o transdutor deve ficar <b>em movimento</b>, para evitar pontos quentes e ondas estacionárias.</li>\n<li>E: o ultrassom pulsado é predominantemente <b>atérmico</b> (indicado na fase aguda), e o contínuo é térmico.</li>\n</ul>"},{"t":"q","n":27,"stem":"<p>A avaliação de um paciente vítima de lesão medular exige grande acurácia semiológica para a determinação do diagnóstico cinético funcional. O mapeamento da sensibilidade e da função motora é fundamental. Tendo em vista os preceitos de semiologia e os escores neurológicos na lesão medular, assinale a alternativa correta.</p>","o":["A avaliação da propriocepção e dor profunda é compulsória e participa ativamente da pontuação numérica que compõe o escore final de determinação do nível neurológico.","Testes de toque leve ou “alfinetadas”, mesmo quando realizados sem padronização, mostraram-se as ferramentas mais fidedignas para analisar a percepção cutânea de lesões centrais.","O teste de sensibilidade esfincteriana é contraindicado devido ao fato de o toque induzir disautonomia e choque medular de forma incontrolável.","Pacientes com lesão medular em fase hospitalar têm contraindicação absoluta a exercícios de cinesioterapia passivos ou ativos por elevarem o tônus de forma irreversível.","O exame clínico padronizado mensura a sensibilidade tátil e dolorosa em vinte e oito dermátomos de ambos os lados, sendo o escore de “0” para ausente, “1” para alterada e “2” para normal, sendo ainda obrigatória a avaliação do esfíncter anal externo."],"a":"E","e":"É o exame padronizado da ASIA (ISNCSCI): toque leve e picada nos <b>28 dermátomos</b> (C2 a S4-5) de cada lado, com nota <b>0, 1 ou 2</b>. A avaliação anal (sensação anal profunda e contração voluntária do esfíncter) é <b>obrigatória</b>, porque define se a lesão é completa (ASIA A) ou incompleta. Propriocepção e dor profunda são opcionais e não entram no escore (A). A cinesioterapia precoce é indicada (D)."},{"t":"q","n":28,"stem":"<p>O Conceito Neuroevolutivo Bobath tem vasta aplicação na avaliação e reabilitação da criança com disfunções no sistema nervoso central, como na paralisia cerebral. Sobre as orientações do manuseio e o emprego de pontos-chave de controle, assinale a alternativa correta.</p>","o":["Na facilitação, os pontos-chave de controle devem atuar com pressão máxima sobre o ventre muscular hipertônico para inibir os reflexos através dos fusos musculares.","Quanto maior for a independência e o controle motor da criança, mais distais devem ser os pontos-chave manuseados pelo fisioterapeuta.","O princípio orientador dita que o tratamento deve focar unicamente o segmento do corpo isolado que apresenta hipertonia, ignorando o controle postural e global do indivíduo.","O uso do conceito neuroevolutivo Bobath tem seu sucesso atrelado à contenção rígida do tronco, forçando a imobilidade completa da criança por 24 horas.","O uso da abordagem exige que um paciente com severa falta de controle da cabeça e do tronco seja manipulado por pontos-chave distais, como o punho e tornozelo."],"a":"B","e":"No Bobath, quanto <b>menos controle</b>, mais <b>proximais</b> os pontos-chave (tronco, ombros, pelve), porque o terapeuta dá mais suporte. Conforme a criança ganha controle, os pontos ficam <b>mais distais</b> (mãos, pés) e o terapeuta ajuda menos. A alternativa E inverte essa lógica."},{"t":"q","n":29,"stem":"<p>No contexto da fisioterapia esportiva e na reabilitação, o estresse advindo do exercício físico pode acarretar a chamada dor muscular tardia pós-exercício (DOMS). Compreender a natureza dessa dor é primordial para traçar diretrizes adequadas no ganho de desempenho. Qual das seguintes afirmações condiz com as bases fisiológicas da DOMS?</p>","o":["A manifestação de dor máxima no paciente decorre imediatamente após o término do exercício, extinguindo-se sem sequelas nas primeiras 8 horas subsequentes.","É uma resposta de dor que envolve primordialmente uma lesão nervosa isquêmica associada a rompimentos totais de fibras do tecido conectivo.","Indivíduos submetidos a altas cargas de condicionamento estão imunes à DOMS, visto que o ácido lático é completamente inibido por fotorreceptores.","As microlesões no tecido muscular originadas no estresse do movimento geram ação inflamatória e estresse oxidativo, e a dor atinge comumente o seu ápice no período entre 24 e 72 horas.","O alongamento estático pós-exercício impede integralmente a degeneração inflamatória associada à DOMS, bloqueando as vias da dor do estresse oxidativo."],"a":"D","e":"A DOMS vem de <b>microlesões</b> (principalmente após exercício excêntrico), com inflamação e estresse oxidativo, e tem <b>pico entre 24 e 72 h</b>. A dor não é imediata (A), não envolve ruptura total (B), não é causada por ácido lático e ninguém fica imune a ela (C), e o alongamento não a impede (E)."},{"t":"q","n":30,"stem":"<p>Em uma unidade de terapia intensiva neonatal (UTIN), o manejo clínico terapêutico a bebês pré-termo difere do oferecido a bebês a termo. O modelo do processo terapêutico no neonato compreende</p>","o":["a imposição de elevação de frequência respiratória e de ritmo cardiovascular, pois são marcos que auxiliam a adaptação ao esforço e estimulam o desenvolvimento motor.","o conceito de modulação comportamental fisiológica pela restrição ou enrolamento (swaddling), por meio de cobertores do tronco e postura fletida, aumenta o contato tátil de sucção e promove conforto de alerta reduzindo a hiperexcitação instável.","o princípio da estimulação genérica precoce e do manuseio sensorial profundo e contínuo da dor e sons na UTIN deve assegurar o alinhamento total hiperestendido da cadeia motora dorsal infantil, protegendo o neonato.","a indicação de exercícios de estimulação sensorial para o neonato prematuro de baixo peso (abaixo das 30 semanas) envolve o uso de hidroterapia diária sob feixes de irradiação estroboscópica ou infravermelha.","a imobilidade mantida pelo alinhamento forçado e posicionado em abdução de ombros prolongada permite à criança a resposta a posições na linha média da mão ao corpo."],"a":"B","e":"No cuidado desenvolvimental do prematuro, a <b>contenção ou enrolamento (swaddling)</b> e a <b>postura em flexão</b>, com mãos na linha média, reduzem o estresse, organizam o comportamento e favorecem a autorregulação e a sucção. As demais propõem estímulos excessivos, hiperextensão ou abdução prolongada, o oposto do recomendado."},{"t":"q","n":31,"stem":"<p>Para predizer riscos de quedas e avaliar o nível de mobilidade de idosos e pacientes neurológicos na Atenção Básica e Reabilitação, diversas escalas validadas são empregadas. É correto afirmar que</p>","o":["a Escala de Equilíbrio de Berg (EEB) avalia 14 tarefas baseadas na manutenção e mudança de posições, totalizando uma pontuação máxima de 100 pontos, em que escores baixos indicam excelência no equilíbrio.","o teste Timed Up and Go (TUG) consiste em observar o tempo que o idoso leva para levantar-se da cadeira, caminhar 10 metros de forma acelerada, retornar e deitar-se em uma maca clínica.","a escala POMA (Escala de Tinetti) avalia tarefas de equilíbrio e marcha; escores finais elevados representam excelente desempenho, enquanto pontuações baixas indicam alto risco de quedas.","o Dynamic Gait Index (DGI) avalia exclusivamente a marcha em superfície plana e retilínea sem obstáculos, sendo ineficaz para aferir a capacidade do idoso de realizar giros ou mudar a velocidade do passo.","o Índice de Barthel Modificado é um instrumento de avaliação focado primordialmente na amplitude de movimento passiva das extremidades e nos reflexos tendinosos profundos do idoso frágil."],"a":"C","e":"A <b>Tinetti (POMA)</b> soma equilíbrio (16 pontos) e marcha (12 pontos), total de 28. Nota alta indica bom desempenho, e abaixo de cerca de 19 o risco de quedas é alto. Os erros das outras:\n<ul>\n<li>A: a Berg tem 14 tarefas, mas o máximo é <b>56</b>, e nota alta é melhor.</li>\n<li>B: no TUG, o paciente levanta, anda <b>3 m</b>, volta e <b>senta</b>.</li>\n<li>D: o DGI inclui mudança de velocidade, giros, obstáculos e escadas.</li>\n<li>E: o Barthel avalia <b>AVDs</b>.</li>\n</ul>"},{"t":"q","n":32,"stem":"<p>A eletroestimulação apresenta papel de destaque no tratamento das disfunções do assoalho pélvico, como a incontinência urinária de esforço (IUE) e a hiperatividade do detrusor. De acordo com as diretrizes e mecanismos da eletroterapia nesses casos, assinale a alternativa correta.</p>","o":["O estímulo elétrico visa inibir o córtex cerebral de forma irreversível, substituindo definitivamente a via eferente do nervo pudendo para manter o fechamento uretral contínuo.","O uso da eletroterapia é estritamente contraindicado caso a paciente já possua Incontinência de urgência associada, pois o fluxo elétrico aumenta invariavelmente os espasmos vesicais.","A aplicação intravaginal de um dispositivo emitindo correntes elétricas de baixa voltagem, com frequências geralmente entre 10 e 50 Hz, induz contrações e aumenta o aporte sensorial, facilitando a conscientização da musculatura pélvica.","Os efeitos curativos do FES (functional electrical stimulation) na pélvis dependem da geração de correntes contínuas de alta frequência (acima de 10.000 Hz) para a termólise dos músculos hipotônicos.","A corrente russa promove o relaxamento reflexo imediato das fibras musculares do assoalho pélvico, sendo a melhor indicação para inibir a contração voluntária antes da penetração em quadros de anorgasmia."],"a":"C","e":"A eletroestimulação <b>intravaginal</b> de baixa voltagem e <b>10 a 50 Hz</b> produz contração e propriocepção. A faixa mais baixa (cerca de 10 a 20 Hz) inibe o detrusor na urgência, e a mais alta (cerca de 35 a 50 Hz) fortalece na IUE. A eletroterapia é indicada também na incontinência de urgência (B), não causa termólise (D) e a corrente russa é de fortalecimento, não de relaxamento (E)."},{"t":"q","n":33,"stem":"<p>Na avaliação funcional fisioterapêutica esportiva e ortopédica, diversos testes buscam analisar a estabilidade dinâmica, a força e o equilíbrio dos pacientes. Com base nos testes funcionais para membros superiores e inferiores, assinale a alternativa correta.</p>","o":["O Star Excursion Balance Test (SEBT) é um teste dinâmico que avalia o equilíbrio, demandando força, flexibilidade e propriocepção, sendo útil na liberação de indivíduos para a prática esportiva.","O Drop Vertical Jump Test é o teste padrão-ouro para aferir a mobilidade torácica, medindo o ângulo de inclinação lateral após um salto em profundidade.","O teste Closed Kinetic Chain Upper Extremity Stability (CKCUES) mensura o desempenho do membro superior em cadeia cinética aberta por meio de arremessos sucessivos de uma bola medicinal contra a parede.","No teste do salto lateral (side hop test), o paciente deve realizar dez saltos bipodais sobre duas linhas com um metro de distância entre si, sem que o tempo de execução seja cronometrado.","O Y Balance Test adaptado para membros superiores exige que o paciente fique sentado e alcance fitas no solo com os pés, avaliando secundariamente a flexibilidade escapuloumeral."],"a":"A","e":"No <b>SEBT</b>, o paciente se apoia numa perna e alcança, com a outra, 8 direções no chão. O teste exige força, flexibilidade e propriocepção e é usado no retorno ao esporte. Os erros das outras:\n<ul>\n<li>B: o Drop Vertical Jump avalia o valgo dinâmico do joelho.</li>\n<li>C: o CKCUES é em cadeia <b>fechada</b> (posição de prancha, tocando a mão oposta).</li>\n<li>D: o side hop é <b>unipodal</b>, com 10 saltos laterais de cerca de 30 cm, <b>cronometrado</b>.</li>\n<li>E: o Y Balance de MMSS é feito em prancha, alcançando com a mão.</li>\n</ul>"},{"t":"q","n":34,"stem":"<p>A avaliação da mobilidade, flexibilidade e estabilidade da coluna vertebral é indispensável para um diagnóstico cinético-funcional preciso. Sobre os testes e achados clínicos aplicados a esse segmento, assinale a alternativa correta.</p>","o":["O teste de distância dedo-chão é considerado o recurso clínico mais fidedigno e específico para determinar restrições puramente lombares, pois sua execução anula a influência da excursão pélvica e da flexibilidade dos isquiotibiais.","O teste de Schober (e suas modificações) é uma medida quantitativa utilizada na prática clínica para avaliar a mobilidade da coluna lombar em flexão, aferindo o distanciamento entre pontos de referência anatômicos na região lombossacra durante o movimento.","O teste de Stibor tem como finalidade principal avaliar a força isométrica dos músculos eretores da espinha torácica, por meio da manutenção da postura contra uma resistência manual contínua.","Durante a inspeção dinâmica do movimento espinhal, a observação de um “pico de mobilidade” (ou hinge) indica clinicamente uma zona de severa hipomobilidade estrutural e encurtamento adaptativo.","Os testes clínicos voltados para a avaliação da estabilidade do core, como os protocolos de McGill, preconizam a realização de movimentos balísticos e de alta velocidade para aferir a potência dos estabilizadores profundos."],"a":"B","e":"No <b>Schober</b>, marca-se a junção lombossacra (linha das EIPS) e um ponto 10 cm acima. Na flexão, a distância deve aumentar cerca de 5 cm; menos que isso indica restrição, como na espondilite anquilosante. Os erros das outras:\n<ul>\n<li>A: o dedo-chão sofre influência do quadril e dos isquiotibiais.</li>\n<li>C: o Stibor mede a mobilidade toracolombar, não força.</li>\n<li>D: “hinge” é um ponto de <b>hipermobilidade</b>.</li>\n<li>E: os testes de McGill são de resistência <b>isométrica</b>.</li>\n</ul>"},{"t":"q","n":35,"stem":"<p>O Código de Ética e Deontologia da Fisioterapia estabelece os deveres e as proibições do fisioterapeuta no que tange à assistência ao paciente e à divulgação de seus serviços. Considerando essas normativas, assinale a alternativa correta.</p>","o":["O fisioterapeuta pode utilizar fotografias de seus pacientes para demonstrar comparativos de “antes e depois” do tratamento em suas redes sociais profissionais, desde que o paciente assine um termo de consentimento livre e esclarecido.","Para facilitar o marketing e a compreensão do público leigo, é permitido ao profissional substituir a titulação de fisioterapeuta por expressões genéricas como “osteopata”, “pilatista” ou “quiropraxista” em seus anúncios.","O fisioterapeuta deve manter segredo sobre fatos sigilosos, mas é livre para exibir imagens ou fazer referências a casos clínicos identificáveis em congressos científicos, não sendo necessária a autorização do paciente neste cenário acadêmico.","É dever fundamental do fisioterapeuta informar ao paciente quanto ao diagnóstico, prognóstico, objetivos do tratamento e procedimentos a serem adotados, respeitando o princípio bioético de autonomia de decidir sobre sua pessoa e bem-estar.","A prescrição de tratamento fisioterapêutico de forma não presencial é uma infração ética absoluta, sendo terminantemente proibida sob qualquer circunstância ou regulamentação."],"a":"D","e":"O Código de Ética (Resolução COFFITO 424/2013) impõe o dever de <b>informar diagnóstico, prognóstico, objetivos e procedimentos</b>, respeitando a autonomia do paciente. Os erros das outras:\n<ul>\n<li>A: é vedado divulgar “antes e depois” de pacientes.</li>\n<li>B: o profissional não pode trocar o título de fisioterapeuta.</li>\n<li>C: casos identificáveis exigem autorização, mesmo em congresso.</li>\n<li>E: o atendimento não presencial é regulamentado (Resolução COFFITO 516/2020).</li>\n</ul>"},{"t":"q","n":36,"stem":"<p>O uso de recursos instrumentais na fisioterapia respiratória, como a pressão positiva expiratória (EPAP) e a oscilação oral de alta frequência (OOAF), fundamenta-se em princípios fisiológicos e reológicos para otimizar o desprendimento de secreções. Sobre os mecanismos de ação e as indicações desses recursos, assinale a alternativa correta.</p>","o":["A técnica de oscilação oral de alta frequência (OOAF) atua gerando flutuações na pressão intratorácica que são transmitidas à árvore traqueobrônquica, promovendo a redução da viscoelasticidade do muco por meio do princípio da tixotropia.","O uso da máscara de EPAP induz o fechamento precoce das vias aéreas distais durante a fase expiratória, mecanismo essencial para aprisionar o ar alveolar e facilitar a tosse reflexa.","A hiperinsuflação manual com ressuscitador é o recurso de escolha para pacientes ambulatoriais hipersecretivos, pois permite a autogestão da terapia de higiene brônquica sem a necessidade de supervisão do fisioterapeuta.","Nos pacientes com fibrose cística, o uso de dispositivos de EPAP é contraindicado, pois o aumento da pressão intratorácica exacerba a broncoconstrição e eleva o risco de barotrauma nas vias aéreas centrais.","A eficácia da OOAF depende exclusivamente do posicionamento em drenagem postural, visto que as oscilações de fluxo não possuem energia cinética suficiente para mobilizar o muco contra a ação da gravidade."],"a":"A","e":"Dispositivos de OOAF, como Flutter e Shaker, geram oscilações de pressão e fluxo que vibram as vias aéreas e <b>reduzem a viscoelasticidade do muco (tixotropia)</b>, o que facilita a eliminação. Os erros das outras:\n<ul>\n<li>B: o EPAP faz o contrário, <b>evita o colapso</b> e mantém as vias aéreas abertas.</li>\n<li>C: hiperinsuflação manual é técnica hospitalar e supervisionada.</li>\n<li>D: o EPAP é muito usado na fibrose cística.</li>\n<li>E: a OOAF funciona sentada, sem drenagem postural.</li>\n</ul>"},{"t":"q","n":37,"stem":"<p>A reabilitação cardiovascular (RCV) após um infarto agudo do miocárdio (IAM) é uma intervenção multidisciplinar dividida em fases progressivas. Considerando os protocolos de prescrição de exercícios e a segurança clínica nesses pacientes, assinale a alternativa correta.</p>","o":["A fase I (fase hospitalar) tem como objetivo principal prevenir os efeitos deletérios do repouso no leito, iniciando-se com mobilização passiva ou ativo-assistida e evoluindo para deambulação precoce, sob rigorosa monitorização da frequência cardíaca e pressão arterial.","Na fase II (fase ambulatorial precoce), o treinamento aeróbico deve ser prescrito exclusivamente em intensidades vigorosas (acima de 85% do VO2máx) já na primeira semana para garantir o remodelamento cardíaco.","A fase I da reabilitação tem início apenas após a alta hospitalar do paciente, priorizando exercícios resistidos de alta intensidade para reverter a sarcopenia rapidamente.","Pacientes com angina instável aguda ou insuficiência cardíaca descompensada são os principais candidatos para o início imediato de treinamento intervalado de alta intensidade (HIIT) na fase II da RCV.","Durante a fase III da RCV, o uso do eletrocardiograma contínuo (telemetria) é obrigatório em 100% das sessões, sendo expressamente proibida a transição para a automonitorização."],"a":"A","e":"A <b>fase I é hospitalar</b>: mobilização precoce e progressiva (passiva ou ativo-assistida, depois sentar, ficar em pé e deambular), com monitorização de FC, PA e sintomas, para combater os efeitos do repouso. Os erros das outras:\n<ul>\n<li>B: na fase II, começa-se com intensidade leve a moderada.</li>\n<li>C: a fase I acontece durante a internação, não após a alta.</li>\n<li>D: angina instável e IC descompensada são <b>contraindicações</b>.</li>\n<li>E: na fase III, o paciente já faz automonitorização.</li>\n</ul>"},{"t":"q","n":38,"stem":"<p>A reabilitação pulmonar é uma intervenção abrangente e baseada em evidências, direcionada a pacientes com doenças respiratórias crônicas. Sobre as condutas, critérios e protocolos aplicados nesta reabilitação, assinale a alternativa correta.</p>","o":["O treinamento muscular inspiratório (TMI) baseia-se no princípio de carga e especificidade. A carga mínima inicial indicada para treinar a musculatura inspiratória é de 30% da pressão inspiratória máxima (PImáx), devendo ser aumentada gradativamente até 60 – 70% da PImáx basal.","A reabilitação pulmonar restringe-se primariamente ao treinamento aeróbico e à educação do paciente, sendo o treinamento resistido (força) contraindicado pelo risco de fadiga excessiva da musculatura acessória da respiração.","O protocolo de tratamento padrão na fase ambulatorial exige a realização de apenas 1 a 2 atendimentos mensais, com duração total do programa de quatro semanas.","A utilização da Escala de Borg durante o treinamento físico não é um critério recomendado, pois sua natureza subjetiva falha em quantificar com precisão o grau de dispneia de pacientes pneumopatas.","A reabilitação pulmonar é indicada para pacientes que já apresentam oxigenoterapia domiciliar contínua, pois pacientes com estágios iniciais de doença pulmonar não apresentam déficits na capacidade de exercício."],"a":"A","e":"No <b>TMI</b>, a carga mínima para haver ganho é de <b>30% da PImáx</b>, com progressão gradual até 60 a 70%. Os erros das outras:\n<ul>\n<li>B: o treino resistido é <b>recomendado</b>.</li>\n<li>C: o programa tem 2 a 3 sessões por semana, por 8 a 12 semanas.</li>\n<li>D: a escala de Borg é muito usada para prescrever e monitorar a intensidade.</li>\n<li>E: a reabilitação está indicada desde os estágios iniciais sintomáticos.</li>\n</ul>"},{"t":"q","n":39,"stem":"<p>O ganho de força muscular por meio do treinamento físico voluntário ou da estimulação elétrica (eletromioestimulação – NMES) envolve adaptações neurais e estruturais. Com base nos princípios da contração muscular, hipertrofia e na ordem de recrutamento, assinale a alternativa correta.</p>","o":["Durante as primeiras 2 a 4 semanas de um treinamento de força, o aumento da força muscular deve-se quase exclusivamente à hipertrofia das fibras musculares do tipo I (lentas), sem participação de adaptações neurais.","Pelo Princípio do Tamanho (Henneman), o exercício voluntário recruta primeiro as unidades motoras largas (fibras de contração rápida, tipo II) e, à medida que a força exigida aumenta, recruta as unidades motoras menores (fibras tipo I).","A imobilização prolongada ou a falta de treinamento levam seletivamente à atrofia apenas das fibras musculares do tipo I (lentas), mantendo a área de secção transversa das fibras do tipo II inalterada.","O treinamento exclusivamente concêntrico demonstrou gerar maior hipertrofia das fibras musculares e recuperação mais rápida da força pós-imobilização quando diretamente comparado ao treinamento excêntrico.","Na aplicação da estimulação elétrica neuromuscular, a ordem fisiológica de recrutamento é frequentemente revertida ou contornada. Fibras maiores de contração rápida (tipo II), que ficam nas camadas mais superficiais do músculo e têm baixo limiar à corrente elétrica externa, tendem a ser recrutadas primeiro."],"a":"E","e":"Na <b>NMES</b>, o recrutamento é inverso, ou não seletivo. Os axônios grandes (de fibras tipo II) têm menor resistência ao estímulo externo e ficam mais superficiais, então são recrutados antes. Os erros das outras:\n<ul>\n<li>A: nas primeiras semanas, o ganho de força é principalmente <b>neural</b>.</li>\n<li>B: pelo princípio de Henneman, as unidades <b>pequenas</b> (tipo I) são recrutadas primeiro, e B inverte isso.</li>\n<li>C: a imobilização atrofia os dois tipos de fibra.</li>\n<li>D: o treino excêntrico costuma gerar mais hipertrofia.</li>\n</ul>"},{"t":"q","n":40,"stem":"<p>O teste de caminhada de 6 minutos (TC6) é um teste de campo amplamente validado para avaliar a capacidade funcional submáxima dos sistemas respiratório, cardíaco e metabólico. De acordo com as diretrizes de padronização da American Thoracic Society (ATS), é correto afirmar:</p>","o":["o avaliador deve caminhar ao lado ou ligeiramente à frente do paciente durante todo o trajeto para ditar o ritmo e assegurar que o indivíduo atinja seu consumo máximo de oxigênio (VO2máx).","de acordo com a American Thoracic Society, a angina instável recente e o infarto agudo do miocárdio recente (≤ 1 mês) são contraindicações absolutas para a realização do teste.","caso o paciente pare para descansar antes de completar os seis minutos, o cronômetro deve ser pausado imediatamente e retomado apenas quando ele voltar a caminhar.","para que a distância percorrida demonstre uma melhora clínica significativa após um programa de intervenção terapêutica, a ATS recomenda que a diferença pré e pós-teste seja de, no mínimo, 10 metros.","o encorajamento verbal deve ser contínuo e ininterrupto ao longo de todos os 6 minutos para evitar a queda da motivação do paciente."],"a":"B","e":"Pela ATS (2002), as <b>contraindicações absolutas</b> são angina instável e IAM no último mês. As relativas são FC de repouso acima de 120 bpm e PA acima de 180/100 mmHg. Os erros das outras:\n<ul>\n<li>A: o avaliador não caminha junto, e o teste é <b>submáximo</b>.</li>\n<li>C: o cronômetro <b>não para</b> quando o paciente descansa.</li>\n<li>D: a diferença clinicamente relevante é de cerca de 54 m (ATS 2002); estudos mais recentes falam em 25 a 33 m.</li>\n<li>E: o incentivo segue frases padronizadas, uma vez a cada minuto.</li>\n</ul>"}],"total":40},{"id":"ei","ano":2025,"org":"Hospital Israelita Albert Einstein","cargo":"Residência em Fisioterapia (seleção 2026)","data":"02/11/2025","nota":"Prova só de conhecimentos específicos, com 4 alternativas (A a D).","pdf":"https://arquivos.qconcursos.com/prova/arquivo_prova/152854/vunesp-2025-einstein-residencia-multiprofissional-e-uniprofissional-fisioterapia-prova.pdf","b":[{"t":"h","x":"Conhecimentos Específicos"},{"t":"q","n":1,"stem":"Na anatomia do músculo cardíaco, existem estruturas chamadas discos intercalares que são:","o":["membranas celulares que unem as células miocárdicas umas nas outras e se dispõem cruzando as fibras miocárdicas.","miofibrilas de excitação elétrica localizadas na região do átrio direito e no centro do coração.","parte do revestimento do músculo esquelético que participa da contração do ventrículo esquerdo.","tecido de revestimento do sistema de excitação do coração com potencial de contração rítmica."],"a":"A","e":"Os discos intercalares são <b>membranas celulares</b> que separam e unem as células miocárdicas, cruzando as fibras. Têm junções comunicantes (gap) que deixam o potencial de ação passar rápido de uma célula para outra (sincício funcional)."},{"t":"q","n":2,"stem":"Assinale a alternativa correta com relação aos músculos papilares.","o":["São ligados aos folhetos das valvas atrioventriculares pelas cordas tendíneas.","Contraem-se juntamente com as paredes dos átrios e ajudam as valvas a se fecharem.","Sua função é tracionar as valvas em direção à aorta, melhorando a fração de ejeção ventricular.","Formam o sincício atrioventricular, otimizando a função das valvas semilunares."],"a":"A","e":"Os músculos papilares se prendem aos folhetos das valvas <b>atrioventriculares</b> (mitral e tricúspide) pelas cordas tendíneas. Eles se contraem com os <b>ventrículos</b>, não com os átrios, e impedem que os folhetos se abaulem para os átrios. Eles não ajudam a fechar a valva."},{"t":"q","n":3,"stem":"Analise o excerto: A pressão X nos capilares tende a forçar o líquido e as substâncias nele dissolvidas para os espaços intersticiais. Por outro lado, a pressão Y gerada pelas proteínas plasmáticas impede a perda de líquido para o interstício. (HALL, John E.; GUYTON, Arthur C. Tratado de Fisiologia Médica. 14. ed. Rio de Janeiro: GEN Guanabara Koogan, 2021) As letras “X” e “Y” referem-se, respectivamente, aos termos:","o":["hídrica e hemática.","arterial sistêmica e arterial pulmonar.","sistólica e diastólica.","hidrostática e coloidosmótica."],"a":"D","e":"Pelo Guyton, a pressão <b>hidrostática</b> capilar empurra o líquido para o interstício. A pressão <b>coloidosmótica</b> (oncótica), gerada pelas proteínas plasmáticas, segura o líquido no vaso."},{"t":"q","n":4,"stem":"Leia atentamente o trecho a seguir: (…) quase toda a quantidade de sangue bombeada pelo coração a cada minuto é determinada (…) pelo volume de sangue que chega ao coração pelas veias. (HALL, John E.; GUYTON, Arthur C. Tratado de Fisiologia Médica. 14. ed. Rio de Janeiro: GEN Guanabara Koogan, 2021) Essa propriedade do coração é chamada de","o":["retorno venoso efetivo.","mecanismo de Frank-Starling.","vasorregulação regional.","pré-carga ventricular."],"a":"B","e":"É o <b>mecanismo de Frank-Starling</b>: quanto maior o retorno venoso, mais o ventrículo se distende e mais forte ele contrai, bombeando o sangue que recebe. Retorno venoso e pré-carga são as variáveis envolvidas, não o nome da propriedade."},{"t":"q","n":5,"stem":"Assinale a alternativa que apresenta o conjunto de reações desencadeadas pelo organismo quando a pressão arterial sistêmica diminui.","o":["Aumento da pressão de bombeamento cardíaco, constrição de reservatórios venosos, constrição generalizada das arteríolas.","Vasoconstricção cerebral, diminuição da frequência cardíaca, aumento da força de contração ventricular.","Aumento da frequência cardíaca, vasodilatação venosa e vasoconstricção arteriolar.","Diminuição do bombeamento cardíaco, vasodilatação dos reservatórios venosos e vasoconstricção coronária."],"a":"C","e":"Gabarito oficial: <b>C</b>. Atenção: o Guyton descreve a resposta à queda de pressão como constrição arteriolar, <b>constrição</b> dos reservatórios venosos e aumento da força e da frequência cardíaca. Esse texto lembra a alternativa A. Confira se o gabarito definitivo manteve a C."},{"t":"q","n":6,"stem":"Uma complicação das cirurgias torácicas e abdominais é a atelectasia ou colapso pulmonar. Suas repercussões para a função pulmonar incluem","o":["redistribuição do gás pela ventilação colateral ocasionando hipóxia e hipercapnia.","perda do mecanismo de vaso regulação do pulmão que resulta em redução da pressão na artéria pulmonar.","aumento da complacência da caixa torácica causando distúrbio misto, obstrutivo e restritivo.","redistribuição do fluxo sanguíneo pulmonar para preservar a relação ventilação-perfusão."],"a":"D","e":"Na atelectasia, a vasoconstrição hipóxica <b>desvia o fluxo sanguíneo</b> das áreas colapsadas para as ventiladas, para preservar a relação V/Q. A hipercapnia não é típica (A), a pressão na artéria pulmonar tende a subir (B) e o distúrbio é restritivo, com complacência <b>reduzida</b> (C)."},{"t":"q","n":7,"stem":"São medidas obtidas pelo exame de espirometria:","o":["volume expiratório forçado no primeiro segundo fluxo expiratório forçado, fluxo expiratório final.","volume residual, capacidade pulmonar total, volume corrente.","capacidade inspiratória, capacidade vital, capacidade vital forçada, volume expiratório forçado no primeiro segundo.","fluxo inspiratório máximo, volume corrente, fluxo expiratório forçado no primeiro segundo."],"a":"C","e":"A espirometria mede volumes e fluxos mobilizáveis: <b>CI, CV, CVF, VEF1</b>, FEF25-75% e outros. Volume residual e CPT (B) exigem pletismografia ou diluição de gases, porque o VR não é expirado."},{"t":"q","n":8,"stem":"A avaliação da força muscular do paciente em terapia intensiva é imprescindível para o processo de reabilitação. Sobre essa avaliação, assinale a alternativa correta.","o":["A escala MRC (Medical Research Concil) gradua a força muscular em cinco níveis, sendo 0 quando o avaliador não percebe nenhuma contração muscular, e 5 quando o paciente é capaz de aplicar força contra a gravidade.","A avaliação da força muscular em terapia intensiva deve ser feita com um dinamômetro de exercício isocinético.","É necessário desconectar o paciente do ventilador mecânico para avaliar força muscular, com exatidão.","A escala ICU Mobility Score pode ser aplicada em pacientes sedados ou comatosos, permitindo a avaliação objetiva da força muscular."],"a":"A","e":"A escala MRC vai de 0 (nenhuma contração) a 5 (força normal) para cada grupo muscular. Ela pede um paciente <b>acordado e colaborativo</b>, por isso não serve para paciente sedado (D). Não precisa de dinamômetro isocinético nem de tirar o paciente da ventilação."},{"t":"q","n":9,"stem":"A embolia pulmonar está intimamente relacionada ao processo de trombose venosa profunda. Quais as três características patológicas estão ligadas à formação de um trombo/êmbolo?","o":["Hipocoagulabilidade, hipotensão e venodilatação.","Lesão endotelial, hipertensão e venodilatação.","Estase, hipotensão e turbilhonamento sanguíneo.","Estase, lesão endotelial e hipercoagulabilidade."],"a":"D","e":"É a <b>tríade de Virchow</b>: estase sanguínea, lesão endotelial e hipercoagulabilidade."},{"t":"q","n":10,"stem":"Sobre a Lei de Fick, que rege as trocas gasosas, assinale a alternativa correta.","o":["A velocidade de transporte de um gás através de uma camada de tecido é proporcional à área do tecido e à diferença na pressão parcial do gás entre os dois lados e inversamente proporcional à espessura do tecido.","A velocidade de transporte de um gás de uma camada de tecido é inversamente proporcional à espessura de tecido, e a diferença na pressão parcial do gás não se relaciona com a área de troca.","A velocidade de transporte de um gás através de uma camada de tecido é proporcional à área do tecido e a espessura do tecido e inversamente proporcional à diferença na pressão parcial do gás.","A velocidade de transporte de um gás através de uma camada de tecido é dependente da área de troca e não tem interferência da espessura do tecido."],"a":"A","e":"Lei de Fick: a difusão de um gás é <b>proporcional à área</b> e à <b>diferença de pressão parcial</b>, e <b>inversamente proporcional à espessura</b> da membrana."},{"t":"q","n":11,"stem":"Sobre a insuficiência respiratória, assinale a alternativa correta.","o":["É definida como a incapacidade do sistema respiratório de manter a pressão parcial de O2 e de CO2 nos alvéolos dentro dos limites da normalidade se a demanda metabólica for superior ao metabolismo basal.","Pode ser definida como uma condição que leva à oxigenação inadequada do sangue, com prejuízo ao transporte de O2 para os tecidos, e prejuízo à eliminação de CO2 pelos pulmões.","A insuficiência respiratória aguda hipoxêmica do tipo I ocorre por diminuição da ventilação alveolar e consequente hipercapnia, ou seja, aumento da PaCO2, associada à hipoxemia.","Na insuficiência respiratória do tipo II, a alteração primordial é o aumento da ventilação alveolar com desequilíbrio entre essa ventilação e sua demanda."],"a":"B","e":"Insuficiência respiratória é a incapacidade de garantir oxigenação adequada do sangue e/ou eliminação de CO2. O tipo I é <b>hipoxêmico</b>, por distúrbio V/Q ou shunt, com PaCO2 normal ou baixa. O tipo II é <b>hipercápnico</b>, por <b>redução</b> da ventilação alveolar. Por isso C e D estão trocadas."},{"t":"q","n":12,"stem":"Sobre a avaliação da musculatura respiratória pela manovacuometria, assinale a alternativa correta.","o":["A medida é realizada a partir de uma expiração máxima seguida de uma inspiração a volume corrente. A primeira medida deve ser anotada para evitar o efeito aprendizagem.","Deve ser realizada, pelo menos, 10 vezes, de forma a produzir manobras aceitáveis e sem vazamento, com intervalo de 30 segundos entre elas.","A medida da pressão expiratória é expressa em mmHg, e quanto maior o valor absoluto, pior é a condição da musculatura expiratória.","A medida da pressão expiratória máxima é realizada sustentando-se por 1 a 3 segundos em expiração, sendo que o indivíduo deve ser orientado antes da medida, podendo ser repetida por mais de 2 vezes se necessário."],"a":"D","e":"Na PEmáx, o paciente parte da capacidade pulmonar total e <b>sustenta o esforço por 1 a 3 s</b>. As manobras são repetidas (em geral de 3 a 5, até ficarem reprodutíveis). O valor é em cmH2O, e quanto maior, <b>melhor</b>. A PImáx parte do volume residual."},{"t":"q","n":13,"stem":"Sobre a aplicação de estimulação elétrica neuromuscular (EENM) em pacientes adultos críticos, é correto afirmar que","o":["é recomendado que a EENM seja aplicada em uma condição de carga dinâmica e variável, de modo a controlar o nível de força evocado em comparação com a contração voluntária mínima.","a intensidade mínima, de acordo com uma contração muscular visível, corresponde ao limiar motor e não pode ser ajustada durante o tratamento.","a mobilização deve ser instituída logo que possível nos pacientes críticos, e a EENM pode ser uma alternativa ao exercício físico em tais pacientes.","quanto à forma de aplicação, há uma homogeneidade entre os protocolos utilizados nos estudos para uso da EENM."],"a":"C","e":"A mobilização precoce é a regra na UTI. Quando o paciente não consegue fazer exercício ativo, a <b>EENM é uma alternativa</b> para preservar a massa muscular. Os protocolos dos estudos são heterogêneos (D errada) e a intensidade é ajustada ao longo das sessões (B errada)."},{"t":"q","n":14,"stem":"Assinale a alternativa que descreve corretamente uma das hipóteses para a perda de massa muscular no paciente com doença respiratória crônica.","o":["Os elevados níveis de marcadores inflamatórios e o estresse oxidativo aumentam a proteólise muscular, inibem a expressão da proteína específica do músculo e aumentam a apoptose das células musculares.","O aumento do gás carbônico circulante inibe a produção do hormônio de crescimento que é o principal responsável pela manutenção da massa muscular.","A hipoxemia pode reduzir a proteólise, aumentando a infiltração de gordura no músculo e prejudicando, assim, sua hipertrofia mesmo quando está sob tratamento.","A inapetência é o principal fator de perda de massa muscular, uma vez que ocorre desde os primeiros sinais da doença até o final da evolução natural da doença."],"a":"A","e":"Na DPOC, a inflamação sistêmica (TNF-α, IL-6) e o <b>estresse oxidativo</b> ativam a proteólise (ubiquitina-proteassoma) e a apoptose e reduzem a síntese de proteínas musculares. O resultado é perda de massa muscular."},{"t":"q","n":15,"stem":"A respeito dos mecanismos que envolvem os efeitos do exercício físico, assinale a alternativa correta.","o":["A literatura informa que são necessários, de 2 a 3 dias de treinamento para se observar aumento do consumo máximo de oxigênio (VO2máx) e melhora significativa do condicionamento físico.","Os efeitos agudos, denominados respostas, são classificados em imediatos e tardios. Os efeitos agudos imediatos ocorrem nos períodos peri e pós-imediato ao exercício físico (até 2 dias depois), como elevação da FC e da ventilação pulmonar.","Os efeitos crônicos dos exercícios físicos resultam da exposição frequente e regular e representam aspectos morfofuncionais que diferenciam um indivíduo treinado de um sedentário, como a bradicardia e a hipertrofia.","A obtenção dos efeitos crônicos depende da variável que está sendo analisada e da condição prévia do indivíduo. Quanto melhor for o condicionamento ou o estado físico e clínico, mais rapidamente haverá efeito adaptativo."],"a":"C","e":"Os efeitos <b>crônicos</b> (adaptações) vêm da prática regular e diferenciam treinados de sedentários: bradicardia de repouso, hipertrofia, aumento do VO2máx. Ganhar VO2máx leva semanas, não 2 ou 3 dias. E quem está pior condicionado responde <b>mais rápido</b>."},{"t":"q","n":16,"stem":"Sobre o frêmito toracovocal, parte de propedêutica respiratória, assinale a alternativa correta.","o":["É a parte da ausculta pulmonar que permite diferenciar um colapso pulmonar de hipersecreção.","O frêmito pode estar normal ou diminuído no paciente com pneumonia; e aumentado no paciente com pneumotórax.","Coloca-se a palma da mão sobre a lateral do tórax e pede-se para o paciente falar 33, auscultando-se ambos hemitórax.","É a análise da vibração produzida pelo som nas vias aéreas inferiores, por meio da palpação da parede torácica."],"a":"D","e":"O frêmito toracovocal é a <b>vibração da voz</b> percebida pela <b>palpação</b> do tórax (paciente fala “33”). Ele aumenta na consolidação, como a pneumonia, e diminui no derrame pleural e no pneumotórax."},{"t":"q","n":17,"stem":"Qual das seguintes teorias do envelhecimento atribui o processo de envelhecimento à acumulação de danos celulares causados por subprodutos metabólicos reativos?","o":["Teoria da programação genética.","Teoria dos radicais livres.","Teoria do envelhecimento ativo.","Teoria da mutação acumulada."],"a":"B","e":"A <b>teoria dos radicais livres</b> (Harman) atribui o envelhecimento ao dano oxidativo cumulativo causado por espécies reativas de oxigênio geradas no metabolismo."},{"t":"q","n":18,"stem":"A estimulação elétrica nervosa transcutânea (TENS) é uma técnica de alívio da dor que se baseia em qual dos seguintes mecanismos de ação?","o":["Ativação de fibras nervosas A-Beta, que inibem a transmissão de estímulos dolorosos das fibras A-Delta e C no nível da medula espinhal, conforme a Teoria do portão.","Indução de venodilatação e melhoria da circulação local para reduzir o edema e a inflamação, o que diminui a percepção da dor.","Promoção da liberação de substâncias analgésicas endógenas, como as endorfinas, em resposta a contrações musculares induzidas pelo estímulo elétrico.","Saturação dos mecanorreceptores periféricos, o que sobrecarrega a via de transmissão da dor e leva a uma analgesia transitória."],"a":"A","e":"A TENS convencional ativa fibras <b>A-beta</b>, que inibem no corno dorsal a transmissão das fibras A-delta e C. É a <b>teoria das comportas</b> (Melzack e Wall). A liberação de endorfinas é o mecanismo da TENS de baixa frequência (acupuntura), não o principal."},{"t":"q","n":19,"stem":"Em relação aos achados da ausculta pulmonar, assinale a alternativa que apresenta corretamente a relação entre um som respiratório e uma condição clínica.","o":["O sibilo é um som contínuo e agudo, auscultado sobre vias aéreas expandidas.","O som vesicular é alto e rude, sendo audível sobre grandes áreas pulmonares normais.","A ausculta de sons brônquicos (“respiração soprosa”) em áreas periféricas dos pulmões indica consolidação pulmonar.","A presença de sons crepitantes em pulmões sadios é um achado comum e normal."],"a":"C","e":"O som brônquico ouvido na periferia indica que o parênquima ficou <b>consolidado</b> e passou a conduzir o som da via aérea central. O sibilo surge em vias aéreas <b>estreitadas</b>. O murmúrio vesicular é suave, e crepitações não são normais."},{"t":"q","n":20,"stem":"O enunciado a seguir descreve um teste submáximo amplamente utilizado em pacientes com doenças crônicas para medir a capacidade funcional. Instrumento que avalia a capacidade funcional de um indivíduo medindo a distância máxima que ele consegue percorrer em um período de tempo determinado. Esse enunciado se refere a qual dos seguintes testes?","o":["Teste de esforço ergoespirométrico.","Shuttle walk test.","Timed up and go.","Teste de caminhada de 6 minutos."],"a":"D","e":"Medir a maior distância percorrida em tempo fixo é o <b>teste de caminhada de 6 minutos</b>, um teste submáximo. O shuttle tem velocidade incremental controlada por sinais sonoros."},{"t":"q","n":21,"stem":"Qual mecanismo descreve corretamente a abertura e o fechamento das valvas cardíacas?","o":["As valvas se abrem ativamente pela ação da musculatura papilar e se fecham passivamente quando o fluxo de sangue é revertido.","Tanto a abertura quanto o fechamento das valvas são processos passivos, impulsionados pela diferença de pressão sanguínea.","A abertura das valvas é controlada ativamente por um gradiente de pressão retrógrado, e o fechamento é passivo.","O fluxo sanguíneo no sentido correto causa a abertura ativa das valvas, e a reversão do fluxo leva ao fechamento passivo."],"a":"B","e":"As valvas se abrem e se fecham <b>passivamente</b>, conforme o gradiente de pressão entre as câmaras. Os músculos papilares só impedem a eversão dos folhetos."},{"t":"q","n":22,"stem":"O sentido do fluxo de linfa no sistema linfático, quando potencializado pela técnica de drenagem linfática, segue a seguinte ordem de estruturas:","o":["capilares linfáticos, pré-coletores, coletores aferentes, gânglios, troncos e ductos, culminando no sistema venoso.","vasos linfáticos de pequeno calibre, troncos, ductos e sistema venoso.","gânglios linfáticos, coletores, ductos e sistema circulatório.","vasos periféricos, pré-coletores e ductos."],"a":"A","e":"A linfa segue de <b>capilares linfáticos → pré-coletores → coletores</b> (aferentes) <b>→ linfonodos → troncos → ductos</b> (torácico e linfático direito) e chega ao sistema venoso, nos ângulos venosos."},{"t":"q","n":23,"stem":"Para pacientes diagnosticados com diabetes mellitus, as diretrizes de saúde recomendam principalmente que tipo de exercício físico e por qual razão fisiológica?","o":["De força, pois sua prática promove a hipertrofia muscular em 50% e melhora a sensibilidade à insulina.","Anaeróbico, uma vez que sua principal característica é o aumento do gasto energético e o uso direto do glicogênio.","Aeróbico, já que sua prática regular promove o aumento da captação de glicose pelo músculo e o número de mitocôndrias.","Pliométrico, pois eleva o metabolismo basal e contribui para a biodisponibilidade de glicose."],"a":"C","e":"As diretrizes recomendam o exercício <b>aeróbico</b> (associado ao resistido). Ele aumenta a captação de glicose pelo músculo, inclusive pela via GLUT4 independente de insulina, e a biogênese mitocondrial, melhorando a sensibilidade à insulina."},{"t":"q","n":24,"stem":"Com relação aos exercícios propostos no programa de reabilitação pulmonar para pacientes com doença pulmonar obstrutiva crônica (DPOC), assinale a alternativa correta.","o":["No treinamento de força, a recomendação é realizar de 8 a 12 repetições, com uma carga correspondente a 50% a 85% da força máxima, tanto para membros superiores quanto inferiores.","A frequência do exercício aeróbico deve ser diária e, para evitar sobrecarga, dispensa-se o treino específico da musculatura respiratória.","A intensidade do treino aeróbico é definida exclusivamente pelo teste de caminhada de 3 minutos e não pelo shuttle test.","O treinamento de força é contraindicado para esses pacientes, especialmente para aqueles que estão em fila de transplante pulmonar."],"a":"A","e":"Na reabilitação pulmonar, o treino de força usa de <b>8 a 12 repetições com 50% a 85% de 1RM</b>, para membros superiores e inferiores. Ele é indicado, inclusive antes do transplante. A intensidade aeróbica pode ser definida pelo TC6, pelo shuttle ou pelo teste cardiopulmonar."},{"t":"q","n":25,"stem":"Em relação ao tratamento da osteoartrose de joelho, qual das afirmações sobre o papel do exercício físico é clinicamente correta?","o":["A redução da dor com os exercícios é uma resposta imediata e serve como o principal objetivo do fortalecimento muscular.","A eficácia do exercício no controle da dor não tem relação direta com o grau de gravidade da artrose observado em exames radiológicos.","Os benefícios do exercício no controle da dor são limitados aos estágios iniciais da doença, antes de haver danos articulares significativos.","Os efeitos positivos dos exercícios sobre a dor são observados apenas quando associados a outras terapias, como eletroterapia ou medicação."],"a":"B","e":"O benefício do exercício sobre a dor na osteoartrite de joelho <b>não depende do grau radiológico</b>: pacientes com artrose leve ou grave melhoram. O efeito não é imediato e não depende de outras terapias."},{"t":"q","n":26,"stem":"Assinale a alternativa que apresenta o principal papel funcional dos pneumócitos do tipo I no tecido pulmonar.","o":["Produzir o surfactante, uma substância que evita o colapso dos alvéolos.","Participar da defesa imunológica local, atuando na remoção de partículas estranhas.","Atuar na troca gasosa, uma vez que sua estrutura fina e de grande área de superfície facilita a difusão de gases.","Ser células-tronco, com capacidade de se regenerar e se diferenciar em outros tipos celulares."],"a":"C","e":"Os pneumócitos tipo I são finos e cobrem cerca de 95% da superfície alveolar, formando a <b>barreira de troca gasosa</b>. O surfactante e a regeneração cabem aos <b>tipo II</b>. A defesa cabe aos macrófagos alveolares."},{"t":"q","n":27,"stem":"Sobre o processo de desmame da ventilação mecânica e a avaliação da capacidade do paciente de respirar sem suporte, assinale a alternativa correta.","o":["A retirada do ventilador deve ser feita de forma abrupta assim que houver a estabilização do quadro clínico do paciente.","O sucesso do desmame não depende da melhora da causa original que levou à insuficiência respiratória.","A pressão do ventilador deve ser mantida elevada durante o processo para evitar que a musculatura do paciente sofra fadiga.","O teste de respiração espontânea (TRE) é a ferramenta padrão para avaliar se o paciente tem condições de manter a ventilação sem o auxílio da máquina."],"a":"D","e":"O <b>teste de respiração espontânea</b> (TRE), em tubo T ou com PSV baixa por 30 a 120 min, é a ferramenta padrão para decidir a extubação. O desmame depende da melhora da causa da insuficiência respiratória."},{"t":"q","n":28,"stem":"Leia atentamente o excerto a seguir: É um parâmetro da ventilação mecânica que representa a diferença entre a pressão de platô e a PEEP, sendo um indicador da distensão alveolar real. Ele é fundamental na proteção pulmonar, sendo essencial para encontrar um equilíbrio entre a prevenção do atelectrauma e a hiperinsuflação, garantindo uma ventilação mais segura e eficaz. (Associação de Medicina Intensiva Brasileira (AMIB); Sociedade Brasileira de Pneumologia e Tisiologia (SBPT). Orientações práticas em ventilação mecânica 2024: com base em evidências. São Paulo, 2024.) Trata-se da definição do conceito:","o":["driving pressure.","resistência.","auto-PEEP.","complacência."],"a":"A","e":"<b>Driving pressure</b> = Pplatô − PEEP (também VC/complacência). Valores ≤ 15 cmH2O estão associados a ventilação protetora."},{"t":"q","n":29,"stem":"Analise as afirmações a seguir sobre a polineuromiopatia do paciente crítico. I. Apresenta tetraparesia flácida e fraqueza muscular simétrica, acometendo principalmente os músculos proximais, associada à hiporreflexia profunda e, geralmente, poupando os músculos faciais e oculares. II. A dificuldade de desmame ventilatório deve levantar a suspeita de possibilidade de polineuromiopatia do doente crítico, principalmente na ausência de distúrbios do nível de consciência, ou agudização de doenças pulmonares, cardíacas ou infecciosas. III. Os principais fatores de risco são: sepse; falência de múltiplos órgãos; hiperglicemia; diálise; uso de drogas vasoativas, sexo feminino; maior tempo de ventilação mecânica; uso de corticoesteroides e bloqueadores neuromusculares. Assinale a alternativa correta.","o":["I, II e III estão incorretas.","Apenas as alternativas I e III estão corretas.","Apenas a alternativa I está correta.","I, II e III estão corretas."],"a":"D","e":"As três afirmações descrevem a polineuromiopatia do doente crítico: tetraparesia flácida simétrica e proximal que poupa a face, desmame difícil sem outra causa e os fatores de risco clássicos (sepse, disfunção de múltiplos órgãos, hiperglicemia, corticoides, bloqueadores neuromusculares, ventilação mecânica prolongada). Todas estão <b>corretas</b>."},{"t":"q","n":30,"stem":"Quais são os principais fatores envolvidos no processo de deposição das partículas inaladas ao longo da árvore respiratória?","o":["Aerodinâmica, trocas gasosas e imersão.","Absorção das moléculas, movimento browniano e higroscopicidade.","Trocas gasosas, difusão e viscosidade.","Impactação inercial, sedimentação e difusão."],"a":"D","e":"Partículas inaladas se depositam por <b>impactação inercial</b> (as grandes, em vias aéreas centrais), <b>sedimentação</b> (gravidade, em vias aéreas menores) e <b>difusão</b> (movimento browniano das partículas muito pequenas, nos alvéolos)."},{"t":"q","n":31,"stem":"Em relação aos sistemas de oxigenoterapia, assinale a alternativa correta.","o":["Todos os sistemas de oxigênio exigem umidificação suplementar, independentemente da taxa de fluxo utilizada.","Em sistemas de baixo fluxo, a fração inspirada de oxigênio (FiO2) depende de fatores como o reservatório anatômico do paciente e seu padrão respiratório.","Máscaras com reservatório são projetadas para fornecer no máximo 40% de concentração de oxigênio (FiO2), mesmo quando bem ajustadas.","Tendas faciais são sistemas de alto fluxo que podem oferecer FiO2 de até 100% com o uso de nebulizadores."],"a":"B","e":"Nos sistemas de <b>baixo fluxo</b> (cateter nasal, máscara simples), a FiO2 varia com o padrão respiratório e o reservatório anatômico, porque o paciente inspira ar ambiente junto. A máscara com reservatório chega a cerca de 60% a 90%, e a umidificação é necessária só em fluxos mais altos."},{"t":"q","n":32,"stem":"Sobre as vias de ventilação colateral nos pulmões, assinale a alternativa correta.","o":["Os poros de Kohn são canais que conectam os bronquíolos terminais aos alvéolos.","A ventilação colateral ocorre unicamente através de canais que interligam os bronquíolos entre si.","Os canais de Lambert são vias que conectam bronquíolos terminais a alvéolos adjacentes, permitindo a ventilação colateral.","As vias colaterais são formadas apenas pelos canais de Martin, que interligam os alvéolos uns aos outros."],"a":"C","e":"Os <b>canais de Lambert</b> ligam bronquíolos a alvéolos vizinhos. Os poros de Kohn ligam alvéolo a alvéolo, e os canais de Martin ligam bronquíolo a bronquíolo. As três vias formam a ventilação colateral."},{"t":"q","n":33,"stem":"A boa prática clínica sugere que o fisioterapeuta deve identificar a causa de uma limitação funcional para definir o melhor tratamento. Com base nisso, a dor e o edema, que surgem como resultado do AVE e/ou devido a influências clínicas ou ambientais (como quedas), são exemplos de que tipo de deficiência e por quê?","o":["Limitações funcionais, que são apenas a consequência das deficiências, mas não são deficiências em si.","Deficiências secundárias, pois ocorrem devido a outras influências e envolvem sistemas do corpo além do neurológico.","Deficiências primárias, pois são problemas neurológicos diretamente ligados à lesão cerebral inicial.","Estratégias compensatórias, que são a forma como o paciente se adapta aos problemas de mobilidade."],"a":"B","e":"Dor e edema após o AVE são <b>deficiências secundárias</b>: surgem por outras influências (imobilidade, quedas, posicionamento) e envolvem sistemas além do neurológico. Deficiências primárias vêm direto da lesão, como paresia e alteração de tônus."},{"t":"q","n":34,"stem":"Assinale a alternativa que apresenta corretamente um dos objetivos na função musculoesquelética para pacientes na fase aguda e inconsciente do pós-acidente vascular encefálico (AVE).","o":["Normalizar o tônus em hemicorpo e produzir analgesia.","Treinar a marcha e as atividades de vida diária.","Ganhar força muscular e melhorar o equilíbrio dinâmico.","Manter ou ganhar amplitude de movimento e prevenir contraturas."],"a":"D","e":"Na fase aguda, com o paciente inconsciente, o objetivo musculoesquelético é <b>manter ou ganhar ADM e prevenir contraturas</b> (posicionamento, mobilização passiva). Treino de marcha, AVDs e equilíbrio exigem que o paciente participe."},{"t":"q","n":35,"stem":"Na prevenção da trombose venosa profunda (TVP), no paciente com AVE, qual conduta se repete para pacientes nas fases agudas, tanto conscientes quanto inconscientes?","o":["Mudança de decúbito a cada 4 horas.","Manobras de higiene brônquica.","Mobilizações passivas de membros superiores e inferiores.","Uso de tipoia quando o paciente estiver sentado."],"a":"C","e":"As <b>mobilizações passivas</b> de membros servem na prevenção de TVP tanto do paciente consciente quanto do inconsciente na fase aguda. O consciente pode ainda fazer exercícios ativos."},{"t":"q","n":36,"stem":"Qual dos seguintes objetivos de tratamento é exclusivo para a fase tardia do paciente pós-AVE?","o":["Prevenir a subluxação de ombro.","Melhorar a propriocepção e o equilíbrio.","Manter ou ganhar amplitude de movimento.","Treinar atividades de vida diária e atividades funcionais."],"a":"D","e":"O treino de <b>AVDs e atividades funcionais</b> é objetivo da fase tardia, quando o paciente já participa ativamente. ADM, prevenção de subluxação e propriocepção também aparecem nas fases anteriores."},{"t":"q","n":37,"stem":"A oximetria de pulso funciona com base em dois princípios:","o":["a presença de um sinal pulsátil do sangue arterial e a absorção da luz pela hemoglobina ligada ao oxigênio.","a presença de fluxo venoso e a emissão de luz pela hemoglobina ligada ao oxigênio.","o pulso venoso contínuo e a captação da luz pela hemoglobina ligada ao gás carbônico.","a pressão arterial mínima e a quantidade suficiente de hemoglobina no sangue."],"a":"A","e":"O oxímetro se baseia na <b>pulsatilidade arterial</b> (pletismografia) e na <b>absorção diferente da luz</b> (vermelho e infravermelho) pela oxi e pela desoxi-hemoglobina."},{"t":"q","n":38,"stem":"Analise as afirmações a seguir: I. O treinamento para ganho de força deve-se utilizar uma intensidade baixa e altos números de repetições. II. Para ganho de força, a maioria dos estudos científicos descreve o treinamento sendo realizado de três a sete vezes por semana, com duração de 10 a 30 minutos. III. O treinamento linear, além de ser fluxo-independente, possibilita uma melhor relação de tempo inspiratório e expiratório. IV. O treshold é um equipamento, de baixo custo, cuja sobrecarga é do tipo spring loaded (mola), que impõe uma carga de trabalho aos músculos expiratórios, proporcionando aumento transitório da dispneia. Sobre o treinamento muscular respiratório, estão corretas, apenas:","o":["I e II.","II e IV.","II e III.","I e IV."],"a":"C","e":"Gabarito oficial: II e III. No treino muscular inspiratório para <b>força</b>, a carga é alta e há poucas repetições (I errada). Os aparelhos lineares (pressórios) são <b>fluxo-independentes</b>. O Threshold® IMT carrega os músculos <b>inspiratórios</b> (IV errada)."},{"t":"q","n":39,"stem":"Quais são os estágios do choque circulatório?","o":["Estágio agudo, estágio subagudo e estágio irreversível.","Estágio não progressivo, estágio progressivo e estágio irreversível.","Estágio reversível, estágio hemorrágico e estágio séptico.","Estágio de baixo débito, estágio não progressivo e estágio hiperdinâmico."],"a":"B","e":"O Guyton descreve três estágios do choque: <b>não progressivo</b> (compensado), <b>progressivo</b> (ciclo vicioso de deterioração) e <b>irreversível</b>."},{"t":"q","n":40,"stem":"Qual o principal mecanismo de ação pelo qual a terapia de pressão expiratória positiva (PEP), utilizando máscara, auxilia na mobilização de secreções e no tratamento de atelectasias?","o":["Aumentando o fluxo expiratório pela contração do abdome, o que modifica as características do muco.","Impondo uma resistência à inspiração por meio de orifícios, o que promove expansão pulmonar rápida.","Promovendo o enchimento dos segmentos hipoventilados por meio da ventilação colateral.","Provocando oscilações de pressão na cavidade oral, transmitidas para o interior das vias aéreas, o que fluidifica o muco."],"a":"C","e":"A PEP mantém a pressão positiva na expiração e <b>abre a ventilação colateral</b> (poros de Kohn, canais de Lambert). Assim, o ar chega atrás da secreção e reexpande as áreas hipoventiladas. A oscilação de pressão (D) é o mecanismo dos dispositivos oscilatórios, como Flutter® e Shaker®."}],"total":40},{"id":"un","ano":2025,"org":"UNESP – Câmpus de Presidente Prudente","cargo":"Assistente de Suporte Acadêmico II – Fisioterapia","data":"28/09/2025","nota":"Os específicos cobram rotina de laboratório de fisioterapia: biossegurança, equipamentos e manutenção.","pdf":"https://arquivos.qconcursos.com/prova/arquivo_prova/137917/vunesp-2025-unesp-assistente-tecnico-administrativo-ii-area-de-atuacao-fisioterapia-edital-n-53-prova.pdf","b":[{"t":"h","x":"Língua Portuguesa"},{"t":"txt","x":"<p class=\"t\">Leia a citação a seguir, de Gilbert Keith Chesterton, para responder às questões de 01 a 03:</p><p>O certo é certo, mesmo que ninguém o faça. O errado é errado, mesmo que todos estejam errados sobre isso.</p><p class=\"src\">(Disponível em: https://www.chesterton.org. Tradução livre)</p>"},{"t":"q","n":1,"stem":"Pode-se deduzir dessa citação que","o":["as ações certas de alguns influenciam os erros de outros.","não importa o que se faça, pois haverá quem faça tudo diferente.","é inviável distinguir as ações humanas corretas das incorretas.","o certo e o errado baseiam-se em princípios socialmente estabelecidos.","todos os que estão errados evitam praticar atos errados."],"a":"D","e":"A frase diz que certo e errado não dependem de quantas pessoas agem de um jeito ou de outro. Eles se apoiam em <b>princípios</b>. Gabarito oficial: D. As outras atribuem à citação ideias que ela não tem."},{"t":"q","n":2,"stem":"Considere o enunciado a seguir, em que devem ser empregados os verbos destacados na citação: Na ocasião, os técnicos recomendaram que se alguma coisa para contornar as dificuldades que os usuários porventura enfrentando. Assinale a alternativa em que esses verbos preenchem as lacunas de acordo com a norma-padrão de correlação verbal.","o":["fazia... estão","fez ... estariam","fizesse ... estivessem","faz ... estão","fizer ... estiverem"],"a":"C","e":"“Recomendaram” está no pretérito, e por isso pede o subjuntivo no pretérito imperfeito: “que se <b>fizesse</b> … que os usuários porventura <b>estivessem</b> enfrentando”."},{"t":"q","n":3,"stem":"É correto afirmar que o trecho destacado na passagem – O errado é errado, <b>mesmo que todos estejam errados sobre isso</b>. – estabelece, no contexto, relação de sentido de","o":["concessão e pode ser substituído, sem prejuízo ao sentido, por “apesar de todo mundo estar errado sobre isso”.","causa e pode ser substituído, sem prejuízo ao sentido, por “visto que todo mundo está errado sobre isso”.","oposição e pode ser substituído, sem prejuízo ao sentido, por “mas todo mundo está errado sobre isso”.","conclusão e pode ser substituído, sem prejuízo ao sentido, por “portanto, todo mundo está errado sobre isso”.","condição e pode ser substituído, sem prejuízo ao sentido, por “contanto que todo mundo esteja errado sobre isso”."],"a":"A","e":"“Mesmo que” indica <b>concessão</b> e equivale a “apesar de todo mundo estar errado sobre isso”."},{"t":"txt","x":"<p class=\"t\">Leia o texto a seguir para responder às questões de 04 a 09.</p><p>O século 21, tudo indica, não será mais predominantemente norte-americano e menos ainda europeu. Com velocidade surpreendente, envelheceu a ideia de uma modernidade baseada na expansão contínua da mercantilização de todas as coisas e de todas as relações humanas. Já podemos dizer com certeza que a modernidade dita neoliberal, que se disseminou com o colapso do socialismo de Estado, pecou por déficit crescentemente intolerável de imaginação política. A interdependência entre os sistemas econômicos deu muitíssimos passos à frente, com a circulação instantânea do dinheiro, a mundialização das cadeias de valor, a mobilidade intensa de mercadorias e pessoas. E uma vasta classe média global, apesar das desigualdades, apareceu no cenário.</p><p>Tornamo-nos, existencialmente, interdependentes, até mesmo num sentido particularmente negativo, com a crise – inédita e crescente – das relações com a natureza, a disseminação de armas nucleares e a possibilidade de aplicação de inteligência artificial aos conflitos armados. De nenhum desses possíveis desastres, como é óbvio, estará a salvo qualquer povo eleito ou nação excepcional. Sem política, e deixado a si mesmo, esse movimento das coisas pareceu, e parece, dotado de uma inquietante autonomia, acontecendo fantasmagoricamente acima da consciência e da ação coletiva.</p><p>Sempre se soube que a unidade tendencial do gênero humano, este belo sonho multissecular, não se daria como um processo automático e sem turbulência, ainda que a complexidade das situações recorrentemente nos espante. O descompasso entre o mundo amplo da economia e o âmbito estritamente nacional da política terminou por produzir seus frutos daninhos na forma de uma imensa crise da globalização.</p><p class=\"src\">(Luiz Sérgio Henriques, “O Brasil no espelho do mundo”. Disponível em: https://www.estadao.com.br/opinião)</p>"},{"t":"q","n":4,"stem":"São aspectos críticos no século 21 apontados pelo autor:","o":["desastres em diversas nações e políticas desatualizadas de união dos povos.","a expansão de armas nucleares e o uso da inteligência artificial em guerras.","mercantilização de relações humanas e fácil circulação de moedas e pessoas.","perda da soberania dos norte-americanos e europeus na modernidade.","falta de uma efetiva ação coletiva para consolidar a unidade do gênero humano."],"a":"B","e":"O 2º parágrafo cita, como interdependência negativa, “a disseminação de armas nucleares e a possibilidade de aplicação de inteligência artificial aos conflitos armados”."},{"t":"q","n":5,"stem":"O autor evita que sua afirmação soe como categórica e inquestionável no seguinte trecho:","o":["Já podemos dizer com certeza... (1º parágrafo)","... apesar das desigualdades... (1º parágrafo)","De nenhum desses possíveis desastres, como é óbvio... (2º parágrafo)","... esse movimento das coisas pareceu, e parece, dotado... (2º parágrafo)","Sempre se soube... (3º parágrafo)"],"a":"D","e":"Em “pareceu, e parece, dotado…”, o verbo <b>parecer</b> atenua a afirmação e evita que ela soe categórica (modalização)."},{"t":"q","n":6,"stem":"Observe o sentido das expressões destacadas nesta passagem do 2º parágrafo: Tornamo-nos, existencialmente, interdependentes, <b>até mesmo</b> num sentido particularmente negativo, <b>com a crise</b> – inédita e crescente – das relações com a natureza, a disseminação de armas nucleares e a possibilidade de aplicação de inteligência artificial aos conflitos armados. Assinale a alternativa em que essas expressões estão substituídas, respectivamente, sem prejuízo ao sentido original.","o":["igualmente ... pela crise","além de ... junto à crise","acertadamente ... em meio à crise","de preferência ... em face da crise","inclusive ... graças à crise"],"a":"E","e":"“Até mesmo” = <b>inclusive</b>. “Com a crise” tem valor de causa, então pode ser trocado por “<b>graças à</b> crise”."},{"t":"q","n":7,"stem":"A construção entre parênteses que substitui a destacada, de acordo com a norma-padrão de colocação pronominal, é:","o":["... a modernidade dita neoliberal, que se disseminou (a qual disseminou-se) com o colapso do socialismo...","Tornamo-nos (Nos tornamos), existencialmente, interdependentes...","Sempre se soube (Soube-se o tempo todo) que a unidade tendencial do gênero humano...","... este belo sonho mult
